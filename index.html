<style>
/* Layout: warehouse ledger — fixed side rail of sections, working area of tables and entry forms; bin-label chips for codes. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#16201B; --muted:#5D6A63; --line:#D8DFD9;
  --accent:#1D5B8F; --accent-ink:#FFFFFF; --accent-soft:#E1EBF4;
  --ok:#2E7A4D; --ok-soft:#E1F0E6; --warn:#A86A12; --warn-soft:#F8ECD6; --bad:#B0322A; --bad-soft:#F7E1DE;
  --rail:#1B2621; --rail-ink:#D9E2DC; --rail-muted:#8A9A91;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --sunk:#121a16; --ink:#E4EBE6; --muted:#93A199; --line:#28332D;
  --accent:#78AEE0; --accent-ink:#0D1B28; --accent-soft:#1C2E3E;
  --ok:#62BD87; --ok-soft:#183026; --warn:#E3AA4E; --warn-soft:#33281A; --bad:#EA6B61; --bad-soft:#3A1F1C;
  --rail:#0B100D; --rail-ink:#D9E2DC; --rail-muted:#7F8E86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --sunk:#121a16; --ink:#E4EBE6; --muted:#93A199; --line:#28332D;
  --accent:#78AEE0; --accent-ink:#0D1B28; --accent-soft:#1C2E3E;
  --ok:#62BD87; --ok-soft:#183026; --warn:#E3AA4E; --warn-soft:#33281A; --bad:#EA6B61; --bad-soft:#3A1F1C;
  --rail:#0B100D; --rail-ink:#D9E2DC; --rail-muted:#7F8E86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.01em;line-height:1.05}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--rail-ink);text-decoration:none;padding:8px 10px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);font-weight:600}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-muted)}
.main{min-width:0;padding-block:24px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.pb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi{overflow:hidden}
.kpi .v{overflow-wrap:anywhere;font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tbody tr:hover{background:var(--sunk)}
tr.click{cursor:pointer}
tfoot td{font-weight:600;background:var(--sunk)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.code{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--sunk);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:20px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--sunk);color:var(--muted)}
.neg{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:0}
.qty{width:110px;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>input,label.f>select{color:var(--ink);font-size:14px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 120px auto auto;gap:8px;align-items:center}
.line.p3{grid-template-columns:minmax(0,1fr) 120px 120px auto}
.hint{font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 5px 5px 0}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.right{margin-left:auto}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;gap:14px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--rail)}
  .brand span,.rail .foot{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;min-width:0}
  .nav a{white-space:nowrap;padding:6px 9px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  h1{font-size:24px}
  .line,.line.p3{grid-template-columns:minmax(0,1fr) 96px auto}
  .line.p3 .ex{grid-column:1/-1}
  .qty{width:96px}
  .kpi .v{font-size:22px}
  .kpis{gap:8px}
}

/* --- super app additions --- */

.authcard{background:var(--surface);border-radius:10px;width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.authcard .brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:28px;color:var(--ink)}

.authcard form{display:flex;flex-direction:column;gap:12px}

.err{color:var(--bad);font-size:13px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>.ch{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-weight:600}
.task{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--muted)}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}

.ann{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
.money{font-variant-numeric:tabular-nums}

.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}

.setup{max-width:760px;display:flex;flex-direction:column;gap:14px}

<script>
(() => {
"use strict";
const ROLES = {admin:"Admin", gudang:"Gudang & produksi", keuangan:"Keuangan", staf:"Staf", menunggu:"Menunggu persetujuan", nonaktif:"Nonaktif"};
const ROLE_HINT = {admin:"Semua menu, termasuk keuangan, data master, dan pengguna", gudang:"Catat & lihat gudang, tugas, pengumuman", keuangan:"Keuangan, lihat gudang, tugas, pengumuman", staf:"Tugas, pengumuman, lihat gudang", menunggu:"Belum bisa membuka data", nonaktif:"Tidak bisa masuk"};
const ACTIVE = ["admin","gudang","keuangan","staf"];
const NAV = [
  {g:"Umum", items:[["beranda","Beranda"],["tugas","Tugas"],["pengumuman","Pengumuman"]]},
  {g:"Gudang & produksi", items:[["bahan","Stok bahan baku"],["produk","Stok produk jadi"],["catat","Catat transaksi","editGudang"],["riwayat","Riwayat"],["rencana","Rencana produksi"],["laporan","Laporan produksi"],["master","Data master"]]},
  {g:"Keuangan", need:"viewKeu", items:[["kas","Buku kas"],["keuangan","Laporan keuangan"]]},
  {g:"Admin", need:"admin", items:[["pengguna","Pengguna & data"]]}
];
const GUDANG_VIEWS = ["bahan","produk","catat","riwayat","rencana","laporan","master"];
const S = {
  view:"beranda", ready:{}, db:true, user:null, uid:null, canWrite:false, canEdit:false,
  produk:[], bahan:[], bom:{}, setting:{komisiDefault:3500,komisi:{},arsip:[]}, rencana:{items:[]}, trx:{},
  calc:null, names:{},
  ui:{ bahanQ:"", bahanF:"semua", produkQ:"", produkAll:false, catatTab:"produksi", rwMonth:"", rwType:"semua", rwQ:"",
       lapMonth:"", rencanaQ:"", masterTab:"produk", tugasF:"saya", tugasDone:false, kasMonth:"", kasJenis:"semua",
       keuYear:"", keuTab:"laporan", keuPeriod:"tahun" },
  form:null, modal:null,
  authReady:false, auth:null, profile:null, users:{}, tugas:[], pengumuman:[], kas:{}, keu:null,
  authMode:"masuk", authErr:"", authInfo:"", authBusy:false, af:{email:"",pass:"",nama:""},
  kasForm:null, annForm:{judul:"",isi:"",penting:false}, keuEdit:null, subsOn:false, unsub:[], importArmed:false
};
function role(){ return (S.profile && S.profile.role) || "none"; }
function can(x){
  const r=role(); if(r==="admin") return true;
  return ({viewGudang:ACTIVE.includes(r), editGudang:r==="gudang", viewKeu:r==="keuangan", editKeu:r==="keuangan", tugas:ACTIVE.includes(r)})[x] || false;
}
const CLIENT = Math.random().toString(36).slice(2);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("id-ID",{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("id-ID",{maximumFractionDigits:0});
const fmt = n => nf.format(Math.round((+n||0)*100)/100);
const rp = n => "Rp" + nf0.format(Math.round(+n||0));
const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BLNF = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(new Date());
const fdate = s => { if(!s) return "—"; const [y,m,d]=s.split("-"); return d+" "+BLN[+m-1]+" "+y; };
const fmonth = k => { if(k==="tanpa-tanggal") return "Tanpa tanggal"; const [y,m]=k.split("-"); return BLNF[+m-1]+" "+y; };
const smonth = k => { const [y,m]=k.split("-"); return BLN[+m-1]+" "+y.slice(2); };
const num = v => { if(typeof v==="number") return v; const s=String(v??"").trim().replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?n:NaN; };
const sizeLabel = ml => ml>=1000 ? (ml/1000)+" L" : ml+" mL";
const rid = () => Math.random().toString(36).slice(2,10);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const monthOf = t => t ? t.slice(0,7) : "tanpa-tanggal";
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- calculations ---------- */
function usage(prodTot){ // ceil per product total, as the original sheet does
  const u = {};
  for(const p in prodTot){ for(const b of (S.bom[p]||[])){ u[b.bahan]=(u[b.bahan]||0)+Math.ceil(prodTot[p]*b.qty-1e-9); } }
  return u;
}
function compute(){
  const rows={pembelian:[],produksi:[],keluar:[]};
  for(const k in S.trx){ const d=S.trx[k]; for(const t in rows){ for(const r of (d[t]||[])) rows[t].push({...r,_m:k,_t:t}); } }
  const masuk={}, reject={}, prodTot={}, keluarTot={}, prod30={}, lastIn={};
  const from30 = addDays(TODAY,-30);
  for(const r of rows.pembelian){ const q=+r.qty||0; if(r.reject) reject[r.bahan]=(reject[r.bahan]||0)+q; else { masuk[r.bahan]=(masuk[r.bahan]||0)+q; if(r.tgl && (!lastIn[r.bahan]||r.tgl>lastIn[r.bahan])) lastIn[r.bahan]=r.tgl; } }
  for(const r of rows.produksi){ const q=+r.qty||0; prodTot[r.produk]=(prodTot[r.produk]||0)+q; if(r.tgl && r.tgl>=from30 && r.tgl<=TODAY) prod30[r.produk]=(prod30[r.produk]||0)+q; }
  for(const r of rows.keluar){ keluarTot[r.produk]=(keluarTot[r.produk]||0)+(+r.qty||0); }
  const pakai = usage(prodTot), pakai30 = usage(prod30);
  const names = new Set([...S.bahan.map(b=>b.nama), ...Object.keys(masuk), ...Object.keys(reject), ...Object.keys(pakai)]);
  const minMap = Object.fromEntries(S.bahan.map(b=>[b.nama,+b.min||0]));
  const bahan = [...names].map(n=>{
    const m=masuk[n]||0, rj=reject[n]||0, pk=pakai[n]||0, stok=m-rj-pk, p30=pakai30[n]||0, perHari=p30/30;
    const hari = perHari>0 ? stok/perHari : null; const min=minMap[n]||0;
    let st="ok"; if(stok<0) st="bad"; else if((hari!==null && hari<14) || (min>0 && stok<min)) st="warn"; else if(p30===0) st="idle";
    return {nama:n, masuk:m, reject:rj, pakai:pk, stok, p30, hari, min, st, lastIn:lastIn[n]||"", known:n in minMap};
  }).sort((a,b)=>a.nama.localeCompare(b.nama,"id"));
  const produk = S.produk.map(p=>{
    const pr=prodTot[p.nama]||0, kl=keluarTot[p.nama]||0, stok=pr-kl;
    return {...p, prod:pr, keluar:kl, stok, dus: p.isiKardus? stok/p.isiKardus : 0, p30:prod30[p.nama]||0};
  });
  const months = Object.keys(S.trx).filter(k=>k!=="tanpa-tanggal").sort();
  S.calc = {rows, bahan, produk, months, prodTot, undated: (S.trx["tanpa-tanggal"]||{}),
    undatedCount: ["pembelian","produksi","keluar"].reduce((a,t)=>a+((S.trx["tanpa-tanggal"]||{})[t]||[]).length,0)};
}
const PMAP = () => Object.fromEntries(S.produk.map(p=>[p.nama,p]));
function monthReport(m){
  const pm=PMAP(); const rows=S.calc.rows.produksi.filter(r=>r._m===m);
  const days={}, sizes=new Set(), brand={}, brandSizes=new Set();
  let botol=0, liter=0, hpp=0;
  for(const r of rows){ const p=pm[r.produk]; const ml=p?p.ml:0; const q=+r.qty||0;
    sizes.add(ml); days[r.tgl]=days[r.tgl]||{}; days[r.tgl][ml]=(days[r.tgl][ml]||0)+q;
    const b=p?p.merek:"Lainnya"; brand[b]=brand[b]||{}; brand[b][ml]=brand[b][ml]||{q:0,v:0}; brand[b][ml].q+=q; brand[b][ml].v+=q*(p?+p.hpp||0:0);
    botol+=q; liter+=q*ml/1000; hpp+=q*(p?+p.hpp||0:0); }
  const tarif = S.setting.komisi?.[m] ?? S.setting.komisiDefault ?? 0;
  const arsip = (S.setting.arsip||[]).find(a=>a.bulan===m);
  return {m, rows, days, sizes:[...sizes].sort((a,b)=>a-b), brand, botol, liter, hpp, tarif, komisi:liter*tarif, arsip};
}
function monthlySeries(){
  const out={}; const pm=PMAP();
  for(const a of (S.setting.arsip||[])) out[a.bulan]={bulan:a.bulan, arsip:a.liter, input:null};
  for(const r of S.calc.rows.produksi){ if(r._m==="tanpa-tanggal") continue; const p=pm[r.produk]; out[r._m]=out[r._m]||{bulan:r._m,arsip:null,input:0}; out[r._m].input=(out[r._m].input||0)+(+r.qty||0)*(p?p.ml:0)/1000; }
  return Object.values(out).sort((a,b)=>a.bulan.localeCompare(b.bulan));
}

/* ---------- small renderers ---------- */
const pill = (st, txt) => `<span class="pill p-${st}">${esc(txt)}</span>`;
const stTxt = {ok:"Aman", warn:"Menipis", bad:"Minus", idle:"Tidak dipakai"};
function barChart(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||200, pl=44, pb=24, pt=10; const max=Math.max(1,...data.map(d=>d.v||0));
  const step=niceStep(max/4); const top=Math.ceil(max/step)*step; const bw=(W-pl-8)/data.length;
  let g=""; for(let v=0; v<=top+1e-9; v+=step){ const y=pt+(H-pt-pb)*(1-v/top); g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${esc(short(v))}</text>`; }
  let b=""; data.forEach((d,i)=>{ const h=(H-pt-pb)*((d.v||0)/top); const x=pl+i*bw+bw*.18; const w=bw*.64;
    b+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${Math.max(0,h)}" rx="2" fill="${d.muted?'var(--line)':'var(--accent)'}"><title>${esc(d.title||d.l)}: ${fmt(d.v)}</title></rect>`;
    if(data.length<=14 || i%2===0) b+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Grafik')}">${g}${b}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function short(v){ return v>=1e6? nf.format(v/1e6)+"jt" : v>=1000? nf.format(v/1000)+"rb" : nf.format(v); }
function opts(list, sel, ph){ return (ph?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(v)}</option>`).join(""); }

  }

function lapRows(){

/* =================== Firebase data layer =================== */
let fb=null, auth=null, fs=null;
async function mutate(key, fn, col){
  col = col || "trx";
  const ref = fs.collection(col).doc(key);
  await fs.runTransaction(async tx => {
    const s = await tx.get(ref);
    const body = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};
    if(col==="trx"){ for(const t of ["pembelian","produksi","keluar"]) body[t]=body[t]||[]; } else body.items=body.items||[];
    fn(body);
    const empty = col==="trx" ? (!body.pembelian.length && !body.produksi.length && !body.keluar.length) : !body.items.length;
    if(empty){ if(s.exists) tx.delete(ref); } else tx.set(ref, body);
  });
}
async function saveMaster(doc, body){ await fs.collection("master").doc(doc).set(body); }
let rencanaTimer=null;
function saveRencana(){ clearTimeout(rencanaTimer); rencanaTimer=setTimeout(async()=>{ try{ await fs.collection("shared").doc("rencana").set({items:S.rencana.items||[]}); }catch(e){ writeErr(e); } rencanaTimer=null; },800); }
function stamp(o){ return {...o, by:S.uid||null, at:new Date().toISOString()}; }
function writeErr(e){
  const c=e && e.code;
  if(c==="permission-denied") toast("Akun Anda tidak punya izin untuk perubahan ini.");
  else if(c==="unavailable") toast("Sedang offline. Coba lagi setelah internet tersambung.");
  else toast("Gagal menyimpan: "+((e&&e.message)||e));
}
function gudangReady(){ return ["produk","bahan","bom","setting","trx"].every(k=>S.ready[k]); }
let scheduled=false;
function schedule(){ if(scheduled) return; scheduled=true; requestAnimationFrame(()=>{ scheduled=false; if(gudangReady()) compute(); render(); if(S.modal && S.modal.kind==="bahan") renderModal(); }); }
function stopSubs(){ S.unsub.forEach(f=>{ try{ f(); }catch(e){} }); S.unsub=[]; S.subsOn=false; S.ready={}; }
function startSubs(){
  if(S.subsOn) return; S.subsOn=true;
  const err=k=>e=>{ S.ready[k]=true; if(!(e && e.code==="permission-denied")) toast("Sebagian data gagal dimuat ("+k+")."); schedule(); };
  const doc=(path,k,apply)=>S.unsub.push(fs.doc(path).onSnapshot(s=>{ apply(s.exists?s.data():null); S.ready[k]=true; schedule(); }, err(k)));
  const col=(path,k,apply)=>S.unsub.push(fs.collection(path).onSnapshot(qs=>{ apply(qs.docs.map(d=>Object.assign({id:d.id}, d.data()))); S.ready[k]=true; schedule(); }, err(k)));
  doc("master/produk","produk",d=>S.produk=(d&&d.items)||[]);
  doc("master/bahan","bahan",d=>S.bahan=(d&&d.items)||[]);
  doc("master/bom","bom",d=>S.bom=(d&&d.items)||{});
  doc("master/setting","setting",d=>S.setting=d||{komisiDefault:3500,komisi:{},arsip:[]});
  doc("shared/rencana","rencana",d=>{ if(!rencanaTimer || S.view!=="rencana") S.rencana=d||{items:[]}; });
  col("trx","trx",docs=>{ const o={}; docs.forEach(d=>{ o[d.id]={pembelian:d.pembelian||[],produksi:d.produksi||[],keluar:d.keluar||[]}; }); S.trx=o; });
  col("users","users",docs=>{ S.users=Object.fromEntries(docs.map(d=>[d.id,d])); });
  col("tugas","tugas",docs=>S.tugas=docs);
  col("pengumuman","pengumuman",docs=>S.pengumuman=docs);
  if(can("viewKeu")){
    col("kas","kas",docs=>{ const o={}; docs.forEach(d=>o[d.id]=d.items||[]); S.kas=o; });
    doc("keuangan/setting","keu",d=>S.keu=d);
  }
}

function nameOf(uid){
  if(!uid) return `<span class="muted">Impor spreadsheet</span>`;
  const u=S.users[uid]; return esc(u ? (u.nama||u.email) : "Pengguna");
}
function userName(uid){ const u=S.users[uid]; return u ? (u.nama||u.email) : "—"; }
function readOnlyNote(){ return S.canWrite ? "" : `<div class="note info">Akun Anda hanya bisa melihat data gudang. Minta admin mengubah peran Anda menjadi <b>Gudang & produksi</b> untuk mencatat transaksi.</div>`; }
function download(name, rows){
  try{ const blob=new Blob(["﻿"+csv(rows)],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
  catch(e){ copyRows(rows); }
}
function csv(rows){ return rows.map(r=>r.map(v=>{ const s=typeof v==="number"?String(Math.round(v*100)/100).replace(".",","):String(v??""); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\n"); }
function copyRows(rows){ const tsv=rows.map(r=>r.map(v=>typeof v==="number"?String(Math.round(v*100)/100).replace(".",","):v).join("\t")).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(tsv):Promise.reject()).then(()=>toast("Tabel disalin. Tempel di Excel atau Google Sheets."),()=>toast("Browser menolak menyalin otomatis.")); }
const fdt = iso => { if(!iso) return ""; const d=new Date(iso); return pad(d.getDate())+" "+BLN[d.getMonth()]+" "+d.getFullYear()+", "+pad(d.getHours())+":"+pad(d.getMinutes()); };
function loadingBox(t){ return `<div class="loading">${esc(t||"Memuat data…")}</div>`; }

/* =================== Tugas =================== */
const TST = {belum:"Belum dikerjakan", proses:"Sedang dikerjakan", selesai:"Selesai"};
const isLate = t => t.tenggat && t.tenggat < TODAY && t.status!=="selesai";
const byDue = (a,b) => (a.tenggat||"9999").localeCompare(b.tenggat||"9999") || (b.createdAt||"").localeCompare(a.createdAt||"");
function activeUsers(){ return Object.values(S.users).filter(u=>ACTIVE.includes(u.role)).sort((a,b)=>(a.nama||"").localeCompare(b.nama||"","id")); }
function taskCard(t){
  const late=isLate(t);
  const next = t.status==="belum" ? ["proses","Mulai"] : t.status==="proses" ? ["selesai","Selesai"] : ["belum","Buka lagi"];
  return `<div class="task ${late?"late":""}" role="button" tabindex="0" data-act="t-open" data-v="${esc(t.id)}">
    <div class="tt">${t.prioritas==="penting"?pill("bad","Penting")+" ":""}${esc(t.judul)}</div>
    <div class="meta"><span>Untuk: ${esc(t.untuk?userName(t.untuk):"Siapa saja")}</span>${t.tenggat?`<span class="${late?"neg":""}">Tenggat ${fdate(t.tenggat)}</span>`:""}</div>
    ${t.catatan?`<div class="hint" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.catatan.length>140?t.catatan.slice(0,140)+"…":t.catatan)}</div>`:""}
    <div class="row"><button class="btn sm" data-act="t-move" data-v="${esc(t.id)}" data-s="${next[0]}">${next[1]}</button><span class="hint right">oleh ${esc(userName(t.createdBy))}</span></div>
  </div>`;
}
V.tugas = () => {
  const f=S.ui.tugasF; const cutoff=addDays(TODAY,-30);
  let list=S.tugas.filter(t=> f==="saya" ? t.untuk===S.uid : f==="dibuat" ? t.createdBy===S.uid : true);
  const hidden=list.filter(t=>t.status==="selesai" && (t.selesaiAt||t.updatedAt||"").slice(0,10)<cutoff).length;
  if(!S.ui.tugasDone) list=list.filter(t=>!(t.status==="selesai" && (t.selesaiAt||t.updatedAt||"").slice(0,10)<cutoff));
  const cols=["belum","proses","selesai"];
  return `<div class="head"><div><div class="eyebrow">${S.tugas.filter(t=>t.status!=="selesai").length} tugas terbuka</div><h1>Tugas</h1></div>
    <div class="row"><div class="seg">${[["saya","Tugas saya"],["dibuat","Saya buat"],["semua","Semua"]].map(([k,l])=>`<button data-act="tugasF" data-v="${k}" class="${f===k?"on":""}">${l}</button>`).join("")}</div>
    <button class="btn pri" data-act="t-new">+ Tugas baru</button></div></div>
  ${!S.ready.tugas?loadingBox():`<div class="board">${cols.map(c=>{ const items=list.filter(t=>(t.status||"belum")===c).sort(byDue);
    return `<section class="col"><div class="ch"><span>${TST[c]}</span><span class="code">${items.length}</span></div>${items.map(taskCard).join("")||`<div class="hint" style="padding:8px">Kosong.</div>`}</section>`; }).join("")}</div>
  ${hidden||S.ui.tugasDone?`<div style="margin-top:12px"><label class="row hint"><input type="checkbox" id="tugasDone" data-ui="tugasDone" ${S.ui.tugasDone?"checked":""}> Tampilkan tugas selesai lebih dari 30 hari lalu${hidden?` (${hidden})`:""}</label></div>`:""}`}`;
};

      ${M.isNew?"":`<div class="hint">Dibuat oleh ${esc(userName(d.createdBy))} · ${fdt(d.createdAt)}${d.updatedAt&&d.updatedAt!==d.createdAt?` · diubah ${fdt(d.updatedAt)}`:""}</div>`}
    </div>
    <div class="mf">${canDel?`<button class="btn danger ${M.armed?"armed":""}" data-act="t-del">${M.armed?"Klik lagi untuk menghapus":"Hapus"}</button>`:""}<span class="right"></span>
      <button class="btn" data-act="modal-close">Batal</button><button class="btn pri" data-act="t-save" ${M.busy?"disabled":""}>Simpan</button></div>

async function saveTugas(){
  const M=S.modal, d=M.d; if(!String(d.judul||"").trim()){ toast("Judul tugas wajib diisi."); return; }
  const now=new Date().toISOString();
  const body={judul:String(d.judul).trim(), catatan:String(d.catatan||"").trim(), untuk:d.untuk||"", tenggat:d.tenggat||"", prioritas:d.prioritas||"biasa", status:d.status||"belum", updatedAt:now, updatedBy:S.uid};
  if(body.status==="selesai" && M.orig!=="selesai") body.selesaiAt=now;
  M.busy=true; renderModal();
  try{
    if(M.isNew){ body.createdBy=S.uid; body.createdAt=now; await fs.collection("tugas").doc().set(body); }
    else await fs.collection("tugas").doc(M.id).update(body);
    S.modal=null; renderModal(); toast(M.isNew?"Tugas dibuat.":"Tugas disimpan.");
  }catch(e){ M.busy=false; renderModal(); writeErr(e); }
}

  if(newest && newest>(S.profile.lastSeenAnn||"")) fs.collection("users").doc(S.uid).update({lastSeenAnn:newest}).catch(()=>{});

const KEU_DEFAULT = {
  kategoriMasuk:["Komisi PTCN","Penjualan","Pinjaman diterima","Lain-lain"],
  kategoriKeluar:["Pembelian bahan baku","Gaji & upah","Listrik","Transport & pengiriman","Sewa","Perawatan alat","Pembayaran pinjaman","Lain-lain"],
  akun:[{nama:"Kas tunai",saldoAwal:0},{nama:"Bank",saldoAwal:0}]
};
function keu(){ const k=S.keu||{}; return {kategoriMasuk:k.kategoriMasuk||KEU_DEFAULT.kategoriMasuk, kategoriKeluar:k.kategoriKeluar||KEU_DEFAULT.kategoriKeluar, akun:k.akun&&k.akun.length?k.akun:KEU_DEFAULT.akun}; }
function kasAll(){ const out=[]; for(const m in S.kas) for(const r of S.kas[m]) out.push({...r,_m:m}); return out; }
function kasSum(rows){ let masuk=0, keluar=0; for(const r of rows){ if(r.jenis==="masuk") masuk+=+r.jumlah||0; else keluar+=+r.jumlah||0; } return {masuk,keluar,net:masuk-keluar}; }
function saldoAkun(){ const k=keu(); const all=kasAll(); return k.akun.map(a=>{ const rows=all.filter(r=>r.akun===a.nama); const s=kasSum(rows); return {...a, ...s, saldo:(+a.saldoAwal||0)+s.net}; }); }
function newKasForm(){ const k=keu(); return {tgl:TODAY, jenis:"keluar", kategori:"", akun:k.akun[0].nama, jumlah:"", ket:"", busy:false}; }

async function submitKas(){
  const F=S.kasForm; const j=num(F.jumlah);
  if(!F.tgl){ toast("Isi tanggal."); return; } if(!F.kategori){ toast("Pilih kategori."); return; } if(!(j>0)){ toast("Jumlah harus lebih dari 0."); return; }
  const rec=stamp({id:rid(), tgl:F.tgl, jenis:F.jenis, kategori:F.kategori, akun:F.akun, jumlah:j, ket:String(F.ket||"").trim()});
  F.busy=true; render();
  try{ await mutate(monthOf(F.tgl), b=>b.items.push(rec), "kas"); const keep={tgl:F.tgl, jenis:F.jenis, akun:F.akun}; S.kasForm={...newKasForm(), ...keep}; S.ui.kasMonth=monthOf(F.tgl); toast("Transaksi kas disimpan."); }
  catch(e){ F.busy=false; writeErr(e); }
  render();
}
async function saveKasEdit(){
  const M=S.modal, d={...M.d}; const j=num(d.jumlah); if(!(j>0)){ toast("Jumlah harus lebih dari 0."); return; } if(!d.tgl){ toast("Isi tanggal."); return; }
  d.jumlah=j; delete d._m; d.editBy=S.uid; d.editAt=new Date().toISOString(); const nm=monthOf(d.tgl);
  M.busy=true; renderModal();
  try{
    if(nm===M.m) await mutate(M.m, b=>{ const i=b.items.findIndex(x=>x.id===M.id); if(i>=0) b.items[i]=d; }, "kas");
    else { await mutate(nm, b=>b.items.push(d), "kas"); await mutate(M.m, b=>{ b.items=b.items.filter(x=>x.id!==M.id); }, "kas"); }
    S.modal=null; renderModal(); toast("Perubahan disimpan.");
  }catch(e){ M.busy=false; renderModal(); writeErr(e); }
}
function barChart2(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||210, pl=52, pb=24, pt=10; const max=Math.max(1,...data.flatMap(d=>[d.a||0,d.b||0]));
  const step=niceStep(max/4); const top=Math.ceil(max/step)*step; const bw=(W-pl-8)/data.length;

async function doImport(){
  const f=$("#importFile") && $("#importFile").files[0]; if(!f){ toast("Pilih file data-awal.json dulu."); return; }
  if(Object.keys(S.trx).length && !S.importArmed){ S.importArmed=true; render(); return; }
  S.importArmed=false;
  let d; try{ d=JSON.parse(await f.text()); }catch(e){ toast("File tidak bisa dibaca. Pastikan memilih data-awal.json."); return; }
  if(!d || !d.master || !d.trx){ toast("Isi file tidak sesuai format data-awal.json."); return; }
  try{
    const batch=fs.batch(); let n=0;
    for(const k in d.master){ batch.set(fs.collection("master").doc(k), d.master[k]); n++; }
    for(const k in (d.shared||{})){ batch.set(fs.collection("shared").doc(k), d.shared[k]); n++; }
    for(const k in d.trx){ batch.set(fs.collection("trx").doc(k), d.trx[k]); n++; }
    await batch.commit(); toast("Impor selesai: "+n+" dokumen."); render();
  }catch(e){ writeErr(e); }
}

function authMsg(e){
  const c=e&&e.code||"";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c)) return "Email atau password salah.";
  if(c==="auth/email-already-in-use") return "Email ini sudah terdaftar. Silakan masuk.";
  if(c==="auth/weak-password") return "Password minimal 6 karakter.";
  if(c==="auth/invalid-email") return "Format email tidak valid.";
  if(c==="auth/too-many-requests") return "Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.";
  if(c==="auth/operation-not-allowed") return "Login email/password belum diaktifkan di Firebase (Authentication → Sign-in method).";
  if(c==="auth/unauthorized-domain") return "Alamat situs ini belum diizinkan di Firebase (Authentication → Settings → Authorized domains).";
  if(c==="auth/network-request-failed") return "Tidak ada koneksi internet.";
  return (e&&e.message)||"Terjadi kesalahan.";
}
async function doAuth(){
  const m=S.authMode, F=S.af; S.authErr=""; S.authInfo="";

    else if(m==="daftar"){ if(!String(F.nama).trim()){ throw {message:"Isi nama lengkap."}; } S.pendingNama=String(F.nama).trim(); await auth.createUserWithEmailAndPassword(email, F.pass); }

    F.pass="";

  S.authBusy=false; render();

    <div class="brand"><b>${esc(NAMA_USAHA)} Super App</b><span>${esc(S.profile.email||"")}</span></div>
    ${r==="nonaktif"?`<h2>Akun dinonaktifkan</h2><p class="sub">Hubungi admin bila ini keliru.</p>`
      :`<h2>Menunggu persetujuan admin</h2><p class="sub">Akun Anda sudah terdaftar. Halaman ini akan terbuka sendiri begitu admin memilihkan peran untuk Anda.</p>`}
    <button class="btn" data-act="logout">Keluar</button></div></div>`;
}
function setupScreen(){
  return `<div class="main" style="max-width:none"><div class="setup">
    <div class="eyebrow">Pemasangan</div><h1>Aplikasi belum tersambung ke Firebase</h1>
    <p>Buka file <code>index.html</code> dengan editor teks (Notepad / TextEdit), cari bagian <code>FIREBASE_CONFIG</code> di bagian atas, lalu tempel konfigurasi dari Firebase Console (Project settings → General → Your apps → Config). </p>
    <p class="hint">Ikuti panduan pemasangan yang menyertai file ini.</p></div></div>`;
}

/* =================== render =================== */
function shell(){
  if($("#main")) return;
  $("#root").innerHTML=`<div class="app"><aside class="rail"><div class="brand"><b>${esc(NAMA_USAHA)} Super App</b><span>Gudang · Tugas · Keuangan</span></div><nav class="nav" id="nav"></nav>
    <div class="foot"><div class="me" id="me"></div></div></aside><main class="main" id="main"></main></div>`;
}
function allowed(v){
  if(v==="catat") return can("editGudang");
  if(v==="kas"||v==="keuangan") return can("viewKeu");
  if(v==="pengguna") return role()==="admin";
  return true;
}
function renderNav(){
  const minus=S.calc&&gudangReady()?S.calc.bahan.filter(b=>b.st==="bad").length:0;
  const myLate=S.tugas.filter(t=>t.untuk===S.uid && isLate(t)).length; const un=unreadAnn();
  const pend=role()==="admin"?Object.values(S.users).filter(u=>u.role==="menunggu").length:0;
  const badge={bahan:minus, tugas:myLate, pengumuman:un, pengguna:pend};
  $("#nav").innerHTML=NAV.filter(g=>!g.need||(g.need==="admin"?role()==="admin":can(g.need))).map(g=>`<div class="navg"><div class="gl">${esc(g.g)}</div>${g.items.filter(it=>!it[2]||can(it[2])).map(([k,l])=>`<a href="#${k}" class="${S.view===k?"on":""}">${l}${badge[k]?`<span class="badge">${badge[k]}</span>`:""}</a>`).join("")}</div>`).join("");
  const p=S.profile||{}; $("#me").innerHTML=`<b>${esc(p.nama||"")}</b><span>${esc(ROLES[p.role]||"")}</span><a href="#" data-act="logout">Keluar</a>`;
}
function render(){
  const root=$("#root");
  if(!fb){ root.innerHTML=setupScreen(); return; }
  if(!S.authReady){ root.innerHTML=loadingBox("Menyiapkan…"); return; }
  if(!S.auth){ const ae=document.activeElement, aid=ae&&ae.id; root.innerHTML=authScreen(); if(aid){ const el=document.getElementById(aid); el&&el.focus(); } return; }
  if(!S.profile){ root.innerHTML=S.authErr?`<div class="authwrap"><div class="authcard"><div class="err">${esc(S.authErr)}</div><button class="btn" data-act="logout">Keluar</button></div></div>`:loadingBox("Membuka profil…"); return; }
  if(!ACTIVE.includes(role())){ root.innerHTML=pendingScreen(); return; }
  shell(); renderNav();
  const main=$("#main");
  const ae=document.activeElement, aid=ae&&ae.id&&main.contains(ae)?ae.id:null; let ss=null; try{ ss=ae.selectionStart; }catch(e){}
  const sy=window.scrollY;
  let html;
  if(GUDANG_VIEWS.includes(S.view) && !gudangReady()) html=loadingBox("Memuat data gudang…");
  else html=(V[S.view]||V.beranda)();
  main.innerHTML=html;
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,ss); }catch(e){} } }
  window.scrollTo(0,sy);
}
function renderModal(){
  const root=$("#modal"); const M=S.modal;
  if(!M){ root.innerHTML=""; return; }
  root.innerHTML = M.kind==="edit"?editModal(): M.kind==="bahan"?bahanModal(): M.kind==="prod"?prodModal(): M.kind==="tugas"?tugasModal(): M.kind==="ann"?annModal(): M.kind==="kas"?kasModal():"";
}
function live(){
  const map={"live-bahan":bahanTable,"live-produk":produkTable,"live-catat":catatPreview,"live-rw":rwTable,"live-rencana":rencanaResult};
  for(const id in map){ const el=document.getElementById(id); if(el) el.innerHTML=map[id](); }
  if(S.view==="catat" && S.form) S.form.lines.forEach((l,i)=>{ const el=document.getElementById("l-dus-"+i); if(el) el.textContent=dusHint(l); });
  const kp=document.getElementById("k-prev"); if(kp && S.kasForm) kp.textContent=num(S.kasForm.jumlah)>0?rp(num(S.kasForm.jumlah)):"";
}
function route(){
  const h=location.hash.slice(1);
  const all=NAV.flatMap(g=>g.items.map(i=>i[0]));
  S.view = all.includes(h) && allowed(h) ? h : "beranda";
  S.modal=null; renderModal(); render(); window.scrollTo(0,0);
  if(S.view==="pengumuman") markAnnSeen();
}

/* =================== new events =================== */
document.addEventListener("click", async e=>{
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act, v=a.dataset.v;
  switch(act){
    case "logout": e.preventDefault(); stopSubs(); S.authMode="masuk"; S.authErr=""; S.authInfo=""; S.af={email:"",pass:"",nama:""}; S.kasForm=null; S.keuEdit=null; S.modal=null; renderModal(); location.hash=""; await auth.signOut(); break;
    case "authMode": e.preventDefault(); S.authMode=v; S.authErr=""; S.authInfo=""; render(); break;
    case "tugasF": S.ui.tugasF=v; render(); break;
    case "t-new": S.modal={kind:"tugas", isNew:true, d:{judul:"",catatan:"",untuk:"",tenggat:"",prioritas:"biasa",status:"belum"}}; renderModal(); { const el=$("#x-judul"); el&&el.focus(); } break;
    case "t-open": { const t=S.tugas.find(x=>x.id===v); if(!t) return; S.modal={kind:"tugas", isNew:false, id:t.id, orig:t.status, d:{...t}}; renderModal(); break; }
    case "t-move": { e.stopPropagation(); const t=S.tugas.find(x=>x.id===v); if(!t) return; const now=new Date().toISOString(); const upd={status:a.dataset.s, updatedAt:now, updatedBy:S.uid}; if(a.dataset.s==="selesai") upd.selesaiAt=now;
      try{ await fs.collection("tugas").doc(v).update(upd); toast(a.dataset.s==="selesai"?"Tugas selesai.":"Status diperbarui."); }catch(err){ writeErr(err); } break; }
    case "t-save": saveTugas(); break;
    case "t-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } try{ await fs.collection("tugas").doc(M.id).delete(); S.modal=null; renderModal(); toast("Tugas dihapus."); }catch(err){ writeErr(err); } break; }
    case "a-edit": { const x=S.pengumuman.find(p=>p.id===v); if(!x) return; S.modal={kind:"ann", id:x.id, d:{...x}}; renderModal(); break; }
    case "a-save": { const M=S.modal; if(!String(M.d.judul).trim()||!String(M.d.isi).trim()){ toast("Judul dan isi wajib diisi."); return; } M.busy=true; renderModal();
      try{ await fs.collection("pengumuman").doc(M.id).update({judul:String(M.d.judul).trim(), isi:String(M.d.isi).trim(), penting:!!M.d.penting, updatedAt:new Date().toISOString()}); S.modal=null; renderModal(); toast("Pengumuman disimpan."); }catch(err){ M.busy=false; renderModal(); writeErr(err); } break; }
    case "a-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } try{ await fs.collection("pengumuman").doc(M.id).delete(); S.modal=null; renderModal(); toast("Pengumuman dihapus."); }catch(err){ writeErr(err); } break; }
    case "kasJenis": S.ui.kasJenis=v; render(); break;
    case "k-edit": { const r=(S.kas[a.dataset.m]||[]).find(x=>x.id===a.dataset.id); if(!r) return; S.modal={kind:"kas", m:a.dataset.m, id:r.id, d:{...r, jumlah:String(r.jumlah)}}; renderModal(); break; }
    case "k-save": saveKasEdit(); break;
    case "k-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } M.busy=true; renderModal();
      try{ await mutate(M.m, b=>{ b.items=b.items.filter(x=>x.id!==M.id); }, "kas"); S.modal=null; renderModal(); toast("Transaksi dihapus."); }catch(err){ M.busy=false; renderModal(); writeErr(err); } break; }
    case "keuTab": S.ui.keuTab=v; S.keuEdit=null; render(); break;
    case "ka-add": S.keuEdit.akun.push({nama:"",saldoAwal:"0"}); render(); break;
    case "ka-del": S.keuEdit.akun.splice(+v,1); render(); break;
    case "keu-save": saveKeuSetting(); break;
    case "dl-kas": { const m=S.ui.kasMonth; download("Buku Kas "+fmonth(m)+".csv", [["Tanggal","Jenis","Kategori","Akun","Keterangan","Jumlah","Dicatat oleh"],...(S.kas[m]||[]).slice().sort((x,y)=>(x.tgl||"").localeCompare(y.tgl||"")).map(r=>[r.tgl,r.jenis==="masuk"?"Pemasukan":"Pengeluaran",r.kategori,r.akun,r.ket,(r.jenis==="masuk"?1:-1)*(+r.jumlah||0),userName(r.by)])]); break; }
    case "dl-keu": { const y=S.ui.keuYear; download("Laporan Keuangan "+y+".csv", [["Bulan","Pemasukan","Pengeluaran","Laba/rugi"],...Array.from({length:12},(_,i)=>y+"-"+pad(i+1)).map(m=>{ const s=kasSum(S.kas[m]||[]); return [fmonth(m),s.masuk,s.keluar,s.net]; })]); break; }
    case "import": doImport(); break;
  }
});
document.addEventListener("input", e=>{
  const t=e.target, ds=t.dataset;
  if(ds.af!=null){ S.af[ds.af]=t.value; return; }
  if(ds.x!=null && S.modal){ S.modal.d[ds.x]= t.type==="checkbox" ? t.checked : t.value; S.modal.armed=false; if(ds.rerender){ S.modal.d.kategori=""; renderModal(); } return; }
  if(ds.kf!=null && S.kasForm){ S.kasForm[ds.kf]=t.value; if(ds.kf==="jenis"){ S.kasForm.kategori=""; render(); } else live(); return; }
  if(ds.an!=null){ S.annForm[ds.an]= t.type==="checkbox" ? t.checked : t.value; return; }
  if(ds.ke!=null && S.keuEdit){ S.keuEdit[ds.ke]=t.value; return; }
  if(ds.ka!=null && S.keuEdit){ S.keuEdit.akun[+ds.ka][ds.k]=t.value; return; }
  if(ds.ui && ["kasMonth","keuYear","keuPeriod","tugasDone"].includes(ds.ui)){ /* handled by generic ui handler -> render */ }
});
document.addEventListener("change", async e=>{
  const t=e.target; if(t.dataset.actChange!=="role") return;
  const uid=t.dataset.v, r=t.value;
  try{ await fs.collection("users").doc(uid).update({role:r, roleBy:S.uid, roleAt:new Date().toISOString()}); toast("Peran "+(S.users[uid]?.nama||"")+" diubah menjadi "+ROLES[r]+"."); }catch(err){ writeErr(err); render(); }
});
document.addEventListener("submit", e=>{
  if(e.target.id==="authForm"){ e.preventDefault(); doAuth(); }
  if(e.target.id==="kasForm"){ e.preventDefault(); submitKas(); }
  if(e.target.id==="annForm"){ e.preventDefault(); (async()=>{ const F=S.annForm; if(!F.judul.trim()||!F.isi.trim()){ toast("Judul dan isi wajib diisi."); return; } F.busy=true; render();
    try{ await fs.collection("pengumuman").doc().set({judul:F.judul.trim(), isi:F.isi.trim(), penting:!!F.penting, createdBy:S.uid, createdAt:new Date().toISOString()}); S.annForm={judul:"",isi:"",penting:false}; toast("Pengumuman terkirim ke semua staf."); }
    catch(err){ F.busy=false; writeErr(err); } render(); })(); }
});
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches(".task[data-act]")){ e.preventDefault(); e.target.click(); } });
window.addEventListener("hashchange", route);

/* =================== boot =================== */
(function boot(){
  const configured = typeof firebase!=="undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/TEMPEL/.test(FIREBASE_CONFIG.apiKey);
  if(!configured){ render(); return; }
  fb=firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); fs=firebase.firestore();
  const h=location.hash.slice(1); S.view = h || "beranda";
  render();
  auth.onAuthStateChanged(u=>{
    stopSubs(); if(S.profUnsub){ S.profUnsub(); S.profUnsub=null; }
    S.authReady=true; S.auth=u; S.profile=null; S.uid=u?u.uid:null; S.users={}; S.tugas=[]; S.pengumuman=[]; S.kas={}; S.trx={}; S.calc=null; S.authErr=u?"":S.authErr;
    if(!u){ $("#root").innerHTML=""; render(); return; }
    S.profUnsub=fs.collection("users").doc(u.uid).onSnapshot(async s=>{
      if(!s.exists){
        if(S.creating) return; S.creating=true;
        const base={email:u.email||"", nama:S.pendingNama||(u.email||"").split("@")[0], createdAt:new Date().toISOString()};
        const ref=fs.collection("users").doc(u.uid);
        // Server rules decide who is the owner: try admin first, fall back to waiting for approval.
        try{ await ref.set({...base, role:"admin"}); }
        catch(e1){ try{ await ref.set({...base, role:"menunggu"}); }
          catch(err){ S.authErr="Profil gagal dibuat ("+(err.code||err.message)+"). Pastikan aturan Firestore sudah dipasang."; render(); } }
        S.creating=false; return;
      }
      const prevRole=role();
      S.profile=Object.assign({id:s.id}, s.data());
      S.canWrite=can("editGudang"); S.canEdit=role()==="admin";
      if(ACTIVE.includes(role())){ if(S.subsOn && prevRole!==role()){ stopSubs(); } startSubs(); if(!allowed(S.view)) S.view="beranda"; }
      else { stopSubs(); $("#root").innerHTML=""; }
      render();
    }, err=>{ S.authErr="Profil tidak bisa dibaca ("+(err.code||err.message)+"). Pastikan aturan Firestore sudah dipasang."; render(); });
  });
})();
})();
</script>
