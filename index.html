function dcData(m){
  const pm=PMAP(), rows=S.calc.rows; const R=monthReport(m); const T=tgOf(m); const ind=T.induk||{};
  const awal={}, prod={}, kel={}, kelPO={};
  for(const r of rows.produksi){ const q=+r.qty||0; if(!r.tgl||r.tgl.slice(0,7)<m) awal[r.produk]=(awal[r.produk]||0)+q; else if(r.tgl.slice(0,7)===m) prod[r.produk]=(prod[r.produk]||0)+q; }
  for(const r of rows.keluar){ const q=+r.qty||0; if(!r.tgl||r.tgl.slice(0,7)<m) awal[r.produk]=(awal[r.produk]||0)-q; else if(r.tgl.slice(0,7)===m){ kel[r.produk]=(kel[r.produk]||0)+q; if(r.poId||r.noPo) kelPO[r.produk]=(kelPO[r.produk]||0)+q; } }
  const names=[...new Set([...Object.keys(prod),...Object.keys(ind).filter(k=>ind[k]!==""&&ind[k]!=null)])].sort((a,b)=>a.localeCompare(b,"id"));
  const hppP=p=>{ const x=pm[p]; return x?hppOf(x.merek, +x.ml||0, m):0; };
  const list=names.map(p=>{ const pr=prod[p]||0, k=kel[p]||0, aw=awal[p]||0, ak=aw+pr-k, has=ind[p]!==undefined&&ind[p]!==""&&ind[p]!=null, iv=has?+ind[p]:null, h=hppP(p);
    return {p, awal:aw, prod:pr, kel:k, kelPO:kelPO[p]||0, akhir:ak, buf:Math.max(0,pr-(kelPO[p]||0)), ind:iv, sel:has?iv-pr:null, hpp:h, nilai:pr*h, nilaiInd:has?iv*h:null}; });
  const lengkap=list.length>0&&list.every(x=>x.ind!=null);
  const nilaiKita=list.reduce((a,x)=>a+x.nilai,0), nilaiInd=list.reduce((a,x)=>a+(x.nilaiInd!=null?x.nilaiInd:x.nilai),0);
  const adj=R.pendapatan-R.nilaiHpp; // listrik, tambahan, potongan
  const hpp=R.cfg.skema==="hpp";
  return {m, R, T, list, lengkap, nilaiKita, nilaiInd, adj, hpp, tagKita:R.pendapatan, tagInd:hpp?nilaiInd+adj:R.pendapatan};
}
function tgStatus(T){ const tot=+T.total||0, by=(T.bayar||[]).reduce((a,b)=>a+(+b.nominal||0),0); if(!T.kunci) return {k:"buka", by, tot}; if(tot>0&&by>=tot-0.5) return {k:"lunas", by, tot}; return {k:by>0?"sebagian":"belum", by, tot}; }
function tgUmur(m,T){ const dari=(T.kunciAt||"").slice(0,10)||akhirBulan(m); return Math.max(0,hariAntara(dari,TODAY)); }
function dcChecks(D){
  const out=[]; const m=D.m;
  const pk=new Set(pekerjaRows().filter(r=>r.tgl&&r.tgl.slice(0,7)===m).map(r=>r.tgl)); const pr=new Set(S.calc.rows.produksi.filter(r=>r.tgl&&r.tgl.slice(0,7)===m).map(r=>r.tgl));
  const miss=[...pk].filter(t=>!pr.has(t)).sort();
  out.push(miss.length?["w",`Ada pekerja masuk tapi produksi tidak dicatat: ${miss.map(fdate).join(", ")}.`]:["y",`Semua ${pr.size} hari produksi tercatat${[...pr].some(t=>new Date(t+"T00:00:00").getDay()===0)?", termasuk hari Minggu":""}.`]);
  for(const x of D.list){
    if(x.akhir<0) out.push(["x",`<b>${esc(x.p)}</b>: keluar ${fmt(x.kel)} lebih banyak dari stok awal + produksi (${fmt(x.awal+x.prod)}). Ada produksi yang belum dicatat, atau barang keluar salah pilih produk.`]);
    if(x.sel==null) continue;
    if(x.sel<0&&x.buf>0&&-x.sel<=x.buf) out.push(["w",`<b>${esc(x.p)}</b>: induk menghitung ${fmt(-x.sel)} botol lebih sedikit. Produksi yang tidak terkirim ke PO bulan ini ${fmt(x.buf)} botol; mungkin induk hanya menghitung yang ikut PO. Tanyakan, karena buffer juga dibayar.`]);
    else if(x.sel<0) out.push(["w",`<b>${esc(x.p)}</b>: induk menghitung ${fmt(-x.sel)} botol lebih sedikit dari catatan kita. Cek tanggal produksinya di Riwayat.`]);
    else if(x.sel>0) out.push(["w",`<b>${esc(x.p)}</b>: induk menghitung ${fmt(x.sel)} botol lebih banyak. Mungkin ada produksi yang lupa dicatat.`]);
  }
  if(D.list.length&&!D.list.some(x=>x.ind!=null)) out.push(["i","Rekap induk belum diisi. Ketik angka dari print rekap induk di kolom Rekap induk."]);
  else if(D.lengkap&&D.list.every(x=>x.sel===0)) out.push(["y","Semua produk cocok dengan rekap induk."]);
  return out;
}

const fdt2=s=>s?fdate(s.slice(0,10))+(s.length>10?" "+s.slice(11,16):""):"—";

/* ---------- 1. Reject & perbaikan ---------- */
function rjData(){
  const alias=g2Alias(), idx=Object.fromEntries(S.bahan.map(b=>[b.nama,b])); const nm=n=>idx[n]?n:(alias[n]||n);
  const rej={}, ev={};
  for(const r of S.calc.rows.pembelian){ if(!r.tgl) continue; const j=jenisOf(r); const n=nm(r.bahan); let q=+r.qty||0;
    if(G2_CAIR[r.bahan]&&idx[n]&&idx[n].satuan==="jirigen") q=r.jirigen!=null?+r.jirigen:q/(+idx[n].isi||25);
    if(j==="reject"||j==="rusak"){ const m=r.tgl.slice(0,7); (rej[n]=rej[n]||{})[m]=(rej[n][m]||0)+q; (ev[n]=ev[n]||[]).push({t:r.tgl,k:"rj",q,ket:r.ket||""}); }
    else if(j==="masuk") (ev[n]=ev[n]||[]).push({t:r.tgl,k:"in",q}); }
  const cur=TODAY.slice(0,7); const months=[]; for(let i=5;i>=0;i--){ const d=new Date(cur+"-01T00:00:00"); d.setMonth(d.getMonth()-i); months.push(isoDate(d).slice(0,7)); }
  const pakai={}; for(const y of [...new Set(months.map(m=>m.slice(0,4)))]){ const P=ptHitung(y); for(const x of P.list) for(const m in x.bln) if(months.includes(m)) (pakai[x.nama]=pakai[x.nama]||{})[m]=x.bln[m].p; }
  const out=[];
  for(const n in rej){ const rows=months.map(m=>{ const rj=rej[n][m]||0, pk=(pakai[n]||{})[m]||0; return {m, rj, pk, rate:rj+pk>0?rj/(rj+pk):0}; });
    const tot=rows.reduce((a,x)=>a+x.rj,0); if(!tot) continue;
    let flag=null; for(const k of [5,4]){ const x=rows[k]; const base=rows.slice(Math.max(0,k-3),k).filter(y=>y.rj+y.pk>0); const avg=base.length?base.reduce((a,y)=>a+y.rate,0)/base.length:0;
      if(x.rj>=20&&x.rate>=0.05&&x.rate>=Math.max(0.01,avg)*2){ flag={m:x.m, rate:x.rate, avg, rj:x.rj, pk:x.pk}; break; } }
    // per kiriman: reject 0–3 hari setelah barang datang
    const e=(ev[n]||[]).sort((a,b)=>a.t.localeCompare(b.t)); const kir=[];
    e.forEach((x,i)=>{ if(x.k!=="in") return; const nxt=e.slice(i+1).find(y=>y.k==="in"); const lim=addDays(x.t,3); const rj=e.filter(y=>y.k==="rj"&&y.t>=x.t&&y.t<=lim&&(!nxt||y.t<nxt.t||y.t===x.t)).reduce((a,y)=>a+y.q,0); if(rj>0) kir.push({t:x.t, masuk:x.q, rj, rate:rj/x.q}); });
    out.push({n, rows, tot, flag, kir:kir.filter(k=>k.t>=months[0]+"-01").sort((a,b)=>b.rate-a.rate).slice(0,4)}); }
  return {months, list:out.sort((a,b)=>(b.flag?1:0)-(a.flag?1:0)||(b.flag?b.flag.rate:0)-(a.flag?a.flag.rate:0)||b.tot-a.tot)};
}
const pct1=v=>(Math.round(v*1000)/10).toString().replace(".",",")+"%";

function kdAttn(){ const out=[]; try{ const D=rjData(); const f=D.list.filter(x=>x.flag&&!ncrList().some(r=>r.bahan===x.n&&r.status!=="selesai"));

document.addEventListener("click", e=>{ const a=e.target.closest("[data-act]"); if(!a) return; const k=a.dataset.act, v=a.dataset.v; if(!/^(kd|ncr|ms|rfq|kep)-/.test(k)) return; const dr=kdDraft();

      else { const ym=TODAY.slice(0,7); const n=D.list.filter(x=>String(x.no||"").startsWith("NCR-"+ym)).length+1; D.list.push({id:rid(), no:`NCR-${ym}-${String(n).padStart(2,"0")}`, bahan:d.bahan, bulan:ym, masalah:d.masalah, penyebab:d.penyebab, tindakan:tind, status:"buka", at:new Date().toISOString(), by:S.uid}); }
      S.kdDraft={}; render(); kdSave("ncr", d.id?"Laporan disimpan.":"Laporan perbaikan dibuat."); break; }
    case "ncr-tc": { const D=doc("ncr"); const r=(D.list||[]).find(x=>x.id===v); if(!r) break; const t=(r.tindakan||[]).find(x=>x.id===a.dataset.t); if(!t) break; t.selesai=a.checked?TODAY:""; if(r.status==="buka") r.status="proses"; render(); kdSave("ncr"); break; }

/* =================== Tren barang keluar (Laporan → Tren) =================== */
// Pengaturan: shared/tren {alias:{KODE:"Nama lengkap"}, guna:{Merek:"sawit|horti|padi|umum"}}
const TREN_ALIAS0={SS:"Solusi Sawit", SAS:"Sustain Agro"};
const TREN_GUNA0={"Aussie":"sawit","Aussie Hijau":"sawit","Bensu":"horti"};
const GUNA_TXT={sawit:"Kelapa sawit", horti:"Hortikultura", padi:"Padi / palawija", umum:"Umum / semua tanaman", "":"Belum diisi"};

const TREN_SKIP=/opname|koreksi|samp|retur/i;
function addM(ym,n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); }

/* Musim (pola umum Indonesia, dengan koreksi BMKG 2026/2027: El Niño kuat, hujan mundur) */
const MUSIM_KHUSUS={"2026-09":["ekstrem","Kemarau ekstrem (El Niño)"],"2026-10":["ekstrem","Kemarau ekstrem (El Niño)"],"2026-11":["peralihan","Peralihan, hujan mundur"],"2026-12":["hujanP","Puncak hujan"],"2027-01":["hujanP","Puncak hujan"],"2027-02":["hujanP","Puncak hujan"],"2027-03":["hujan","Akhir musim hujan"]};

  const m=+ym.slice(5); const t={12:["hujanP","Puncak hujan"],1:["hujanP","Puncak hujan"],2:["hujanP","Puncak hujan"],11:["hujan","Awal musim hujan"],3:["hujan","Akhir musim hujan"],4:["peralihan","Peralihan ke kemarau"],5:["peralihan","Peralihan ke kemarau"],10:["peralihan","Peralihan ke hujan"],6:["kemarau","Kemarau"],9:["kemarau","Kemarau"],7:["kemarauP","Puncak kemarau"],8:["kemarauP","Puncak kemarau"]}[m];
  return {k:t[0], l:t[1]}; }
const MUSIM_WARNA={hujanP:"rgba(37,99,181,.16)",hujan:"rgba(37,99,181,.08)",peralihan:"rgba(120,130,120,.06)",kemarau:"rgba(201,162,75,.12)",kemarauP:"rgba(201,162,75,.22)",ekstrem:"rgba(192,57,43,.14)"};

function alasan(guna, k, naik){
  const H=k==="hujan"||k==="hujanP", K=k==="kemarau"||k==="kemarauP";
  if(k==="ekstrem" && !naik) return "kekeringan ekstrem karena El Niño: kebun dan petani cenderung menunda aplikasi pupuk";
  if(guna==="sawit"){
    if(naik&&(k==="peralihan"||k==="hujan")) return "cocok dengan masa pemupukan sawit: hujan cukup tapi belum puncak";
    if(naik&&K) return "kemungkinan pemupukan susulan atau distributor menyetok sebelum musim hujan";
    if(naik&&k==="hujanP") return "di luar pola biasa (puncak hujan); bisa karena pesanan besar atau stok distributor";
    if(!naik&&k==="hujanP") return "pemupukan sawit biasanya dihindari saat puncak hujan karena pupuk mudah tercuci";
    if(!naik&&K) return "kebun cenderung menunda pemupukan saat kering karena pupuk sulit terserap";
    if(!naik) return "jeda di antara dua masa pemupukan sawit";
  }
  if(guna==="horti"){
    if(naik&&K) return "musim tanam kemarau: tanam hortikultura lebih ramai dan lebih menguntungkan bagi petani";
    if(naik&&k==="peralihan") return "persiapan musim tanam hortikultura";
    if(naik&&H) return "di luar pola biasa (musim hujan); bisa karena pesanan besar atau stok distributor";
    if(!naik&&H) return "tanam hortikultura berkurang di musim hujan karena risiko penyakit dan banjir";
    if(!naik) return "jeda antarmusim tanam hortikultura";
  }
  if(guna==="padi"){
    if(naik&&(H||k==="peralihan")) return "cocok dengan musim tanam padi (awal atau akhir musim hujan)";
    if(!naik&&K) return "banyak sawah tadah hujan tidak ditanami saat kemarau";
    if(!naik&&k==="hujanP") return "tanaman padi sudah besar, aplikasi berkurang menjelang panen";
  }
  return "";
}

/* Penjualan lama (sebelum aplikasi): shared/historis {rows:[{m:"2025-06", dist, produk, qty}]} */
function histProduk(nama){ const n=String(nama||"").trim(); const pm=S.produk;
  const base=x=>x.replace(/\s*-\s*(Baru|Lama)$/i,"").toLowerCase();
  const hit=pm.find(p=>p.nama.toLowerCase()===(n+" - Baru").toLowerCase())||pm.find(p=>p.nama.toLowerCase()===n.toLowerCase())||pm.find(p=>base(p.nama)===n.toLowerCase());
  if(hit) return {nama:hit.nama, merek:hit.merek, ml:+hit.ml||0};
  const mm=n.match(/(\d+(?:[.,]\d+)?)\s*(mL|L)\b/i); const ml=mm?(parseFloat(mm[1].replace(",","."))*(/^l$/i.test(mm[2])?1000:1)):0;
  const merek=(mm?n.slice(0,mm.index):n).trim().split(" ")[0]||"Lainnya"; return {nama:n, merek, ml}; }
function histRows(){ const H=(S.histData&&S.histData.rows)||[]; const cache={};
  return H.map(r=>{ const p=cache[r.produk]||(cache[r.produk]=histProduk(r.produk)); const q=+r.qty||0;
    return {m:r.m, tgl:r.m+"-15", produk:p.nama, merek:p.merek, liter:q*p.ml/1000, botol:q, dist:distName(r.dist), hist:true, tanpaUkuran:!p.ml}; }); }
function trenRows(){
  const pm=Object.fromEntries(S.produk.map(p=>[p.nama,p])); const H=histRows(); const hm=new Set(H.map(r=>r.m));
  const poTg=Object.fromEntries(((S.poData&&S.poData.list)||[]).filter(p=>p.tglMasuk).map(p=>[p.id,p.tglMasuk]));
  return (S.calc.rows.keluar||[]).filter(r=>r.tgl && !hm.has(r.tgl.slice(0,7)) && r.jenis!=="sample" && !r.reject && !TREN_SKIP.test(r.tujuan||"")).map(r=>{ const p=pm[r.produk]||{}; const q=+r.qty||0;
    return {m:r.tgl.slice(0,7), tgl:r.tgl, to:(r.poId&&poTg[r.poId])||(r.tglPo&&r.tglPo<=r.tgl?r.tglPo:r.tgl), produk:r.produk, merek:p.merek||String(r.produk||"").split(" ")[0]||"Lainnya", liter:q*(+p.ml||0)/1000, botol:q, dist:distName(r.tujuan)}; }).concat(H);
}
function trenMonths(rows){
  const ms=[...new Set(rows.map(r=>r.m))].sort(); if(!ms.length) return {all:[],done:[],partFirst:null,cur:null};
  const all=[]; for(let m=ms[0]; m<=TODAY.slice(0,7); m=addM(m,1)) all.push(m);
  const fr=rows.filter(r=>r.m===ms[0]); const firstDay=fr.some(r=>r.hist)?1:Math.min(...fr.map(r=>+r.tgl.slice(8,10)));
  const partFirst=firstDay>7?ms[0]:null; const cur=TODAY.slice(0,7);
  return {all, done:all.filter(m=>m!==cur&&m!==partFirst), partFirst, cur};
}
function trSeries(rows, keyFn, unit){ const o={}; for(const r of rows){ const k=keyFn(r); if(k==null) continue; (o[k]=o[k]||{})[r.m]=(o[k][r.m]||0)+r[unit]; } return o; }
function forecast(vals, H){ // vals: nilai bulan lengkap (urut lama → baru)
  const n=vals.length; if(!n) return null; let damp=1;
  // indeks musim: nilai bulan yang sama tahun lalu dibanding rata-rata di sekitarnya (butuh ≥13 bulan)
  const idx=i=>{ const j=i-12; if(n<13||j<0||j>=n) return null; const w=vals.slice(Math.max(0,j-5),Math.min(n,j+7)); const m=w.reduce((a,b)=>a+b,0)/w.length; return m>0?1+(Math.min(1.6,Math.max(.6,vals[j]/m))-1)*damp:null; };
  let seas=n>=13; damp=1; if(seas){ let A=0,B=0; for(let i=12;i<n;i++){ A+=vals[i]; B+=vals[i-12]; } const g=B>0?A/B:99; if(g>1.6||g<.6) damp=.6; } // tumbuh/turun drastis: pola tahun lalu tetap dipakai, kekuatannya dikurangi
  const des=vals.map((v,i)=>{ const x=seas?idx(i):null; return x?v/x:v; });
  const last=des.slice(-3); const w=last.length===3?[.2,.3,.5]:last.length===2?[.4,.6]:[1];
  const level=last.reduce((a,v,i)=>a+v*w[i],0);
  let slope=0; const k=Math.min(6,n); if(k>=4){ const y=des.slice(-k); const xm=(k-1)/2, ym=y.reduce((a,b)=>a+b,0)/k; let nu=0,de=0; y.forEach((v,i)=>{nu+=(i-xm)*(v-ym); de+=(i-xm)**2;}); slope=de?nu/de:0; }
  const y6=des.slice(-6), mean=y6.reduce((a,b)=>a+b,0)/y6.length; const sd=Math.sqrt(y6.reduce((a,v)=>a+(v-mean)**2,0)/Math.max(1,y6.length-1))||mean*.3;
  const out=[]; for(let h=1;h<=H;h++){ const ix=seas?idx(n-1+h):null; let f=(level+slope*(seas?.25:.5)*h)*(ix||1);
    f=Math.max(0,f); const r=sd*.8*Math.sqrt(h)*(ix||1); out.push({v:f, lo:Math.max(0,f-r), hi:f+r, musim:ix}); }
  return {out, mean, kualitas:n<6?"kasar":n<12?"sedang":"baik", n, seas, berubah:n>=13&&damp<1};
}

/* ---- grafik ---- */
function trenChart(ms, lines, fcMonths, unit, curM){
  const W=760,Hh=300,pl=56,pr=14,pt=14,pb=50; const X=ms.concat(fcMonths); const nx=X.length; if(!nx) return "";
  const cw=(W-pl-pr)/nx; const xc=i=>pl+cw*(i+.5);
  let mx=1; for(const L of lines){ for(const m of ms) mx=Math.max(mx,L.v[m]||0); for(const f of (L.fc||[])) mx=Math.max(mx, L.band?f.hi:f.v); if(L.cur!=null) mx=Math.max(mx,L.cur); }
  const step=Math.pow(10,Math.floor(Math.log10(mx))); const nice=[1,2,2.5,5,10].map(s=>s*step).find(s=>mx/s<=5)||step*10; const top=Math.ceil(mx/nice)*nice;
  const yc=v=>pt+(Hh-pt-pb)*(1-v/top);
  let g=X.map((m,i)=>{ const s=musimOf(m); return `<rect x="${pl+cw*i}" y="${pt}" width="${cw}" height="${Hh-pt-pb}" fill="${MUSIM_WARNA[s.k]}"><title>${fmonth(m)}: ${s.l}</title></rect>`; }).join("");
  if(fcMonths.length) g+=`<line x1="${pl+cw*ms.length}" x2="${pl+cw*ms.length}" y1="${pt}" y2="${Hh-pb}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/><text x="${pl+cw*ms.length+4}" y="${pt+12}" font-size="11" fill="var(--muted)">Prediksi</text>`;
  for(let v=0; v<=top+1e-9; v+=nice) g+=`<line x1="${pl}" x2="${W-pr}" y1="${yc(v)}" y2="${yc(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${yc(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?fmt(v/1000)+"rb":fmt(v)}</text>`;
  X.forEach((m,i)=>{ if(nx>16 && i%2) return; g+=`<text x="${xc(i)}" y="${Hh-pb+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${BLN[+m.slice(5)-1]}</text>`; if(m.slice(5)==="01"||i===0) g+=`<text x="${xc(i)}" y="${Hh-pb+30}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="700">${m.slice(0,4)}</text>`; });
  for(const L of lines){
    const pts=ms.map((m,i)=>[xc(i),yc(L.v[m]||0)]);
    if(L.band&&L.fc){ const a=[[pts.at(-1)[0],pts.at(-1)[1]]].concat(L.fc.map((f,i)=>[xc(ms.length+i),yc(f.hi)])); const b=L.fc.map((f,i)=>[xc(ms.length+i),yc(f.lo)]).reverse().concat([[pts.at(-1)[0],pts.at(-1)[1]]]);
      g+=`<polygon points="${a.concat(b).map(p=>p.join(",")).join(" ")}" fill="${L.c}" opacity=".13"/>`; }
    g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${L.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(nx<=18) g+=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${L.c}"><title>${esc(L.n)} · ${fmonth(ms[i])}: ${fmt(Math.round(L.v[ms[i]]||0))} ${unit}</title></circle>`).join("");
    if(L.fc){ const fp=[pts.at(-1)].concat(L.fc.map((f,i)=>[xc(ms.length+i),yc(f.v)])); g+=`<polyline points="${fp.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${L.c}" stroke-width="2.2" stroke-dasharray="6 5"/>`+L.fc.map((f,i)=>`<circle cx="${xc(ms.length+i)}" cy="${yc(f.v)}" r="3.6" fill="var(--surface)" stroke="${L.c}" stroke-width="2"><title>${esc(L.n)} · prediksi ${fmonth(fcMonths[i])}: ${fmt(Math.round(f.v))} ${unit} (${fmt(Math.round(f.lo))}–${fmt(Math.round(f.hi))})</title></circle>`).join(""); }
    if(L.cur!=null && curM){ const i=X.indexOf(curM); if(i>=0) g+=`<rect x="${xc(i)-4}" y="${yc(L.cur)-4}" width="8" height="8" fill="${L.c}" transform="rotate(45 ${xc(i)} ${yc(L.cur)})"><title>${esc(L.n)} · ${fmonth(curM)} berjalan: ${fmt(Math.round(L.cur))} ${unit} sejauh ini</title></rect>`; }
  }
  return `<div class="tren-chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Grafik tren barang keluar per bulan">${g}</svg></div>
    <div class="tren-leg">${lines.map(L=>`<span><i style="background:${L.c}"></i>${esc(L.n)}</span>`).join("")}<span class="hint">— aktual · - - prediksi${lines.some(l=>l.band)?" · area = rentang perkiraan":""}${curM?" · ◆ bulan berjalan":""}</span></div>

}

  const kualitas=lines[0]?.F?.kualitas; const nb=M.done.length;

  const tableMs=[...hist].reverse();

    const L=lines.find(l=>l.n===n); const f1=L&&L.fc&&L.fc[M.cur===nextM?1:0]; const fm=M.cur===nextM?addM(nextM,1):nextM; const s1=musimOf(fm);

function trenBulanPanel(rows, M, unit, mode, sel, U, m){

  const months=M.done.length?M.done:[m]; const sum=a=>a.reduce((x,r)=>x+r[unit],0);
  const tot=sum(inM), totP=sum(inP), avg=sum(scope.filter(r=>M.done.includes(r.m)))/Math.max(1,M.done.length);
  const s=musimOf(m); const run=m===M.cur&&!M.done.includes(m);
  const pct=(a,b)=>!b?`<span class="hint">—</span>`:`<span class="${a>=b?"up":"dn"}">${a>=b?"▲":"▼"} ${Math.abs(Math.round((a-b)/b*100))}%</span>`;
  const group=(keyFn,label,isMerek)=>{
    const cur={},prv={},all={}; inM.forEach(r=>cur[keyFn(r)]=(cur[keyFn(r)]||0)+r[unit]); inP.forEach(r=>prv[keyFn(r)]=(prv[keyFn(r)]||0)+r[unit]);
    const first={}; scope.filter(r=>M.done.includes(r.m)).forEach(r=>{ const k=keyFn(r); all[k]=(all[k]||0)+r[unit]; if(!first[k]||r.m<first[k]) first[k]=r.m; });
    const nAct=k=>first[k]?M.done.filter(x=>x>=first[k]).length:M.done.length;
    const ks=[...new Set([...Object.keys(cur),...Object.keys(prv)])].sort((a,b)=>(cur[b]||0)-(cur[a]||0));
    if(!ks.length) return "";
    return `<div class="tw"><table><thead><tr><th>${label}</th><th class="n">${U}</th><th class="n">Porsi</th><th class="n">vs ${BLN[+prevM.slice(5)-1]}</th>${run?"":`<th class="n">vs rata-rata</th>`}${isMerek?"<th>Kemungkinan alasan</th>":""}</tr></thead><tbody>
      ${ks.map(k=>{ const x=cur[k]||0, a=(all[k]||0)/Math.max(1,nAct(k)); const r=a?x/a:0; const why=isMerek&&!run&&a&&(r>=1.25||r<=.7)?alasan(trenGuna(k),s.k,r>=1.25):"";
        return `<tr><td>${isMerek?`<i class="dot" style="background:${MEREK_WARNA[k]||"var(--g600)"};margin-right:6px"></i>`+esc(mLabel(k)):esc(k)}</td><td class="n">${fmt(Math.round(x))}</td><td class="n">${tot?Math.round(x/tot*100)+"%":"—"}</td><td class="n">${pct(x,prv[k]||0)}</td>${run?"":`<td class="n">${a?`<span class="${r>=1?"up":"dn"}">${r>=1?"+":""}${Math.round((r-1)*100)}%</span>`:"—"}</td>`}${isMerek?`<td class="wrap hint" style="min-width:180px">${why||(isMerek&&!trenGuna(k)?"peruntukan belum diisi":"")}</td>`:""}</tr>`; }).join("")}

const ODAY=864e5;
const ordD=s=>new Date(s+"T00:00:00");
const ordIso=d=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };

function ordStats(rows, dist, unit, today){
  const ev={}; for(const r of rows){ if(r.hist||r.dist!==dist||!r.tgl) continue; const od=r.to||r.tgl; const e=ev[od]=ev[od]||{L:0,m:{},p:{}}; e.L+=r[unit]; e.m[r.merek]=(e.m[r.merek]||0)+r[unit]; const pn=String(r.produk).replace(/\s*-\s*(Baru|Lama)$/i,""); e.p[pn]=(e.p[pn]||0)+r.botol; }
  const T=ordD(today); const from=new Date(T.getTime()-182*ODAY);
  const dates=Object.keys(ev).filter(t=>ordD(t)>=from && ordD(t)<=T).sort(); if(dates.length<8) return null;
  // dihitung per minggu (Senin–Minggu): minggu yang ada barang keluar = minggu ber-order
  const wk={}; for(const t of dates){ const k=ordIso(ordSenin(ordD(t))); const w=wk[k]=wk[k]||{L:0,m:{},p:{},n:0}; w.L+=ev[t].L; w.n++; for(const m in ev[t].m) w.m[m]=(w.m[m]||0)+ev[t].m[m]; for(const x in ev[t].p) w.p[x]=(w.p[x]||0)+ev[t].p[x]; }
  const wks=Object.keys(wk).sort(); const W0=ordSenin(T); const curK=ordIso(W0);
  const doneW=wks.filter(k=>k<curK); if(doneW.length<4) return null;
  const gaps=doneW.slice(1).map((k,i)=>Math.round((ordD(k)-ordD(doneW[i]))/(7*ODAY))); const gs=[...gaps].sort((a,b)=>a-b);
  const q=p=>gs.length?gs[Math.min(gs.length-1,Math.floor(p*(gs.length-1)+.5))]:1; const med=q(.5), p75=q(.75);
  const last8=doneW.slice(-8); const sz=last8.map(k=>wk[k].L).sort((a,b)=>a-b); const size=sz[Math.floor(sz.length/2)];
  const mix={}; let mt=0; for(const k of last8) for(const m in wk[k].m){ mix[m]=(mix[m]||0)+wk[k].m[m]; mt+=wk[k].m[m]; }
  let hit=0,n=0; for(let i=1;i<=26;i++){ const k=ordIso(new Date(W0.getTime()-i*7*ODAY)); if(k<ordIso(ordSenin(ordD(dates[0])))) break; n++; if(wk[k]) hit++; } const base=n?hit/n:.5;
  const wd={}; dates.forEach(t=>{ const h=OHARI[ordD(t).getDay()]; wd[h]=(wd[h]||0)+1; }); const hariFav=Object.entries(wd).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  // isi per produk (botol) dari 8 minggu ber-order terakhir
  const pc={}; for(const k of last8) for(const x in wk[k].p){ (pc[x]=pc[x]||[]).push(wk[k].p[x]); }
  const prod=Object.entries(pc).map(([x,a])=>{ const b=[...a].sort((u,v)=>u-v); return {nama:x, n:a.length, of:last8.length, med:b[Math.floor(b.length/2)]}; }).sort((a,b)=>b.n-a.n||b.med-a.med);
  // pola 8 minggu terakhir untuk ditampilkan
  const pola=[]; for(let i=8;i>=1;i--){ const k=ordIso(new Date(W0.getTime()-i*7*ODAY)); pola.push(!!wk[k]); }
  return {dist, ev, dates, gaps, med, p75, size, mix, mt, base, wk, hariFav, prod, last:dates.at(-1), lastW:doneW.at(-1), curDone:!!wk[curK], pola};
}
function ordLab(p){ return p>=.8?["Sangat mungkin","l1"]:p>=.5?["Mungkin","l2"]:p>=.3?["Ragu-ragu","l3"]:["Kecil","l4"]; }
function ordForecast(st, today){
  const W0=ordSenin(ordD(today)); const lastW=ordD(st.curDone?ordIso(W0):st.lastW); const eW=Math.round((W0-lastW)/(7*ODAY)); // minggu sejak minggu ber-order terakhir
  const hz=k=>{ const pool=st.gaps.filter(g=>g>=k); if(pool.length<3) return st.base; return pool.filter(g=>g===k).length/pool.length; };
  const out=[]; let surv=1;
  for(let w=0;w<4;w++){ const ws=new Date(W0.getTime()+w*7*ODAY), we=new Date(ws.getTime()+6*ODAY);
    if(w===0&&st.curDone){ out.push({ws,we,p:1,done:true,L:0}); continue; }
    const k=Math.round((ws-lastW)/(7*ODAY)); let p;
    if(st.curDone){ p=hz(k); } else { const h=hz(k); p=surv*h + (1-surv)*st.base; surv*= (1-h); }
    p=Math.min(.95,Math.max(.05,p)); out.push({ws,we,p,done:false,L:p*st.size}); }

function ordBacktest(rows, dist, unit, today){ // 8 minggu terakhir: tebakan (peluang ≥50%) vs kenyataan

  for(let i=8;i>=1;i--){ const ws=new Date(W0.getTime()-i*7*ODAY); const prev=ordIso(new Date(ws.getTime()-ODAY));
    const st=ordStats(rows.filter(r=>r.tgl<=prev),dist,unit,ordIso(ws)); if(!st) continue; const f=ordForecast(st,ordIso(ws)).weeks[0];
    const real=all.some(t=>ordD(t)>=ws && ordD(t)<new Date(ws.getTime()+7*ODAY));

function ordRegulars(rows, unit){
  const ds=[...new Set(rows.filter(r=>!r.hist&&r.dist!=="Tanpa nama").map(r=>r.dist))];

async function unduhCadangan(){
  if(role()!=="admin"){ toast("Hanya admin yang bisa mengunduh cadangan."); return; }
  if(bkBusy) return; bkBusy=true; render();
  try{
    const out={format:"ptcn-cadangan", versi:1, dibuat:new Date().toISOString(), oleh:(S.profile&&S.profile.nama)||"", col:{}, info:{}};
    for(const c of BK_DOCS) out[c]=await bkGetCol(c);
    for(const c of BK_COL){ try{ out.col[c]=await bkGetCol(c); }catch(e){ out.col[c]={}; } }
    try{ const lg=await bkGetCol("absenLog"); for(const k in lg){ delete lg[k].foto; } out.info.absenLog=lg; }catch(e){}
    try{ const us=await bkGetCol("users"); for(const k in us){ us[k]={nama:us[k].nama, email:us[k].email, role:us[k].role}; } out.info.users=us; }catch(e){}
    const txt=JSON.stringify(out); const tgl=TODAY;
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download=`PTCN-cadangan-${tgl}.json`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
    const n=Object.keys(out.trx).length, sz=(txt.length/1024/1024).toFixed(1);
    S.bkData={at:out.dibuat, by:S.uid, oleh:out.oleh, bulan:n, ukuranMB:+sz};
    quick(fs.collection("shared").doc("cadangan").set(S.bkData));
    toast(`Cadangan terunduh (${sz} MB, ${n} bulan transaksi). Simpan di Google Drive atau kirim ke WhatsApp Anda sendiri.`);
  }catch(e){ writeErr(e); }
  bkBusy=false; render();
}

/* Pulihkan dari file cadangan */
function bkSummary(d){ return `${fdate(String(d.dibuat||"").slice(0,10))}${d.oleh?" oleh "+esc(d.oleh):""}: ${Object.keys(d.trx||{}).length} bulan transaksi, ${Object.keys(d.kas||{}).length} bulan buku kas, ${Object.keys((d.col||{}).tugas||{}).length} tugas`; }
async function pulihkanCadangan(d){
  const writes=[];
  for(const c of BK_DOCS) for(const k in (d[c]||{})) writes.push([c,k,d[c][k]]);
  for(const c of BK_COL) for(const k in ((d.col||{})[c]||{})) writes.push([c,k,d.col[c][k]]);
  let n=0, gagal=[];
  for(let i=0;i<writes.length;i+=400){
    const part=writes.slice(i,i+400); const b=fs.batch(); part.forEach(([c,k,v])=>b.set(fs.collection(c).doc(k),v));
    try{ await b.commit(); n+=part.length; }
    catch(e){ for(const [c,k,v] of part){ try{ await fs.collection(c).doc(k).set(v); n++; }catch(e2){ gagal.push(c+"/"+k); } } }
  }
  return {n, gagal};
}
function bkInit(){
  const vb=V.beranda; V.beranda=()=>{ const h=vb(); const r=bkReminder()+ordReminder(); return r?r+h:h; };
  const vp=V.pengguna; V.pengguna=()=>{ const h=vp(); const mark='<section class="panel"><div class="ph"><h2>Impor data</h2>'; let x=h.includes(mark)?h.replace(mark, bkPanel()+mark):h+bkPanel();
    if(S.bkPreview){ const m2='<div class="row"><input type="file" id="importFile"'; x=x.replace(m2, `<div class="note"><b>File cadangan:</b> ${S.bkPreview}. Tekan tombol sekali lagi untuk memulihkan; data yang sama di aplikasi akan ditimpa.</div>`+m2); }
    return x; };
  const keepFile=()=>setTimeout(()=>{ const i=$("#importFile"); if(i && S.impFile && !i.files.length){ try{ const dt=new DataTransfer(); dt.items.add(S.impFile); i.files=dt.files; }catch(e){} } },0);
  const di0=doImport; const di=async()=>{ await di0(); keepFile(); };
  doImport=async function(){
    let f=$("#importFile") && $("#importFile").files[0]; if(f) S.impFile=f; else f=S.impFile;
    if(f && !$("#importFile").files.length){ try{ const dt=new DataTransfer(); dt.items.add(f); $("#importFile").files=dt.files; }catch(e){} }
    if(!f) return di();
    let d; try{ d=JSON.parse(await f.text()); }catch(e){ return di(); }
    if(!d || d.format!=="ptcn-cadangan") return di();
    if(role()!=="admin"){ toast("Hanya admin yang bisa memulihkan cadangan."); return; }
    if(S.importArmed!=="bk"){ S.importArmed="bk"; S.bkPreview=bkSummary(d); render(); keepFile(); return; }
    S.importArmed=false; S.bkPreview=null; S.impFile=null; toast("Memulihkan cadangan…"); render();
    const r=await pulihkanCadangan(d);
    toast(r.gagal.length?`Pulih ${r.n} dokumen, ${r.gagal.length} gagal (${r.gagal.slice(0,3).join(", ")}${r.gagal.length>3?", …":""}).`:`Cadangan ${fdate(String(d.dibuat).slice(0,10))} berhasil dipulihkan (${r.n} dokumen).`);
    render();
  };
}

/* =================== Firebase data layer =================== */
let fb=null, auth=null, fs=null;
/* Simpan cepat: perubahan langsung tampil (cache lokal Firestore), pengiriman ke server berjalan di belakang.
   Kalau server menolak, muncul pesan galat. */
function quick(p, ms){ p.catch(e=>{ console.error(e); writeErr(e); }); return Promise.race([p, new Promise(r=>setTimeout(r, ms||400))]); }
const _stab=v=>JSON.stringify(v, (k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
const _idArr=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==="object"&&!Array.isArray(x)&&x.id!=null);
async function mutate(key, fn, col){
  col = col || "trx";
  const ref = fs.collection(col).doc(key);
  let s; try{ s=await ref.get({source:"cache"}); }catch(e){ s=await ref.get(); }
  const before = s.exists ? s.data() : {};
  const body = JSON.parse(JSON.stringify(before));
  if(col==="trx"){ for(const t of ["pembelian","produksi","keluar","pekerja","tambahan"]) body[t]=body[t]||[]; } else body.items=body.items||[];
  fn(body);
  const empty = col==="trx" ? (!body.pembelian.length && !body.produksi.length && !body.keluar.length && !body.pekerja.length && !body.tambahan.length) : (!body.items.length && body.saldoAwal==null && !(body.catatan||[]).length && !Object.values(body.saldoAwalAkun||{}).some(v=>v!=null));
  const FV=firebase.firestore.FieldValue; const b=fs.batch();
  if(empty){ if(!s.exists) return; b.delete(ref); return quick(b.commit()); }
  b.set(ref, {}, {merge:true}); let n=0;
  for(const k of new Set([...Object.keys(before), ...Object.keys(body)])){
    const A=before[k], B=body[k];
    if(B===undefined){ b.update(ref, {[k]:FV.delete()}); n++; continue; }
    if(_stab(A)===_stab(B)) continue;
    if(_idArr(A||[]) && _idArr(B) && Array.isArray(A||[])){
      const bm=new Map(B.map(x=>[x.id,_stab(x)])), am=new Map((A||[]).map(x=>[x.id,_stab(x)]));
      const rem=(A||[]).filter(x=>bm.get(x.id)!==_stab(x)); const add=B.filter(x=>am.get(x.id)!==_stab(x));
      if(rem.length){ b.update(ref, {[k]:FV.arrayRemove(...rem)}); n++; }
      if(add.length){ b.update(ref, {[k]:FV.arrayUnion(...add)}); n++; }
    } else { b.update(ref, {[k]:B}); n++; }
  }
  if(!n && s.exists) return;
  return quick(b.commit());
}
async function saveMaster(doc, body){ return quick(fs.collection("master").doc(doc).set(body)); }

function writeErr(e){
  const c=e && e.code;

  else if(c==="unavailable") toast("Sedang offline. Coba lagi setelah internet tersambung.");
  else toast("Gagal menyimpan: "+((e&&e.message)||e));
}

let scheduled=false;
function schedule(){ if(scheduled) return; scheduled=true; requestAnimationFrame(()=>{ scheduled=false; if(gudangReady()) compute(); render(); if(S.modal && S.modal.kind==="bahan") renderModal(); try{ if(gudangReady()) syncAbsenSaya(); }catch(e){} }); }

function startAbsenSubs(){ if(S.subsOn) return; S.subsOn=true; S.unsub.push(fs.doc("master/pekerja").onSnapshot(s=>{ S.pekerja=(s.exists&&s.data().items)||[]; S.ready.pekerja=true; render(); }, ()=>{ S.ready.pekerja=true; render(); })); }
function startSubs(){
  if(S.subsOn) return; S.subsOn=true;
  const err=k=>e=>{ S.ready[k]=true; if(!(e && e.code==="permission-denied")) toast("Sebagian data gagal dimuat ("+k+")."); schedule(); };
  const doc=(path,k,apply)=>S.unsub.push(fs.doc(path).onSnapshot(s=>{ apply(s.exists?s.data():null); S.ready[k]=true; schedule(); }, err(k)));
  const col=(path,k,apply)=>S.unsub.push(fs.collection(path).onSnapshot(qs=>{ apply(qs.docs.map(d=>Object.assign({id:d.id}, d.data()))); S.ready[k]=true; schedule(); }, err(k)));
  doc("master/produk","produk",d=>{ const l=(d&&d.items)||[]; S.produk = l.length && !l.some(p=>/ultimate/i.test(p.nama)) ? [...l, {...G2_ULTIMATE}] : l; });
  doc("master/bahan","bahan",d=>S.bahanLama=(d&&d.items)||[]);
  doc("master/bom","bom",d=>S.bomLama=(d&&d.items)||{});

function nameOf(uid){

function download(name, rows){
  try{ const blob=new Blob(["﻿"+csv(rows)],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
  catch(e){ copyRows(rows); }
}
function csv(rows){ return rows.map(r=>r.map(v=>{ const s=typeof v==="number"?String(Math.round(v*100)/100).replace(".",","):String(v??""); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\n"); }
function copyRows(rows){ const tsv=rows.map(r=>r.map(v=>typeof v==="number"?String(Math.round(v*100)/100).replace(".",","):v).join("\t")).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(tsv):Promise.reject()).then(()=>toast("Tabel disalin. Tempel di Excel atau Google Sheets."),()=>toast("Browser menolak menyalin otomatis.")); }
const fdt = iso => { if(!iso) return ""; const d=new Date(iso); return pad(d.getDate())+" "+BLN[d.getMonth()]+" "+d.getFullYear()+", "+pad(d.getHours())+":"+pad(d.getMinutes()); };

  </div>`;
}
/* tugas yang Anda berikan dan sudah diselesaikan orang lain, sejak terakhir membuka halaman Tugas */
const isNewDone = t => t.createdBy===S.uid && t.status==="selesai" && t.selesaiBy && t.selesaiBy!==S.uid && (t.selesaiAt||"")>(S.doneSeenPrev ?? ((S.profile&&S.profile.lastSeenDone)||""));

function markDoneSeen(){
  if(!S.profile) return; const prev=S.profile.lastSeenDone||""; const list=doneNew(); if(!list.length) return;
  if(S.doneSeenPrev==null) S.doneSeenPrev=prev;

/* ----- riwayat tugas selesai ----- */
const doneAt = t => t.selesaiAt || t.updatedAt || "";

function thRows(){
  const U=S.ui; const y=U.thY, m=U.thM, st=U.thStaf, q=(U.thQ||"").toLowerCase();
  return S.tugas.filter(t=>t.status==="selesai" && doneAt(t)).filter(t=>{ const d=doneAt(t).slice(0,7);
    return d.startsWith(y) && (!m||d===m) && (!st||doneBy(t)===st) && (!q||[t.judul,t.catatan,userName(doneBy(t)),userName(t.createdBy)].join(" ").toLowerCase().includes(q)); })
    .sort((a,b)=>doneAt(b).localeCompare(doneAt(a)));

function riwayatTugas(){
  const U=S.ui; const years=[...new Set([TODAY.slice(0,4), ...S.tugas.filter(t=>t.status==="selesai"&&doneAt(t)).map(t=>doneAt(t).slice(0,4))])].sort().reverse();

      <select id="thStaf" data-th="thStaf" aria-label="Staf"><option value="">Semua staf</option>${staf.map(u=>`<option value="${esc(u.id)}"${u.id===U.thStaf?" selected":""}>${esc(u.nama||u.email)}</option>`).join("")}</select>
      <input type="search" id="thQ" data-th="thQ" placeholder="Cari tugas…" value="${esc(U.thQ||"")}" style="flex:1;max-width:240px">
      <button class="btn right" data-act="dl-tugas">Unduh CSV</button></div>
    <section class="panel"><div class="ph"><h2>Ringkasan per staf</h2><span class="hint">${esc(per)}</span></div>
      <div class="tw"><table><thead><tr><th>Staf</th><th class="n">Selesai</th><th class="n">Tepat waktu</th><th class="n">Terlambat</th><th class="n">Tanpa tenggat</th><th class="n">Masih terbuka</th><th class="n">Lewat tenggat</th></tr></thead><tbody>
      ${people.map(k=>{ const o=sum[k]||{n:0,telat:0,tepat:0,tanpa:0}; const op=k==="-"?[]:openOf(k); const late=op.filter(isLate).length;

      </tbody></table></div><div class="pb hint">Selesai/tepat waktu/terlambat dihitung untuk periode yang dipilih. "Masih terbuka" dan "lewat tenggat" adalah kondisi saat ini.</div></section>
    <section class="panel"><div class="ph"><h2>Tugas selesai</h2><span class="hint">${rows.length} tugas · ${esc(per)}</span></div>
      <div class="tw">${rows.length?`<table><thead><tr><th>Selesai</th><th>Tugas</th><th>Dikerjakan oleh</th><th>Dari</th><th>Dibuat</th><th>Tenggat</th><th>Status</th></tr></thead><tbody>
      ${rows.map(t=>`<tr class="click" data-act="t-open" data-v="${esc(t.id)}" tabindex="0"><td>${fdt(doneAt(t))}</td><td class="wrap"><b>${esc(t.judul)}</b>${t.prioritas==="penting"?" "+pill("bad","Penting"):""}</td><td>${doneBy(t)?esc(userName(doneBy(t))):"—"}</td><td>${esc(userName(t.createdBy))}</td><td>${t.createdAt?fdate(t.createdAt.slice(0,10)):"—"}</td><td>${t.tenggat?fdate(t.tenggat):"—"}</td><td>${!t.tenggat?pill("idle","Tanpa tenggat"):isTelat(t)?pill("bad","Terlambat"):pill("ok","Tepat waktu")}</td></tr>`).join("")}
      </tbody></table>`:`<div class="empty">Belum ada tugas selesai ${esc(per)}.</div>`}</div></section>
  </div>`;
}
function tugasCsv(){ return [["Selesai","Tugas","Catatan","Dikerjakan oleh","Dari","Dibuat","Tenggat","Status"],...thRows().map(t=>[doneAt(t).replace("T"," ").slice(0,16),t.judul,t.catatan||"",doneBy(t)?userName(doneBy(t)):"",userName(t.createdBy),(t.createdAt||"").slice(0,10),t.tenggat||"",!t.tenggat?"Tanpa tenggat":isTelat(t)?"Terlambat":"Tepat waktu"])]; }
V.tugas = () => {

async function saveTugas(){
  const M=S.modal, d=M.d; if(!String(d.judul||"").trim()){ toast("Judul tugas wajib diisi."); return; }

  const body={judul:String(d.judul).trim(), catatan:String(d.catatan||"").trim(), untuk:d.untuk||"", tenggat:d.tenggat||"", prioritas:d.prioritas||"biasa", status:d.status||"belum", updatedAt:now, updatedBy:S.uid};
  if(body.status==="selesai" && M.orig!=="selesai"){ body.selesaiAt=now; body.selesaiBy=S.uid; }
  M.busy=true; renderModal();
  try{
    if(M.isNew){ body.createdBy=S.uid; body.createdAt=now; await quick(fs.collection("tugas").doc().set(body)); }
    else await quick(fs.collection("tugas").doc(M.id).update(body));

}

/* =================== Keuangan (format laporan keuangan & laba-rugi PTCN) =================== */
const KEU_DEFAULT = {
  kategoriMasuk:["Ongkos produksi","Reimburse Belanja","Bunga Bank","Lain-lain"],
  kategoriKeluar:["Bahan baku","Gaji Harian","Gaji Tetap","Lembur pegawai tetap","Bonus pegawai tetap","Aktiva tetap","Kantor","Admin Bank","Pajak Bunga","Investasi","Belanja & Biaya Lain-lain"],
  akun:[{nama:"Rekening BCA",saldoAwal:0},{nama:"Kas tunai",saldoAwal:0}]
};
const isTunai = n => /tunai|cash/i.test(n||"");
function keu(){ const k=S.keu||{}; let akun=k.akun&&k.akun.length?k.akun:KEU_DEFAULT.akun.slice(0,1);
  if(!akun.some(a=>isTunai(a.nama))) akun=[...akun,{nama:"Kas tunai",saldoAwal:0}];
  let kk=k.kategoriKeluar||KEU_DEFAULT.kategoriKeluar;
  if(!k.kelompokOf) kk=[...new Set([KAT_BARU[0], ...kk, ...KAT_BARU.slice(1)])];   /* sebelum pengaturan kelompok disimpan: tambahkan kategori baru */
  return {kategoriMasuk:k.kategoriMasuk||KEU_DEFAULT.kategoriMasuk, kategoriKeluar:kk, akun, kelompokOf:{...KEL_DEFAULT, ...(k.kelompokOf||{})}}; }
const akunNames = () => keu().akun.map(a=>a.nama);
const akunUtama = () => keu().akun[0].nama;
const akunTunai = () => (keu().akun.find(a=>isTunai(a.nama))||keu().akun[keu().akun.length-1]).nama;
function akunOf(r){ const n=akunNames(); return n.includes(r.akun) ? r.akun : n[0]; }
function pindahLabel(dari,ke){ return isTunai(ke)&&!isTunai(dari) ? "Tarik tunai" : isTunai(dari)&&!isTunai(ke) ? "Setor tunai" : "Pindah dana"; }
function kasAll(){ const out=[]; for(const m in S.kas) for(const r of S.kas[m]) out.push({...r,_m:m}); return out; }
/* untuk laba-rugi: pindah dana (tarik/setor tunai) tidak dihitung sebagai pemasukan/pengeluaran */
function kasSum(rows){ let masuk=0, keluar=0, nm=0, nk=0; for(const r of rows){ if(r.jenis==="pindah") continue; if(r.jenis==="masuk"){ masuk+=+r.jumlah||0; nm++; } else { keluar+=+r.jumlah||0; nk++; } } return {masuk,keluar,net:masuk-keluar,nm,nk}; }
/* arah transaksi untuk satu akun: +1 masuk, -1 keluar, 0 tidak menyentuh akun ini */
function arah(r, a){ if(r.jenis==="pindah") return r.ke===a ? 1 : r.dari===a ? -1 : 0; if(akunOf(r)!==a) return 0; return r.jenis==="masuk" ? 1 : -1; }
function kasSumAkun(rows, a){ let masuk=0, keluar=0, nm=0, nk=0; for(const r of rows){ const s=arah(r,a); if(s>0){ masuk+=+r.jumlah||0; nm++; } else if(s<0){ keluar+=+r.jumlah||0; nk++; } } return {masuk,keluar,net:masuk-keluar,nm,nk}; }
function nextMonth(m){ let y=+m.slice(0,4), b=+m.slice(5)+1; if(b>12){ b=1; y++; } return y+"-"+pad(b); }
function anchorOf(m, a){ const meta=(S.kasMeta||{})[m]||{}; const v=meta.saldoAwalAkun&&meta.saldoAwalAkun[a];
  if(typeof v==="number") return v; if(meta.saldoAwalAkun && a in meta.saldoAwalAkun) return null;
  if(a===akunUtama() && typeof meta.saldoAwal==="number") return meta.saldoAwal; return null; }
/* Saldo per bulan per akun: saldo awal = angka yang diisi untuk bulan itu, atau saldo akhir bulan sebelumnya. */
let _led=null;
function ledgerAll(){
  const key=S.kasVer||0; if(_led && _led.key===key && _led.today===TODAY) return _led;
  const ms=Object.keys(S.kas).concat(Object.keys(S.kasMeta||{})).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  const akun=keu().akun; const per={}; const tot={};
  for(const ak of akun){ const d={}; per[ak.nama]=d; if(!ms.length) continue; const last=[ms[ms.length-1], TODAY.slice(0,7)].sort()[1]; let prev=null;
    for(let m=ms[0]; m<=last; m=nextMonth(m)){ const s=kasSumAkun(S.kas[m]||[], ak.nama); const an=anchorOf(m, ak.nama); const anchored=an!=null;
      const awal=anchored?an:(prev==null?(+ak.saldoAwal||0):prev); const akhir=awal+s.net; d[m]={m, awal, akhir, ...s, anchored, selisih: anchored&&prev!=null ? awal-prev : 0, prev}; prev=akhir; } }
  for(const m of Object.keys(per[akun[0].nama]||{})){ const s=kasSum(S.kas[m]||[]); const rows=akun.map(a=>per[a.nama][m]);
    const awal=rows.reduce((x,r)=>x+r.awal,0), akhir=rows.reduce((x,r)=>x+r.akhir,0);
    tot[m]={m, awal, akhir, ...s, anchored:rows.some(r=>r.anchored), selisih:rows.reduce((x,r)=>x+r.selisih,0), prev:rows.every(r=>r.prev!=null)?rows.reduce((x,r)=>x+r.prev,0):null, perAkun:Object.fromEntries(akun.map(a=>[a.nama,per[a.nama][m]]))}; }
  _led={key, today:TODAY, per, tot}; return _led;
}
function ledger(a){ const L=ledgerAll(); return !a||a==="*" ? L.tot : (L.per[a]||{}); }
function ledOf(m, a){ const L=ledger(a); if(L[m]) return L[m]; const ms=Object.keys(L).sort();
  const base = !a||a==="*" ? keu().akun.reduce((x,k)=>x+(+k.saldoAwal||0),0) : +((keu().akun.find(k=>k.nama===a)||{}).saldoAwal||0);
  const before=ms.filter(x=>x<m).pop(); const awal=before?L[before].akhir:base; return {m, awal, akhir:awal, masuk:0, keluar:0, net:0, nm:0, nk:0, anchored:false, selisih:0}; }
function saldoKini(a){ return ledOf(TODAY.slice(0,7), a).akhir; }
function saldoRincian(){ const ak=keu().akun; if(ak.length<2) return ""; return ak.map(a=>esc(a.nama.replace(/^Rekening /,""))+" "+rp(saldoKini(a.nama))).join(" · ")+"<br>"; }
function kasYears(){ return [...new Set([...Object.keys(ledger()).map(m=>m.slice(0,4)), TODAY.slice(0,4)])].sort().reverse(); }
function kasMonthsOf(y){ const L=ledger(); return Array.from({length:12},(_,i)=>y+"-"+pad(i+1)).filter(m=>L[m] || m===TODAY.slice(0,7)).reverse(); }
function ensureKasMonth(){ const L=ledger(); const all=Object.keys(L).sort();
  if(!S.ui.kasMonth || !(L[S.ui.kasMonth] || S.ui.kasMonth===TODAY.slice(0,7))) S.ui.kasMonth = (S.kas[TODAY.slice(0,7)]||[]).length ? TODAY.slice(0,7) : (all.filter(m=>(S.kas[m]||[]).length).pop() || TODAY.slice(0,7));
  return S.ui.kasMonth; }
function ensureKasAkun(){ const n=akunNames(); if(S.ui.kasAkun!=="*" && !n.includes(S.ui.kasAkun)) S.ui.kasAkun=n[0]; return S.ui.kasAkun; }
function yearMonthPicker(kind, m, years, months){
  return `<select id="${kind}Year" data-year="${kind}" aria-label="Tahun">${years.map(y=>`<option value="${y}"${y===m.slice(0,4)?" selected":""}>${y}</option>`).join("")}</select>

}
function kasRowsSorted(m){ return (S.kas[m]||[]).map((r,i)=>({...r,_m:m,_i:i})).sort((a,b)=>(a.tgl||"").localeCompare(b.tgl||"")||a._i-b._i); }
function newKasForm(){ const a=S.ui.kasAkun&&S.ui.kasAkun!=="*"?S.ui.kasAkun:akunUtama(); return {tgl:TODAY, jenis:"keluar", kategori:"", akun:a, dari:akunUtama(), ke:akunTunai(), jumlah:"", ket:"", busy:false}; }
const upMonth = m => (BLNF[+m.slice(5)-1]+" "+m.slice(0,4)).toUpperCase();
const JENIS_OPT = d => `<option value="keluar"${d.jenis==="keluar"?" selected":""}>Debit (uang keluar)</option><option value="masuk"${d.jenis==="masuk"?" selected":""}>Kredit (uang masuk)</option><option value="pindah"${d.jenis==="pindah"?" selected":""}>Tarik / setor tunai (pindah dana)</option>`;

function barChart2(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||250, pl=52, pb=24, pt=12; const max=Math.max(1,...data.flatMap(d=>[d.a||0,d.b||0]));
  const step=niceStep(max/4); const top=Math.ceil(max*1.15/step)*step; const bw=(W-pl-8)/data.length; const ih=H-pt-pb;
  let g=""; for(let v=0; v<=top+1e-9; v+=step){ const y=pt+ih*(1-v/top); g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${esc(short(v))}</text>`; }
  let b=""; data.forEach((d,i)=>{ const x0=pl+i*bw+bw*.12, w=bw*.36;
    [[d.a,"var(--ok)","pemasukan",x0],[d.b,"var(--bad)","pengeluaran",x0+w+2]].forEach(([v,c,lab,x])=>{ v=v||0; const h=ih*(v/top); const y=H-pb-h;
      b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${esc(d.title||d.l)} ${lab}: ${rp(v)}</title></rect>`;
      b+=barLabel(v, x, w, y, h, H, pb); });
    b+=`<text x="${x0+w+1}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Grafik')}">${g}${b}</svg>`;
}

      <div class="row"><input type="file" id="importFile" accept=".json,application/json"><button class="btn ${empty?"pri":"danger"} ${S.importArmed?"armed":""}" data-act="import">${S.importArmed?"Klik lagi untuk menimpa data":"Impor"}</button></div>

async function doImport(){
  const f=$("#importFile") && $("#importFile").files[0]; if(!f){ toast("Pilih file data-awal.json dulu."); return; }
  let d; try{ d=JSON.parse(await f.text()); }catch(e){ toast("File tidak bisa dibaca. Pastikan memilih file .json dari Claude."); return; }
  if(d && ((d.trx && Object.keys(S.trx).length) || (d.kas && Object.keys(S.kas).some(m=>(S.kas[m]||[]).length))) && !S.importArmed){ S.importArmed=true; render(); return; }
  S.importArmed=false;
  if(!d || !(d.master || d.trx || d.masterSet || d.masterMerge || d.ops || d.kas || d.keuangan || d.shared)){ toast("Isi file tidak sesuai format data aplikasi."); return; }
  try{
    const batch=fs.batch(); let n=0;
    for(const k in (d.master||{})){ batch.set(fs.collection("master").doc(k), d.master[k]); n++; }
    for(const k in (d.masterSet||{})){ batch.set(fs.collection("master").doc(k), d.masterSet[k]); n++; }
    for(const k in (d.masterMerge||{})){ batch.set(fs.collection("master").doc(k), d.masterMerge[k], {merge:true}); n++; }
    for(const k in (d.shared||{})){ batch.set(fs.collection("shared").doc(k), d.shared[k]); n++; }
    for(const k in (d.trx||{})){ batch.set(fs.collection("trx").doc(k), d.trx[k]); n++; }
    for(const k in (d.kas||{})){ batch.set(fs.collection("kas").doc(k), d.kas[k]); n++; }
    for(const k in (d.keuangan||{})){ batch.set(fs.collection("keuangan").doc(k), d.keuangan[k]); n++; }
    await batch.commit();
    // operasi tambahan yang tidak menimpa data: tambah bahan, produk, dan resep bila belum ada
    if(d.ops && d.ops.length){
      let bahan=[...(S.bahanLama||[])], produk=[...S.produk], bom={...(S.bomLama||{})}, ch={bahan:0,produk:0,bom:0};
      for(const o of d.ops){
        if(o.op==="addBahan" && !bahan.some(b=>b.nama===o.nama)){ bahan.push({nama:o.nama,min:0}); ch.bahan++; }
        if(o.op==="addProduk" && !produk.some(p=>p.nama===o.item.nama)){ produk.push(o.item); ch.produk++; }
        if(o.op==="setBom" && !(bom[o.produk]&&bom[o.produk].length)){ bom[o.produk]=o.items; ch.bom++; }
      }
      if(ch.bahan) await saveMaster("bahan",{items:bahan.sort((x,y)=>x.nama.localeCompare(y.nama,"id"))});
      if(ch.produk) await saveMaster("produk",{items:produk});
      if(ch.bom) await saveMaster("bom",{items:bom});
      n+=ch.bahan+ch.produk+ch.bom;
    }
    toast("Impor selesai: "+n+" perubahan."); render();
  }catch(e){ writeErr(e); }
}

function authMsg(e){
  const c=e&&e.code||"";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c)) return "Email atau password salah.";
  if(c==="auth/email-already-in-use") return "Email ini sudah terdaftar. Silakan masuk.";
  if(c==="auth/weak-password") return "Password minimal 6 karakter.";
  if(c==="auth/invalid-email") return "Format email tidak valid.";
  if(c==="auth/too-many-requests") return "Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.";
  if(c==="auth/operation-not-allowed") return "Login email/password belum diaktifkan di Firebase (Authentication → Sign-in method).";
  if(c==="auth/unauthorized-domain") return "Alamat situs ini belum diizinkan di Firebase (Authentication → Settings → Authorized domains).";
  if(c==="auth/network-request-failed") return "Tidak ada koneksi internet.";
  return (e&&e.message)||"Terjadi kesalahan.";
}
async function doAuth(){
  const m=S.authMode, F=S.af; S.authErr=""; S.authInfo="";
  const email=String(F.email).trim();
  if(!email){ S.authErr="Isi email."; render(); return; }
  S.authBusy=true; render();
  try{
    if(m==="masuk") await auth.signInWithEmailAndPassword(email, F.pass);
    else if(m==="daftar"){ if(!String(F.nama).trim()){ throw {message:"Isi nama lengkap."}; } S.pendingNama=String(F.nama).trim(); await auth.createUserWithEmailAndPassword(email, F.pass); }
    else { await auth.sendPasswordResetEmail(email); S.authInfo="Link untuk mengatur ulang password sudah dikirim ke "+email+". Cek juga folder spam."; }
    F.pass="";
  }catch(e){ S.authErr=authMsg(e); }
  S.authBusy=false; render();
}

});
function renderNav(){
  const minus=S.calc&&gudangReady()?S.calc.bahan.filter(b=>b.st==="bad").length:0;
  const myLate=S.tugas.filter(t=>(t.untuk===S.uid||(!t.untuk&&(t.untukMulti||[]).includes(S.uid))) && isLate(t)).length; const un=unreadAnn();
  const pend=role()==="admin"?Object.values(S.users).filter(u=>u.role==="menunggu").length:0;
  let abPend=0; if(can("absenView") && S.ready.pekerja && isManajer()){ ensureLogs(TODAY); abPend=absenOrang().filter(p=>p.uid&&S.absLog&&S.absLog[logId(TODAY,p.uid,"masuk")]&&!recOf(p.id,TODAY,"masuk")).length; }
  const badge={absen:abPend, bahan:minus, tugas:myLate+(S.view==="tugas"?0:doneNew().length+taskNew().length), pengumuman:un, pengguna:pend};
  $("#nav").innerHTML=NAV.filter(g=>!g.need||(g.need==="admin"?role()==="admin":can(g.need))).map(g=>`<div class="navg"><div class="gl">${esc(g.g)}</div>${g.items.filter(it=>!it[2]||can(it[2])).map(([k,l])=>`<a href="#${k}" class="${S.view===k?"on":""}">${ico(k)}<span class="lb">${l}</span>${badge[k]?`<span class="badge">${badge[k]}</span>`:""}</a>`).join("")}</div>`).join("");
  renderBnav(badge);
  const p=S.profile||{}; $("#me").innerHTML=`<b>${esc(p.nama||"")}</b><span>${esc(ROLES[p.role]||"")}</span><a href="#" data-act="logout">Keluar</a>`;
}
function render(){
  const root=$("#root");
  if(!fb){ root.innerHTML=setupScreen(); return; }
  if(!S.authReady){ root.innerHTML=loadingBox("Menyiapkan…"); return; }
  if(!S.auth){ const ae=document.activeElement, aid=ae&&ae.id; root.innerHTML=authScreen(); if(aid){ const el=document.getElementById(aid); el&&el.focus(); } return; }
  if(!S.profile){ root.innerHTML=S.authErr?`<div class="authwrap"><div class="authcard"><div class="err">${esc(S.authErr)}</div><button class="btn" data-act="logout">Keluar</button></div></div>`:loadingBox("Membuka profil…"); return; }
  if(role()==="absen"){ root.innerHTML=absenOnlyScreen(); return; }
  if(!ACTIVE.includes(role())){ root.innerHTML=pendingScreen(); return; }
  shell(); renderNav();
  const main=$("#main");
  const ae=document.activeElement, aid=ae&&ae.id&&main.contains(ae)?ae.id:null; let ss=null; try{ ss=ae.selectionStart; }catch(e){}
  const sy=window.scrollY;
  let html;
  if(GUDANG_VIEWS.includes(S.view) && !gudangReady()) html=loadingBox("Memuat data gudang…");
  else html=(V[S.view]||V.beranda)();
  main.innerHTML=html;
  try{ afterRender(main); }catch(e){ console.error(e); }
  if(SNAP_VIEWS[S.view]){ const hd=main.querySelector(".head"); if(hd) hd.insertAdjacentHTML("beforeend", snapButton()); }
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,ss); }catch(e){} } }
  window.scrollTo(0,sy);
}
function renderModal(){
  const root=$("#modal"); const M=S.modal;
  if(!M){ root.innerHTML=""; return; }
  root.innerHTML = M.kind==="edit"?editModal(): M.kind==="bahan"?bahanModal(): M.kind==="prod"?prodModal(): M.kind==="tugas"?tugasModal(): M.kind==="ann"?annModal(): M.kind==="kas"?kasModal(): M.kind==="saldo"?saldoModal(): M.kind==="bahanEdit"?bahanEditModal(): M.kind==="pekerja"?pekerjaModal(): M.kind==="pkEdit"?pkEditModal(): M.kind==="bayar"?bayarModal(): M.kind==="absenEdit"?absenEditModal(): M.kind==="absenFoto"?absenFotoModal(): M.kind==="po"?poModal(): M.kind==="poUrg"?poUrgModal(): M.kind==="trenAtur"?trenAturModal():"";
}
function live(){
  const map={"live-bahan":bahanTable,"live-produk":produkTable,"live-catat":catatPreview,"live-rw":rwTable,"live-rencana":rencanaResult};
  for(const id in map){ const el=document.getElementById(id); if(el) el.innerHTML=map[id](); }
  if(S.view==="catat" && S.form) S.form.lines.forEach((l,i)=>{ const el=document.getElementById("l-dus-"+i); if(el) el.textContent=dusHint(l); });
  const kp=document.getElementById("k-prev"); if(kp && S.kasForm) kp.textContent=num(S.kasForm.jumlah)>0?rp(num(S.kasForm.jumlah)):"";

function route(){
  const h=location.hash.slice(1);
  const all=NAV.flatMap(g=>g.items.map(i=>i[0]));
  S.view = all.includes(h) && allowed(h) ? h : "beranda";
  S.modal=null; renderModal(); render(); window.scrollTo(0,0);
  if(S.view==="pengumuman") markAnnSeen();
  if(S.view==="tugas"){ S.doneSeenPrev=null; S.taskSeenPrev=null; markDoneSeen(); markTaskSeen(); } else { S.doneSeenPrev=null; S.taskSeenPrev=null; }
}

document.addEventListener("click", async e=>{
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act, v=a.dataset.v;
  switch(act){
    case "logout": e.preventDefault(); stopSubs(); S.authMode="masuk"; S.authErr=""; S.authInfo=""; S.af={email:"",pass:"",nama:""}; S.kasForm=null; S.keuEdit=null; S.modal=null; renderModal(); location.hash=""; await auth.signOut(); break;
    case "authMode": e.preventDefault(); S.authMode=v; S.authErr=""; S.authInfo=""; render(); break;
    case "tugasF": S.ui.tugasF=v; render(); break;
    case "dl-tugas": download("Riwayat Tugas "+(S.ui.thM?fmonth(S.ui.thM):S.ui.thY)+".csv", tugasCsv()); break;
    case "t-new": S.modal={kind:"tugas", isNew:true, d:{judul:"",catatan:"",untuk:"",tenggat:"",prioritas:"biasa",status:"belum"}}; renderModal(); { const el=$("#x-judul"); el&&el.focus(); } break;
    case "t-open": { const t=S.tugas.find(x=>x.id===v); if(!t) return; S.modal={kind:"tugas", isNew:false, id:t.id, orig:t.status, d:{...t}}; renderModal(); break; }
    case "t-move": { e.stopPropagation(); const t=S.tugas.find(x=>x.id===v); if(!t) return; const now=new Date().toISOString(); const upd={status:a.dataset.s, updatedAt:now, updatedBy:S.uid}; if(a.dataset.s==="selesai"){ upd.selesaiAt=now; upd.selesaiBy=S.uid; }
      try{ await quick(fs.collection("tugas").doc(v).update(upd)); toast(a.dataset.s==="selesai"?"Tugas selesai.":"Status diperbarui."); }catch(err){ writeErr(err); } break; }
    case "t-save": saveTugas(); break;
    case "t-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } try{ await fs.collection("tugas").doc(M.id).delete(); S.modal=null; renderModal(); toast("Tugas dihapus."); }catch(err){ writeErr(err); } break; }
    case "a-edit": { const x=S.pengumuman.find(p=>p.id===v); if(!x) return; S.modal={kind:"ann", id:x.id, d:{...x}}; renderModal(); break; }
    case "a-save": { const M=S.modal; if(!String(M.d.judul).trim()||!String(M.d.isi).trim()){ toast("Judul dan isi wajib diisi."); return; } M.busy=true; renderModal();
      try{ await fs.collection("pengumuman").doc(M.id).update({judul:String(M.d.judul).trim(), isi:String(M.d.isi).trim(), penting:!!M.d.penting, updatedAt:new Date().toISOString()}); S.modal=null; renderModal(); toast("Pengumuman disimpan."); }catch(err){ M.busy=false; renderModal(); writeErr(err); } break; }
    case "a-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } try{ await fs.collection("pengumuman").doc(M.id).delete(); S.modal=null; renderModal(); toast("Pengumuman dihapus."); }catch(err){ writeErr(err); } break; }
    case "kasJenis": S.ui.kasJenis=v; render(); break;
    case "k-edit": { const r=(S.kas[a.dataset.m]||[]).find(x=>x.id===a.dataset.id); if(!r) return; S.modal={kind:"kas", m:a.dataset.m, id:r.id, d:{dari:akunUtama(), ke:akunTunai(), ...r, akun:akunOf(r), jumlah:dec(r.jumlah)}}; renderModal(); break; }
    case "k-save": saveKasEdit(); break;
    case "k-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } M.busy=true; renderModal();
      try{ await mutate(M.m, b=>{ b.items=b.items.filter(x=>x.id!==M.id); }, "kas"); S.modal=null; renderModal(); toast("Transaksi dihapus."); }catch(err){ M.busy=false; renderModal(); writeErr(err); } break; }
    case "keuTab": S.ui.keuTab=v; S.keuEdit=null; render(); break;
    case "ka-add": S.keuEdit.akun.push({nama:"",saldoAwal:"0"}); S.keuEdit.dirty=true; render(); break;
    case "ka-del": S.keuEdit.akun.splice(+v,1); S.keuEdit.dirty=true; render(); break;
    case "keu-save": saveKeuSetting(); break;
    case "dl-kas": { const m=ensureKasMonth(); const A=ensureKasAkun(); const L=ledOf(m,A); let run=L.awal;
      const sg=r=>A==="*"?(r.jenis==="pindah"?0:r.jenis==="masuk"?1:-1):arah(r,A);
      download("Laporan Keuangan PTCN "+(A==="*"?"":A+" ")+fmonth(m)+".csv", [["TANGGAL","KETERANGAN","KATEGORI","Kredit","Debit","SALDO"],[m+"-01","SALDO AWAL","","","",L.awal],
        ...kasRowsSorted(m).filter(r=>sg(r)!==0).map(r=>{ const g=sg(r); run+=g*(+r.jumlah||0); return [r.tgl,r.ket,r.jenis==="pindah"?pindahLabel(r.dari,r.ke):r.kategori,g>0?+r.jumlah:"",g<0?+r.jumlah:"",run]; }),
        ["","TOTAL","",L.masuk,L.keluar,L.akhir],[],["SALDO AWAL","","",L.awal],["MUTASI CR",L.nm,"",L.masuk],["MUTASI DB",L.nk,"",L.keluar],["SALDO AKHIR","","",L.akhir]]); break; }
    case "dl-keu": download("Rekap Keuangan "+S.ui.keuYear+".csv", rekapCsv(S.ui.keuYear)); break;
    case "dl-lr": download("Laba Rugi "+fmonth(ensureKasMonth())+".csv", lrRows(ensureKasMonth())); break;
    case "copy-lr": copyRows(lrRows(ensureKasMonth())); break;
    case "lr-go": e.preventDefault(); S.ui.kasMonth=v; S.ui.keuTab="lr"; S.ui.lrOpen=""; if(location.hash!=="#keuangan") location.hash="keuangan"; else render(); window.scrollTo(0,0); break;
    case "lr-open": S.ui.lrOpen = S.ui.lrOpen===v ? "" : v; render(); break;
    case "saldo-edit": { const m=ensureKasMonth(); const A=ensureKasAkun(); const an=anchorOf(m,A); S.modal={kind:"saldo", m, akun:A, d:{saldo:an!=null?fmt(an):""}}; renderModal(); break; }
    case "kasAkun": S.ui.kasAkun=v; S.kasForm=null; render(); break;
    case "kas-now": S.ui.kasMonth=TODAY.slice(0,7); break;
    case "lap-now": S.ui.lapMonth=TODAY.slice(0,7); break;
    case "bahan-go": S.ui.bahanQ=v; S.ui.bahanF="semua"; break;
    case "saldo-save": saveSaldo(); break;
    case "ct-add": S.catEdit.rows.push({nama:"",jumlah:""}); S.catEdit.dirty=true; render(); break;
    case "ct-del": S.catEdit.rows.splice(+v,1); S.catEdit.dirty=true; render(); break;
    case "cat-save": saveCatatan(); break;
    case "import": doImport(); break;
  }
});
document.addEventListener("input", e=>{
  const t=e.target, ds=t.dataset;
  if(ds.af!=null){ S.af[ds.af]=t.value; return; }
  if(ds.x!=null && S.modal){ S.modal.d[ds.x]= t.type==="checkbox" ? t.checked : t.value; S.modal.armed=false; if(ds.rerender){ S.modal.d.kategori=""; renderModal(); } return; }
  if(ds.kf!=null && S.kasForm){ S.kasForm[ds.kf]=t.value; if(ds.kf==="jenis"){ S.kasForm.kategori=""; render(); } else if(ds.kf==="dari"||ds.kf==="ke") render(); else live(); return; }
  if(ds.an!=null){ S.annForm[ds.an]= t.type==="checkbox" ? t.checked : t.value; return; }
  if(ds.ke!=null && S.keuEdit){ S.keuEdit[ds.ke]=t.value; S.keuEdit.dirty=true; return; }
  if(ds.kel!=null && S.keuEdit){ S.keuEdit.kel[ds.kel]=t.value; S.keuEdit.dirty=true; return; }
  if(ds.ka!=null && S.keuEdit){ S.keuEdit.akun[+ds.ka][ds.k]=t.value; S.keuEdit.dirty=true; return; }
  if(ds.th){ S.ui[ds.th]=t.value; if(ds.th==="thY") S.ui.thM=""; render(); return; }
  if(ds.ct!=null && S.catEdit){ S.catEdit.rows[+ds.ct][ds.k]=t.value; S.catEdit.dirty=true; return; }
  if(ds.year){ const y=t.value; pickYear(ds.year, y); render(); return; }
  if(ds.ui && ["kasMonth","keuYear","keuPeriod","tugasDone"].includes(ds.ui)){ /* handled by generic ui handler -> render */ }
});
document.addEventListener("change", async e=>{
  const t=e.target; if(t.dataset.actChange!=="role") return;
  const uid=t.dataset.v, r=t.value;

document.addEventListener("submit", e=>{
  if(e.target.id==="authForm"){ e.preventDefault(); doAuth(); }

/* =================== boot =================== */
(function boot(){
  const configured = typeof firebase!=="undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/TEMPEL/.test(FIREBASE_CONFIG.apiKey);
  if(!configured){ render(); return; }
  fb=firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); fs=firebase.firestore();
  const h=location.hash.slice(1); S.view = h || "beranda";
  render();
  auth.onAuthStateChanged(u=>{
    stopSubs(); if(S.profUnsub){ S.profUnsub(); S.profUnsub=null; }
    S.authReady=true; S.auth=u; S.profile=null; S.uid=u?u.uid:null; S.users={}; S.tugas=[]; S.pengumuman=[]; S.kas={}; S.kasMeta={}; S.catEdit=null; S.trx={}; S.calc=null; S.authErr=u?"":S.authErr;
    if(!u){ $("#root").innerHTML=""; render(); return; }
    S.profUnsub=fs.collection("users").doc(u.uid).onSnapshot(async s=>{
      if(!s.exists){
        if(S.creating) return; S.creating=true;
        const base={email:u.email||"", nama:S.pendingNama||(u.email||"").split("@")[0], createdAt:new Date().toISOString()};
        const ref=fs.collection("users").doc(u.uid);
        // Server rules decide who is the owner: try admin first, fall back to waiting for approval.
        try{ await ref.set({...base, role:"admin"}); }
        catch(e1){ try{ await ref.set({...base, role:"menunggu"}); }
          catch(err){ S.authErr="Profil gagal dibuat ("+(err.code||err.message)+"). Pastikan aturan Firestore sudah dipasang."; render(); } }
        S.creating=false; return;
      }
      const prevRole=role();
      S.profile=Object.assign({id:s.id}, s.data());
      S.canWrite=can("editGudang"); S.canEdit=role()==="admin"||role()==="penuh";
      if(ACTIVE.includes(role())){ if(S.subsOn && prevRole!==role()){ stopSubs(); } startSubs(); if(!allowed(S.view)) S.view="beranda"; }
      else if(role()==="absen"){ if(S.subsOn && prevRole!==role()){ stopSubs(); } startAbsenSubs(); }
      else { stopSubs(); $("#root").innerHTML=""; }
      render();
    }, err=>{ S.authErr="Profil tidak bisa dibaca ("+(err.code||err.message)+"). Pastikan aturan Firestore sudah dipasang."; render(); });
  });
kdInit(); bkInit(); alurInit(); cekInit();
})();
})();
