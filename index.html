<style>
/* Layout: warehouse ledger — fixed side rail of sections, working area of tables and entry forms; bin-label chips for codes. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#16201B; --muted:#5D6A63; --line:#D8DFD9;
  --accent:#1D5B8F; --accent-ink:#FFFFFF; --accent-soft:#E1EBF4;
  --ok:#2E7A4D; --ok-soft:#E1F0E6; --warn:#A86A12; --warn-soft:#F8ECD6; --bad:#B0322A; --bad-soft:#F7E1DE;
  --rail:#1B2621; --rail-ink:#D9E2DC; --rail-muted:#8A9A91;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --sunk:#121a16; --ink:#E4EBE6; --muted:#93A199; --line:#28332D;
  --accent:#78AEE0; --accent-ink:#0D1B28; --accent-soft:#1C2E3E;
  --ok:#62BD87; --ok-soft:#183026; --warn:#E3AA4E; --warn-soft:#33281A; --bad:#EA6B61; --bad-soft:#3A1F1C;
  --rail:#0B100D; --rail-ink:#D9E2DC; --rail-muted:#7F8E86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --sunk:#121a16; --ink:#E4EBE6; --muted:#93A199; --line:#28332D;
  --accent:#78AEE0; --accent-ink:#0D1B28; --accent-soft:#1C2E3E;
  --ok:#62BD87; --ok-soft:#183026; --warn:#E3AA4E; --warn-soft:#33281A; --bad:#EA6B61; --bad-soft:#3A1F1C;
  --rail:#0B100D; --rail-ink:#D9E2DC; --rail-muted:#7F8E86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.01em;line-height:1.05}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--rail-ink);text-decoration:none;padding:8px 10px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);font-weight:600}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-muted)}
.main{min-width:0;padding-block:24px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.pb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi{overflow:hidden}
.kpi .v{overflow-wrap:anywhere;font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tbody tr:hover{background:var(--sunk)}
tr.click{cursor:pointer}
tfoot td{font-weight:600;background:var(--sunk)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.code{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--sunk);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:20px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--sunk);color:var(--muted)}
.neg{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:0}
.qty{width:110px;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>input,label.f>select{color:var(--ink);font-size:14px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 120px auto auto;gap:8px;align-items:center}
.line.p3{grid-template-columns:minmax(0,1fr) 120px 120px auto}
.hint{font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 5px 5px 0}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.chart .vl{fill:var(--ink);font-family:var(--f-mono);font-weight:600}
.chart .vl.in{fill:#fff}
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.right{margin-left:auto}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;gap:14px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--rail)}
  .brand span,.rail .foot{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;min-width:0}
  .nav a{white-space:nowrap;padding:6px 9px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  h1{font-size:24px}
  .line,.line.p3{grid-template-columns:minmax(0,1fr) 96px auto}
  .line.p3 .ex{grid-column:1/-1}
  .qty{width:96px}
  .kpi .v{font-size:22px}
  .kpis{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- super app additions --- */
.navg{display:flex;flex-direction:column;gap:2px}
.navg>.gl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:10px 10px 4px;font-weight:600}
.nav{gap:6px;overflow-y:auto;min-height:0}
.rail .me{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.rail .me b{color:var(--rail-ink);font-weight:600}
.rail .me a{color:var(--rail-muted)}
.authwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--rail)}
.authcard{background:var(--surface);border-radius:10px;width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.authcard .brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:28px;color:var(--ink)}
.authcard .brand span{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.authcard form{display:flex;flex-direction:column;gap:12px}
.authcard input{width:100%}
.err{color:var(--bad);font-size:13px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>.ch{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-weight:600}
.task{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--muted)}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}
.task.late{border-left:3px solid var(--bad)}
.ann{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.ann .at{font-size:12px;color:var(--muted)}
.ann .body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.ann.pin{background:var(--warn-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
.money{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.setup{max-width:760px;display:flex;flex-direction:column;gap:14px}
.setup code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:3px}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .navg{flex-direction:row}
  .navg>.gl{display:none}
  .nav{gap:2px}
  .rail .foot{display:block;flex:none;margin-top:0}
  .rail .me b,.rail .me span{display:none}
  .rail .me a{white-space:nowrap}
}
html,body{margin:0}
#root{min-height:100%}
.authwrap{min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* layout fixes v2 */
.kpi .v{font-size:clamp(20px,2.1vw,30px);overflow-wrap:normal;word-break:normal}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel .pb table th,.panel .pb table td{padding:7px 9px}
.line.akun{grid-template-columns:minmax(0,1fr) 150px auto auto}
.line.akun .qty{width:150px}
@media (max-width:1100px){.grid2.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.line.akun{grid-template-columns:minmax(0,1fr) 120px auto}.line.akun .qty{width:120px}.line.akun .hint{display:none}}
/* line rows v3: keep delete button on the first row */
.line.p3 .ex{order:9}
@media (max-width:760px){
  .line{grid-template-columns:minmax(0,1fr) 80px auto 34px}
  .line.p3{grid-template-columns:minmax(0,1fr) 76px 86px 34px}
  .line .qty{width:100%}
  .line.akun{grid-template-columns:minmax(0,1fr) 120px 34px}
}
/* keuangan v4 */
.lr td.ind{padding-left:26px}
.lr tr.sub td{font-size:12.5px;color:var(--muted);background:var(--sunk)}
.lr td.ind2{padding-left:40px}
.lr tr.sec td{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;color:var(--muted);padding-top:14px}
.lr tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.lr tr.hl td{font-weight:600;background:var(--sunk)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
table.ledger tr.sa td{background:var(--sunk)}
table.sumtab{width:auto;min-width:min(360px,100%);border-collapse:collapse}
table.sumtab td{padding:5px 10px;border-bottom:1px solid var(--line)}
table.sumtab tr.tot td{border-top:2px solid var(--ink);border-bottom:none}
.kpi{container-type:inline-size}
@supports (font-size:1cqw){ .kpi .v{font-size:clamp(16px,10cqw,30px)} }
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.p-info{background:var(--accent-soft);color:var(--accent)}
/* v5: kotak beranda bisa diklik */
a.kpi.go{color:inherit;text-decoration:none;position:relative;transition:border-color .15s,box-shadow .15s}
a.kpi.go::after{content:"›";position:absolute;top:10px;right:14px;font-size:20px;color:var(--muted)}
a.kpi.go:hover,a.kpi.go:focus-visible{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
a.plain{color:inherit;text-decoration:none;display:block}
a.li.plain{display:flex}
a.li.plain:hover,a.plain:hover .ann{background:var(--accent-soft)}
/* v5 */
.p-off{background:var(--sunk);color:var(--muted)}
tr.muted td{color:var(--muted)}
tr.pindah td{background:var(--accent-soft)}
.box2{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sunk)}
.line.pk{grid-template-columns:minmax(130px,1fr) 104px 88px 70px 34px}
.line.pk .qty{width:100%;min-width:0}
.line.pk select{min-width:0}
.line.pk.hint{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:640px){ .lines .line.pk{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 70px 34px} .lines .line.pk select:first-child{grid-column:1/-1} .line.pk.hint{display:none} }
.akunseg button .hint{font-weight:400}
.snapcap{display:none}
.snapping .snapcap{display:block;font-size:13px;color:var(--muted);padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.snapping .no-snap,.snapping section.panel:has(form),.snapping .btn:not(.on){display:none!important}
.snapping .tw{overflow:visible!important}
.snapping #main{max-width:none!important}
.akunseg button.on .hint{color:inherit;opacity:.85}
/* v6: kelompok, rekap, cetak */
.lr tr.grp td{font-weight:600;background:var(--sunk)}
.lr td.ind2{padding-left:40px}
table.rekap th.kel,table.rekap td.kel{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
table.rekap th{white-space:normal;min-width:84px;vertical-align:bottom}
tr.pick td{background:var(--accent-soft)}
.printcap{display:none}
@media print{
  html,body{background:#fff!important}
  .rail,.toast,#modal,.no-print,.btn,.seg button:not(.on),.no-snap,.note.info{display:none!important}
  .app{display:block!important} .main{padding:0!important;max-width:none!important;width:auto!important;margin:0!important}
  .printcap{display:block;font-size:10px;color:#555;margin-bottom:6px}
  .head{margin-bottom:8px} .head h1{font-size:20px}
  .panel{box-shadow:none!important;border:1px solid #ccc!important;break-inside:auto}
  .tw{overflow:visible!important} table{font-size:10px!important} th,td{padding:4px 6px!important}
  table.rekap{font-size:9px!important} table.rekap th{min-width:0}
  a{color:inherit;text-decoration:none}

<div id="toast" class="toast" hidden></div>
<script>
(() => {
"use strict";
const ROLES = {admin:"Admin", penuh:"Akses penuh", gudang:"Gudang & produksi", keuangan:"Keuangan", staf:"Staf", menunggu:"Menunggu persetujuan", nonaktif:"Nonaktif"};
const ROLE_HINT = {admin:"Semua menu, termasuk keuangan, data master, dan pengguna", penuh:"Semua menu & bisa mengubah data master; tanpa pengguna, impor, dan pengumuman", gudang:"Catat & lihat gudang, tugas, pengumuman", keuangan:"Keuangan, lihat gudang, tugas, pengumuman", staf:"Tugas, pengumuman, lihat gudang", menunggu:"Belum bisa membuka data", nonaktif:"Tidak bisa masuk"};
const ACTIVE = ["admin","penuh","gudang","keuangan","staf"];
const NAV = [
  {g:"Umum", items:[["beranda","Beranda"],["tugas","Tugas"],["pengumuman","Pengumuman"]]},
  {g:"Gudang & produksi", items:[["bahan","Stok bahan baku"],["produk","Stok produk jadi"],["catat","Catat transaksi","editGudang"],["riwayat","Riwayat"],["rencana","Rencana produksi"],["laporan","Laporan produksi"],["master","Data master"]]},
  {g:"Keuangan", need:"viewKeu", items:[["kas","Buku kas"],["keuangan","Laporan keuangan"]]},
  {g:"Admin", need:"admin", items:[["pengguna","Pengguna & data"]]}
];
const GUDANG_VIEWS = ["bahan","produk","catat","riwayat","rencana","laporan","master"];
const S = {
  view:"beranda", ready:{}, db:true, user:null, uid:null, canWrite:false, canEdit:false,
  produk:[], bahan:[], bom:{}, setting:{komisiDefault:3500,komisi:{},arsip:[]}, rencana:{items:[]}, trx:{},
  calc:null, names:{},
  ui:{ bahanQ:"", bahanF:"semua", produkQ:"", produkAll:false, catatTab:"produksi", rwMonth:"", rwType:"semua", rwQ:"",
       lapMonth:"", rencanaQ:"", masterTab:"produk", tugasF:"saya", thY:"", thM:"", thStaf:"", thQ:"", tugasDone:false, kasMonth:"", kasJenis:"semua", kasAkun:"",
       keuYear:"", keuTab:"lr", lrOpen:"", lapYear:"", rwYear:"", keuPeriod:"tahun" },
  form:null, modal:null,
  authReady:false, auth:null, profile:null, users:{}, tugas:[], pengumuman:[], kas:{}, kasMeta:{}, kasVer:0, keu:null, catEdit:null,
  authMode:"masuk", authErr:"", authInfo:"", authBusy:false, af:{email:"",pass:"",nama:""},
  kasForm:null, annForm:{judul:"",isi:"",penting:false}, keuEdit:null, subsOn:false, unsub:[], importArmed:false
};
function role(){ return (S.profile && S.profile.role) || "none"; }
function can(x){
  const r=role(); if(r==="admin") return true;
  return ({viewGudang:ACTIVE.includes(r), editGudang:r==="gudang"||r==="penuh", viewKeu:r==="keuangan"||r==="penuh", editKeu:r==="keuangan"||r==="penuh", keuSetting:r==="keuangan"||r==="penuh", master:r==="penuh", tugas:ACTIVE.includes(r)})[x] || false;
}
const CLIENT = Math.random().toString(36).slice(2);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("id-ID",{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("id-ID",{maximumFractionDigits:0});
const fmt = n => nf.format(Math.round((+n||0)*100)/100);
const rp = n => "Rp" + nf0.format(Math.round(+n||0));
const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BLNF = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(new Date());
const fdate = s => { if(!s) return "—"; const [y,m,d]=s.split("-"); return d+" "+BLN[+m-1]+" "+y; };
const fmonth = k => { if(k==="tanpa-tanggal") return "Tanpa tanggal"; const [y,m]=k.split("-"); return BLNF[+m-1]+" "+y; };
const smonth = k => { const [y,m]=k.split("-"); return BLN[+m-1]+" "+y.slice(2); };
const num = v => { if(typeof v==="number") return v; const s=String(v??"").trim().replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?n:NaN; };
const sizeLabel = ml => ml>=1000 ? (ml/1000)+" L" : ml+" mL";
const rid = () => Math.random().toString(36).slice(2,10);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const monthOf = t => t ? t.slice(0,7) : "tanpa-tanggal";
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- calculations ---------- */
function usage(prodTot){ // ceil per product total, as the original sheet does
  const u = {};
  for(const p in prodTot){ for(const b of (S.bom[p]||[])){ u[b.bahan]=(u[b.bahan]||0)+Math.ceil(prodTot[p]*b.qty-1e-9); } }
  return u;
}
function compute(){
  const rows={pembelian:[],produksi:[],keluar:[]};
  for(const k in S.trx){ const d=S.trx[k]; for(const t in rows){ for(const r of (d[t]||[])) rows[t].push({...r,_m:k,_t:t}); } }
  const masuk={}, reject={}, prodTot={}, keluarTot={}, prod30={}, lastIn={};
  const from30 = addDays(TODAY,-30);
  for(const r of rows.pembelian){ const q=+r.qty||0; if(r.reject) reject[r.bahan]=(reject[r.bahan]||0)+q; else { masuk[r.bahan]=(masuk[r.bahan]||0)+q; if(r.tgl && (!lastIn[r.bahan]||r.tgl>lastIn[r.bahan])) lastIn[r.bahan]=r.tgl; } }
  for(const r of rows.produksi){ const q=+r.qty||0; prodTot[r.produk]=(prodTot[r.produk]||0)+q; if(r.tgl && r.tgl>=from30 && r.tgl<=TODAY) prod30[r.produk]=(prod30[r.produk]||0)+q; }
  for(const r of rows.keluar){ keluarTot[r.produk]=(keluarTot[r.produk]||0)+(+r.qty||0); }
  const pakai = usage(prodTot), pakai30 = usage(prod30);
  const names = new Set([...S.bahan.map(b=>b.nama), ...Object.keys(masuk), ...Object.keys(reject), ...Object.keys(pakai)]);
  const minMap = Object.fromEntries(S.bahan.map(b=>[b.nama,+b.min||0]));
  const korMap = Object.fromEntries(S.bahan.map(b=>[b.nama,(b.koreksi||[]).reduce((a,k)=>a+(+k.qty||0),0)]));
  const offSet = new Set(S.bahan.filter(b=>b.nonaktif).map(b=>b.nama));
  const bahan = [...names].map(n=>{
    const m=masuk[n]||0, rj=reject[n]||0, pk=pakai[n]||0, kor=korMap[n]||0, stok=m-rj-pk+kor, p30=pakai30[n]||0, perHari=p30/30;
    const hari = perHari>0 ? stok/perHari : null; const min=minMap[n]||0;
    let st="ok"; if(offSet.has(n)) st="off"; else if(stok<0) st="bad"; else if((hari!==null && hari<14) || (min>0 && stok<min)) st="warn"; else if(p30===0) st="idle";
    return {nama:n, masuk:m, reject:rj, pakai:pk, koreksi:kor, off:offSet.has(n), stok, p30, hari, min, st, lastIn:lastIn[n]||"", known:n in minMap};
  }).sort((a,b)=>a.nama.localeCompare(b.nama,"id"));
  const produk = S.produk.map(p=>{
    const pr=prodTot[p.nama]||0, kl=keluarTot[p.nama]||0, stok=pr-kl;
    return {...p, prod:pr, keluar:kl, stok, dus: p.isiKardus? stok/p.isiKardus : 0, p30:prod30[p.nama]||0};
  });
  const months = Object.keys(S.trx).filter(k=>k!=="tanpa-tanggal").sort();
  S.calc = {rows, bahan, produk, months, prodTot, undated: (S.trx["tanpa-tanggal"]||{}),
    undatedCount: ["pembelian","produksi","keluar"].reduce((a,t)=>a+((S.trx["tanpa-tanggal"]||{})[t]||[]).length,0)};
}
const PMAP = () => Object.fromEntries(S.produk.map(p=>[p.nama,p]));



/* ---------- small renderers ---------- */
const pill = (st, txt) => `<span class="pill p-${st}">${esc(txt)}</span>`;
const stTxt = {ok:"Aman", warn:"Menipis", bad:"Minus", idle:"Belum terpakai", off:"Tidak dipakai"};
function barLabel(v, x, w, yTop, h, H, pb, money){
  if(!(v>0)) return ""; const narrow=(window.innerWidth||1000)<640; const fs=narrow?17:10.5;
  const t=esc(narrow||money==="short" ? short(v) : fmt(Math.round(v))); const need=t.length*fs*.62+8; const cx=x+w/2+fs*.36;
  return h>=need ? `<text class="vl in" style="font-size:${fs}px" transform="translate(${cx},${H-pb-5}) rotate(-90)">${t}</text>`
                 : `<text class="vl" style="font-size:${fs}px" transform="translate(${cx},${yTop-4}) rotate(-90)">${t}</text>`;
}
function barChart(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||230, pl=44, pb=24, pt=10; const max=Math.max(1,...data.map(d=>d.v||0));
  const step=niceStep(max/4); const top=Math.ceil(max*1.12/step)*step; const bw=(W-pl-8)/data.length;
  let g=""; for(let v=0; v<=top+1e-9; v+=step){ const y=pt+(H-pt-pb)*(1-v/top); g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${esc(short(v))}</text>`; }
  let b=""; data.forEach((d,i)=>{ const h=(H-pt-pb)*((d.v||0)/top); const x=pl+i*bw+bw*.18; const w=bw*.64;
    b+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${Math.max(0,h)}" rx="2" fill="${d.muted?'var(--line)':'var(--accent)'}"><title>${esc(d.title||d.l)}: ${fmt(d.v)}</title></rect>`;
    if(data.length<=24) b+=barLabel(d.v||0, x, w, H-pb-h, h, H, pb);
    if(data.length<=14 || i%2===0) b+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Grafik')}">${g}${b}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function short(v){ return v>=1e6? nf.format(v/1e6)+"jt" : v>=1000? nf.format(v/1000)+"rb" : nf.format(v); }
function opts(list, sel, ph){ return (ph?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(v)}</option>`).join(""); }


async function resolveNames(){ return;
  if(!S.user) return; const ids=[...new Set([...document.querySelectorAll("[data-uid]")].map(e=>e.dataset.uid))]; if(!ids.length) return;
  try{ const ps=await S.user.profiles(ids); for(const id of ids){ S.names[id]=(ps[id]&&ps[id].name)||"Seseorang"; } document.querySelectorAll("[data-uid]").forEach(e=>e.textContent=S.names[e.dataset.uid]||"Seseorang"); }catch(e){}
}

/* ---------- views ---------- */
const V = {};
V.ringkasan = () => {
  const c=S.calc; const now=TODAY.slice(0,7); const prev=iso(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)).slice(0,7);
  const rN=monthReport(now), rP=monthReport(prev);
  const minus=c.bahan.filter(b=>b.st==="bad"), tipis=c.bahan.filter(b=>b.st==="warn");
  const dus=c.produk.reduce((a,p)=>a+Math.max(0,p.dus),0);
  const attn=[...minus,...tipis.sort((a,b)=>(a.hari??1e9)-(b.hari??1e9))].slice(0,9);
  const series=monthlySeries().slice(-12).map(s=>({l:smonth(s.bulan), v:s.input ?? s.arsip ?? 0, muted:s.input==null, title:fmonth(s.bulan)+(s.input==null?" (laporan PTCN lama)":"")}));
  const recent=[...c.rows.produksi.map(r=>({...r,k:"Produksi",it:r.produk})),...c.rows.pembelian.map(r=>({...r,k:r.reject?"Reject":"Penerimaan",it:r.bahan})),...c.rows.keluar.map(r=>({...r,k:"Keluar",it:r.produk}))]
    .sort((a,b)=>(b.at||b.tgl||"").localeCompare(a.at||a.tgl||"")).slice(0,8);
  const diff = rP.liter? (rN.liter-rP.liter)/rP.liter*100 : null;
  return `
  <div class="head"><div><div class="eyebrow">${fdate(TODAY)}</div><h1>Ringkasan gudang</h1></div>
    ${S.canWrite!==false?`<a class="btn pri" href="#catat">Catat transaksi</a>`:""}</div>
  <div class="stack">
    ${c.undatedCount?`<div class="note">${c.undatedCount} entri produksi belum punya tanggal (dari spreadsheet lama). Entri ini tetap dihitung di stok. <a href="#riwayat" data-act="rw-undated">Lengkapi tanggalnya</a>.</div>`:""}
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Produksi ${BLNF[+now.slice(5)-1]}</span><span class="v">${fmt(rN.liter)} L</span><span class="n">${fmt(rN.botol)} botol${diff!==null?` · bulan lalu ${fmt(rP.liter)} L`:""}</span></div>
      <div class="kpi ${minus.length?"bad":""}"><span class="eyebrow">Bahan stok minus</span><span class="v">${minus.length}</span><span class="n">pemakaian tercatat melebihi barang masuk</span></div>
      <div class="kpi ${tipis.length?"warn":""}"><span class="eyebrow">Bahan menipis</span><span class="v">${tipis.length}</span><span class="n">cukup &lt; 14 hari atau di bawah stok minimum</span></div>
      <div class="kpi"><span class="eyebrow">Stok produk jadi</span><span class="v">${fmt(Math.floor(dus))} dus</span><span class="n">${fmt(c.produk.reduce((a,p)=>a+Math.max(0,p.stok),0))} botol di gudang</span></div>
    </div>
    <div class="grid2">
      <section class="panel"><div class="ph"><h2>Perlu perhatian</h2><a href="#bahan" class="btn sm">Semua bahan</a></div>
        <div class="pb">${attn.length?`<div class="list">${attn.map(b=>`<div class="li"><div class="t"><b>${esc(b.nama)}</b><div class="hint">${b.st==="bad"?`Stok ${fmt(b.stok)} — cek penerimaan yang belum dicatat`:b.hari!==null?`Cukup ±${fmt(Math.max(0,Math.floor(b.hari)))} hari · pakai ${fmt(b.p30)} / 30 hari`:`Di bawah minimum ${fmt(b.min)}`}</div></div><div class="row"><span class="mono ${b.stok<0?"neg":""}">${fmt(b.stok)}</span>${pill(b.st,stTxt[b.st])}</div></div>`).join("")}</div>`:`<div class="empty">Semua bahan aman.</div>`}</div></section>
      <section class="panel"><div class="ph"><h2>Produksi per bulan</h2><span class="hint">liter</span></div>
        <div class="pb">${barChart(series,{label:"Produksi liter per bulan"})}<div class="hint">Batang abu-abu: angka dari laporan PTCN lama (sebelum ada input per produk).</div></div></section>
    </div>
    <section class="panel"><div class="ph"><h2>Aktivitas terbaru</h2><a href="#riwayat" class="btn sm">Riwayat</a></div>
      <div class="tw"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Barang</th><th class="n">Qty</th><th>Dicatat oleh</th></tr></thead>
      <tbody>${recent.map(r=>`<tr><td>${fdate(r.tgl)}</td><td>${esc(r.k)}</td><td>${esc(r.it)}</td><td class="n">${fmt(r.qty)}</td><td>${nameOf(r.by)}</td></tr>`).join("")}</tbody></table></div></section>
  </div>`;
};

V.bahan = () => `
  <div class="head"><div><div class="eyebrow">${S.calc.bahan.filter(b=>!b.off).length} jenis bahan dipakai</div><h1>Stok bahan baku</h1>
    <p class="sub">Stok = barang masuk − reject − pemakaian produksi (dari resep produk) ± koreksi stok dari hitung fisik.</p></div></div>
  <div class="stack">
    <div class="row"><input type="search" id="bahanQ" placeholder="Cari bahan…" value="${esc(S.ui.bahanQ)}" data-ui="bahanQ" style="flex:1;max-width:320px">
      <div class="seg">${[["semua","Semua"],["bad","Minus"],["warn","Menipis"],["ok","Aman"],["idle","Belum terpakai"],["off","Tidak dipakai"]].map(([k,l])=>`<button data-act="bahanF" data-v="${k}" class="${S.ui.bahanF===k?"on":""}">${l}</button>`).join("")}</div>
      <button class="btn right" data-act="dl-bahan">Unduh CSV</button></div>
    <section class="panel"><div class="tw" id="live-bahan">${bahanTable()}</div></section>
  </div>`;
function bahanTable(){
  const q=S.ui.bahanQ.toLowerCase(); const list=S.calc.bahan.filter(b=>(!q||b.nama.toLowerCase().includes(q))&&(S.ui.bahanF==="semua"?!b.off:b.st===S.ui.bahanF));

  ${list.map(b=>`<tr class="click" data-act="bahan-detail" data-v="${esc(b.nama)}"><td>${esc(b.nama)}${b.known?"":` <span class="code">baru</span>`}</td><td class="n">${fmt(b.masuk)}</td><td class="n">${b.reject?fmt(b.reject):"—"}</td><td class="n">${fmt(b.pakai)}</td>${adaKor?`<td class="n">${b.koreksi?(b.koreksi>0?"+":"")+fmt(b.koreksi):"—"}</td>`:""}<td class="n ${b.stok<0?"neg":""}"><b>${fmt(b.stok)}</b></td><td class="n">${b.p30?fmt(b.p30):"—"}</td><td class="n">${b.hari===null?"—":b.hari<0?"habis":"±"+fmt(Math.floor(b.hari))+" hari"}</td><td>${pill(b.st,stTxt[b.st])}</td><td>${fdate(b.lastIn)}</td></tr>`).join("")}</tbody></table>`;
}

V.produk = () => `
  <div class="head"><div><div class="eyebrow">${S.produk.length} produk terdaftar</div><h1>Stok produk jadi</h1>
    <p class="sub">Stok = total produksi − total produk keluar (termasuk sampel dan koreksi stock opname).</p></div></div>
  <div class="stack">
    <div class="row"><input type="search" id="produkQ" placeholder="Cari produk atau kode…" value="${esc(S.ui.produkQ)}" data-ui="produkQ" style="flex:1;max-width:320px">
      <label class="row hint"><input type="checkbox" id="produkAll" data-ui="produkAll" ${S.ui.produkAll?"checked":""}> Tampilkan produk tanpa stok</label>
      <button class="btn right" data-act="dl-produk">Unduh CSV</button></div>
    <section class="panel"><div class="tw" id="live-produk">${produkTable()}</div></section>
  </div>`;
function produkTable(){
  const q=S.ui.produkQ.toLowerCase(); const po=Object.fromEntries((S.rencana.items||[]).map(i=>[i.produk,+i.po||0]));
  const list=S.calc.produk.filter(p=>(!q||p.nama.toLowerCase().includes(q)||String(p.kode).toLowerCase().includes(q))&&(S.ui.produkAll||p.stok!==0||p.prod>0&&p.p30>0||po[p.nama]));

  ${list.map(p=>{ const o=po[p.nama]||0; const st=!o?"":p.stok>=o?pill("ok","Cukup"):pill("bad","Kurang "+fmt(o-p.stok));
    return `<tr><td><span class="code">${esc(p.kode)}</span></td><td>${esc(p.nama)}</td><td class="n">${fmt(p.isiKardus)}</td><td class="n">${fmt(p.prod)}</td><td class="n">${fmt(p.keluar)}</td><td class="n ${p.stok<0?"neg":""}"><b>${fmt(p.stok)}</b></td><td class="n">${fmt(Math.floor(p.dus*10)/10)}</td><td class="n">${o?fmt(o):"—"}</td><td>${st}</td></tr>`}).join("")}</tbody>
  <tfoot><tr><td></td><td>Total</td><td></td><td class="n">${fmt(list.reduce((a,p)=>a+p.prod,0))}</td><td class="n">${fmt(list.reduce((a,p)=>a+p.keluar,0))}</td><td class="n">${fmt(list.reduce((a,p)=>a+p.stok,0))}</td><td class="n">${fmt(Math.floor(list.reduce((a,p)=>a+p.dus,0)))}</td><td></td><td></td></tr></tfoot></table>`;
}

/* ----- Catat ----- */
function newForm(tab){
  const base={tab, tgl:TODAY, lines:[{item:"",qty:"",reject:false,ket:""},{item:"",qty:"",reject:false,ket:""},{item:"",qty:"",reject:false,ket:""}], busy:false};
  if(tab==="keluar") Object.assign(base,{tglPo:TODAY,noPo:"",tujuan:""});
  return base;
}
const CATAT_SEG = t => `<div class="seg">${[["pembelian","Penerimaan bahan"],["produksi","Produksi"],["keluar","Produk keluar"],["pekerja","Pekerja"]].map(([k,l])=>`<button data-act="catatTab" data-v="${k}" class="${t===k?"on":""}">${l}</button>`).join("")}</div>`;

  if(S.ui.catatTab==="pekerja") return `<div class="head"><div><div class="eyebrow">Input harian</div><h1>Catat transaksi</h1></div>${CATAT_SEG("pekerja")}</div>${readOnlyNote()}${catatPekerjaView()}`;
  if(!S.form || S.form.tab!==S.ui.catatTab) S.form=newForm(S.ui.catatTab);
  const F=S.form, t=F.tab;
  const items = t==="pembelian" ? S.calc.bahan.filter(b=>b.known&&!b.off).map(b=>b.nama) : S.produk.map(p=>p.nama);
  const tujuanList=[...new Set(S.calc.rows.keluar.map(r=>r.tujuan).filter(Boolean))].sort();
  return `
  <div class="head"><div><div class="eyebrow">Input harian</div><h1>Catat transaksi</h1></div>
    ${CATAT_SEG(t)}</div>
  ${readOnlyNote()}
  <div class="grid2 even">
    <section class="panel"><div class="ph"><h2>${t==="pembelian"?"Bahan baku diterima":t==="produksi"?"Hasil produksi":"Produk keluar ke distributor"}</h2></div>
      <form class="pb stack" id="catatForm" autocomplete="off">
        <div class="fgrid">
          <label class="f">${t==="keluar"?"Tanggal keluar":t==="pembelian"?"Tanggal diterima":"Tanggal produksi"}<input type="date" id="f-tgl" data-f="tgl" value="${esc(F.tgl)}" required></label>
          ${t==="keluar"?`<label class="f">Tanggal PO<input type="date" id="f-tglPo" data-f="tglPo" value="${esc(F.tglPo)}"></label>
          <label class="f">No PO<input type="text" id="f-noPo" data-f="noPo" value="${esc(F.noPo)}" placeholder="opsional"></label>
          <label class="f">Distributor / tujuan<input type="text" id="f-tujuan" data-f="tujuan" list="tujuanList" value="${esc(F.tujuan)}" placeholder="SAS, SS, Sampel…"></label>
          <datalist id="tujuanList">${tujuanList.map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`:""}
        </div>
        <div class="lines">
          ${F.lines.map((l,i)=>`<div class="line ${t==="pembelian"?"p3":""}">
            <select id="l-item-${i}" data-l="${i}" data-k="item" aria-label="Barang">${opts(items,l.item,t==="pembelian"?"Pilih bahan…":"Pilih produk…")}</select>
            <input type="text" inputmode="decimal" class="qty" id="l-qty-${i}" data-l="${i}" data-k="qty" value="${esc(l.qty)}" placeholder="${t==="pembelian"?"Qty":"Botol"}" aria-label="Jumlah">
            ${t==="pembelian"?`<select id="l-rej-${i}" data-l="${i}" data-k="reject" aria-label="Jenis"><option value="0"${!l.reject?" selected":""}>Masuk</option><option value="1"${l.reject?" selected":""}>Reject</option></select>
              <input type="text" class="ex" id="l-ket-${i}" data-l="${i}" data-k="ket" value="${esc(l.ket)}" placeholder="Keterangan (opsional)" style="grid-column:1/-1">`
            :`<span class="hint" id="l-dus-${i}" style="min-width:70px">${dusHint(l)}</span>`}
            <button type="button" class="btn sm" data-act="line-del" data-v="${i}" aria-label="Hapus baris" ${F.lines.length<2?"disabled":""}>✕</button>
          </div>`).join("")}
        </div>
        <div class="row"><button type="button" class="btn" data-act="line-add">+ Tambah baris</button>
          <button type="submit" class="btn pri right" ${S.canWrite===false||F.busy?"disabled":""}>${F.busy?"Menyimpan…":"Simpan"}</button></div>
      </form></section>
    <section class="panel"><div class="ph"><h2>${t==="produksi"?"Bahan yang terpakai":t==="keluar"?"Cek stok produk":"Stok setelah diterima"}</h2></div><div class="pb" id="live-catat">${catatPreview()}</div></section>
  </div>
  <section class="panel" style="margin-top:20px"><div class="ph"><h2>Baru dicatat</h2><a href="#riwayat" class="btn sm">Lihat semua</a></div><div class="tw">${recentOf(t)}</div></section>`;
};
function dusHint(l){ const p=S.produk.find(x=>x.nama===l.item); const q=num(l.qty); return p&&q>0&&p.isiKardus? "= "+fmt(Math.round(q/p.isiKardus*10)/10)+" dus" : ""; }
function formLines(){ return S.form.lines.filter(l=>l.item && num(l.qty)>0); }
function catatPreview(){
  const F=S.form, t=F.tab, lines=formLines(); const c=S.calc;
  if(!lines.length) return `<div class="empty">${t==="produksi"?"Isi produk dan jumlah botol untuk melihat bahan yang akan terpakai.":t==="keluar"?"Isi produk dan jumlah untuk mengecek stok gudang.":"Isi bahan dan jumlah untuk melihat stok sesudahnya."}</div>`;
  if(t==="produksi"){
    const tot={...c.prodTot}; for(const l of lines) tot[l.item]=(tot[l.item]||0)+num(l.qty);
    const after=usage(tot); const before=usage(c.prodTot); const bm=Object.fromEntries(c.bahan.map(b=>[b.nama,b]));
    const need=Object.keys(after).filter(k=>(after[k]||0)!==(before[k]||0)).map(k=>({n:k,use:(after[k]||0)-(before[k]||0),stok:bm[k]?bm[k].stok:0})).sort((a,b)=>(a.stok-a.use)-(b.stok-b.use));
    const short=need.filter(x=>x.stok-x.use<0);
    const liter=lines.reduce((a,l)=>{const p=S.produk.find(x=>x.nama===l.item); return a+num(l.qty)*(p?p.ml:0)/1000},0);
    return `${short.length?`<div class="note bad" style="margin-bottom:12px">${short.length} bahan akan minus setelah produksi ini. Periksa apakah ada penerimaan yang belum dicatat.</div>`:""}
    <div class="hint" style="margin-bottom:8px">Total ${fmt(lines.reduce((a,l)=>a+num(l.qty),0))} botol · ${fmt(liter)} liter</div>
    <div class="tw"><table><thead><tr><th>Bahan</th><th class="n">Terpakai</th><th class="n">Sisa stok</th></tr></thead><tbody>
    ${need.map(x=>`<tr title="Stok sekarang ${fmt(x.stok)}"><td class="wrap" style="min-width:0">${esc(x.n)}</td><td class="n">${fmt(x.use)}</td><td class="n ${x.stok-x.use<0?"neg":""}">${fmt(x.stok-x.use)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if(t==="keluar"){
    const pm=Object.fromEntries(c.produk.map(p=>[p.nama,p])); const agg={}; for(const l of lines) agg[l.item]=(agg[l.item]||0)+num(l.qty);
    return `<div class="tw"><table><thead><tr><th>Produk</th><th class="n">Keluar</th><th class="n">Stok</th><th class="n">Sisa</th></tr></thead><tbody>
    ${Object.entries(agg).map(([n,q])=>{const s=pm[n]?pm[n].stok:0; return `<tr><td>${esc(n)}</td><td class="n">${fmt(q)}</td><td class="n">${fmt(s)}</td><td class="n ${s-q<0?"neg":""}">${fmt(s-q)}</td></tr>`}).join("")}</tbody></table></div>`;
  }
  const bm=Object.fromEntries(c.bahan.map(b=>[b.nama,b])); const agg={}; for(const l of lines) agg[l.item]=(agg[l.item]||0)+(l.reject?-1:1)*num(l.qty);
  return `<div class="tw"><table><thead><tr><th>Bahan</th><th class="n">Perubahan</th><th class="n">Stok</th><th class="n">Sesudah</th></tr></thead><tbody>
  ${Object.entries(agg).map(([n,q])=>{const s=bm[n]?bm[n].stok:0; return `<tr><td>${esc(n)}</td><td class="n">${q>0?"+":""}${fmt(q)}</td><td class="n">${fmt(s)}</td><td class="n ${s+q<0?"neg":""}">${fmt(s+q)}</td></tr>`}).join("")}</tbody></table></div>`;
}
function recentOf(t){
  const rows=[...S.calc.rows[t]].filter(r=>r.at).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,10);
  if(!rows.length) return `<div class="empty">Belum ada entri baru dari aplikasi ini. Entri yang Anda simpan akan muncul di sini.</div>`;
  return trxTable(rows,t,false);
}
async function submitCatat(){
  const F=S.form, t=F.tab, lines=formLines();
  if(!F.tgl){ toast("Isi tanggal dulu."); return; }
  if(!lines.length){ toast("Isi minimal satu baris barang dan jumlah."); return; }
  const bad=S.form.lines.filter(l=>(l.item&&!(num(l.qty)>0))||(!l.item&&String(l.qty).trim()));
  if(bad.length){ toast("Ada baris yang belum lengkap: barang dan jumlah harus diisi."); return; }
  const recs=lines.map(l=> t==="pembelian" ? stamp({id:rid(),tgl:F.tgl,bahan:l.item,qty:num(l.qty),ket:l.ket.trim(),reject:!!l.reject})
    : t==="produksi" ? stamp({id:rid(),tgl:F.tgl,produk:l.item,qty:num(l.qty)})
    : stamp({id:rid(),tgl:F.tgl,tglPo:F.tglPo||F.tgl,noPo:F.noPo.trim(),tujuan:F.tujuan.trim(),produk:l.item,qty:num(l.qty)}));
  F.busy=true; render();
  try{ await mutate(monthOf(F.tgl), b=>b[t].push(...recs)); S.form=newForm(t); if(t==="keluar"){ S.form.tujuan=F.tujuan; S.form.tglPo=F.tglPo; S.form.noPo=F.noPo; } S.form.tgl=F.tgl; toast(recs.length+" entri disimpan."); }
  catch(e){ writeErr(e); F.busy=false; }
  render();
}

/* ----- Riwayat ----- */
const TLBL={pembelian:"Penerimaan",produksi:"Produksi",keluar:"Produk keluar"};
function trxTable(rows, t, withMonth=true){
  const can=S.canWrite!==false;
  const head = t==="pembelian" ? `<th>Tanggal</th><th>Bahan</th><th class="n">Qty</th><th>Jenis</th><th>Keterangan</th>`
    : t==="produksi" ? `<th>Tanggal</th><th>Produk</th><th class="n">Botol</th><th class="n">Liter</th>`
    : t==="keluar" ? `<th>Tgl keluar</th><th>Tujuan</th><th>No PO</th><th>Produk</th><th class="n">Qty</th>`
    : `<th>Tanggal</th><th>Jenis</th><th>Barang</th><th class="n">Qty</th><th>Keterangan</th>`;
  const pm=PMAP();
  const cell = r => r._t==="pembelian" ? (t==="semua"?`<td>${r.reject?"Reject":"Penerimaan"}</td><td>${esc(r.bahan)}</td><td class="n">${fmt(r.qty)}</td><td class="wrap">${esc(r.ket)}</td>`:`<td>${esc(r.bahan)}</td><td class="n">${fmt(r.qty)}</td><td>${r.reject?pill("bad","Reject"):pill("ok","Masuk")}</td><td class="wrap">${esc(r.ket)}</td>`)
    : r._t==="produksi" ? (t==="semua"?`<td>Produksi</td><td>${esc(r.produk)}</td><td class="n">${fmt(r.qty)}</td><td></td>`:`<td>${esc(r.produk)}</td><td class="n">${fmt(r.qty)}</td><td class="n">${fmt((+r.qty||0)*((pm[r.produk]||{}).ml||0)/1000)}</td>`)
    : (t==="semua"?`<td>Keluar</td><td>${esc(r.produk)}</td><td class="n">${fmt(r.qty)}</td><td class="wrap">${esc([r.tujuan,r.noPo].filter(Boolean).join(" · "))}</td>`:`<td>${esc(r.tujuan||"—")}</td><td>${esc(r.noPo||"—")}</td><td>${esc(r.produk)}</td><td class="n">${fmt(r.qty)}</td>`);
  return `<table><thead><tr>${head}<th>Dicatat oleh</th>${can?"<th></th>":""}</tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.tgl?fdate(r.tgl):`<span class="neg">Tanpa tanggal</span>`}</td>${cell(r)}<td>${nameOf(r.by)}</td>${can?`<td class="n"><button class="btn sm" data-act="edit" data-m="${esc(r._m)}" data-t="${r._t}" data-id="${esc(r.id)}">Ubah</button></td>`:""}</tr>`).join("")}</tbody></table>`;
}
V.riwayat = () => {
  const c=S.calc; const months=[...c.months].filter(m=>m!=="tanpa-tanggal").reverse();
  const years=[...new Set(months.map(m=>m.slice(0,4)))]; if(!years.length) years.push(TODAY.slice(0,4));
  const valid=m=>months.includes(m) || (m==="tanpa-tanggal"&&c.undatedCount) || (/^Y:\d{4}$/.test(m)&&years.includes(m.slice(2)));
  if(!S.ui.rwMonth || !valid(S.ui.rwMonth)) S.ui.rwMonth=months.includes(TODAY.slice(0,7))?TODAY.slice(0,7):(months[0]||"");
  const cur=S.ui.rwMonth; const y = cur==="tanpa-tanggal" ? (S.ui.rwYear||years[0]) : cur.startsWith("Y:") ? cur.slice(2) : (cur.slice(0,4)||years[0]); S.ui.rwYear=y;
  const mOpts=[...(c.undatedCount?[["tanpa-tanggal","Tanpa tanggal"]]:[]), ["Y:"+y,"Sepanjang "+y], ...months.filter(m=>m.startsWith(y)).map(m=>[m,BLNF[+m.slice(5)-1]])];
  return `
  <div class="head"><div><div class="eyebrow">Semua transaksi</div><h1>Riwayat ${cur.startsWith("Y:")?"tahun "+y:cur==="tanpa-tanggal"?"tanpa tanggal":fmonth(cur)}</h1></div></div>
  <div class="stack">
    <div class="row"><select id="rwYear" data-year="rw" aria-label="Tahun">${years.map(x=>`<option value="${x}"${x===y?" selected":""}>${x}</option>`).join("")}</select>
      <select id="rwMonth" data-ui="rwMonth" aria-label="Bulan">${mOpts.map(([v,l])=>`<option value="${v}"${v===cur?" selected":""}>${esc(l)}</option>`).join("")}</select>
      <div class="seg">${[["semua","Semua"],["pembelian","Penerimaan"],["produksi","Produksi"],["keluar","Keluar"]].map(([k,l])=>`<button data-act="rwType" data-v="${k}" class="${S.ui.rwType===k?"on":""}">${l}</button>`).join("")}</div>
      <input type="search" id="rwQ" data-ui="rwQ" placeholder="Cari barang, tujuan…" value="${esc(S.ui.rwQ)}" style="flex:1;max-width:280px"></div>
    <section class="panel"><div class="tw" id="live-rw">${rwTable()}</div></section>
  </div>`;
};
function rwTable(){
  const m=S.ui.rwMonth, t=S.ui.rwType, q=S.ui.rwQ.toLowerCase(); const c=S.calc;
  const types=t==="semua"?["pembelian","produksi","keluar"]:[t];
  const inM = m.startsWith("Y:") ? (r=>r._m.startsWith(m.slice(2))) : (r=>r._m===m);
  const rows=types.flatMap(x=>c.rows[x].filter(inM)).filter(r=>!q||[r.bahan,r.produk,r.tujuan,r.noPo,r.ket].join(" ").toLowerCase().includes(q))
    .sort((a,b)=>(b.tgl||"").localeCompare(a.tgl||"")||(b.at||"").localeCompare(a.at||""));
  if(!rows.length) return `<div class="empty">Tidak ada transaksi untuk filter ini.</div>`;
  const LIM=1500; const more=rows.length>LIM;
  return `<div class="hint" style="padding:10px 12px">${rows.length} entri${more?` · menampilkan ${LIM} terbaru, persempit dengan pilihan bulan atau pencarian`:""}</div>`+trxTable(more?rows.slice(0,LIM):rows,t);
}

  S.modal={kind:"edit", m, t, id, d:{...r, qty:String(r.qty)}, armed:false, busy:false}; renderModal();
}

    </div><div class="hint">Dicatat oleh ${nameOf(d.by)}${d.at?" · "+fdate(d.at.slice(0,10)):""}</div></div>
    <div class="mf"><button class="btn danger ${M.armed?"armed":""}" data-act="edit-del" ${M.busy?"disabled":""}>${M.armed?"Klik lagi untuk menghapus":"Hapus entri"}</button>
      <span class="right"></span><button class="btn" data-act="modal-close">Batal</button><button class="btn pri" data-act="edit-save" ${M.busy?"disabled":""}>Simpan perubahan</button></div>
  </div></div>`;

async function saveEdit(){
  const M=S.modal, d={...M.d}; const q=num(d.qty); if(!(q>0)){ toast("Jumlah harus lebih dari 0."); return; }
  d.qty=q; if(M.t==="pembelian") d.reject=!!d.reject; const nm=monthOf(d.tgl); delete d._m; delete d._t;
  d.editBy=S.uid||null; d.editAt=new Date().toISOString();
  M.busy=true; renderModal();
  try{
    if(nm===M.m) await mutate(M.m, b=>{ const i=b[M.t].findIndex(x=>x.id===M.id); if(i>=0) b[M.t][i]=d; });
    else { await mutate(nm, b=>b[M.t].push(d)); await mutate(M.m, b=>{ b[M.t]=b[M.t].filter(x=>x.id!==M.id); }); }
    S.modal=null; renderModal(); toast("Perubahan disimpan.");
  }catch(e){ M.busy=false; renderModal(); writeErr(e); }
}
async function deleteEdit(){
  const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; }
  M.busy=true; renderModal();
  try{ await mutate(M.m, b=>{ b[M.t]=b[M.t].filter(x=>x.id!==M.id); }); S.modal=null; renderModal(); toast("Entri dihapus."); }
  catch(e){ M.busy=false; renderModal(); writeErr(e); }
}

/* ----- Bahan detail ----- */
function bahanModal(){
  const n=S.modal.nama; const b=S.calc.bahan.find(x=>x.nama===n)||{}; const c=S.calc;
  const ins=c.rows.pembelian.filter(r=>r.bahan===n).sort((a,b)=>(b.tgl||"").localeCompare(a.tgl||"")).slice(0,12);
  const months=c.months.slice(-6); const pm={};
  for(const m of months){ const tot={}; for(const r of c.rows.produksi) if(r._m===m) tot[r.produk]=(tot[r.produk]||0)+(+r.qty||0); pm[m]=usage(tot)[n]||0; }
  const usedBy=Object.entries(S.bom).filter(([p,l])=>l.some(x=>x.bahan===n)).map(([p,l])=>p+" ("+fmt(l.find(x=>x.bahan===n).qty)+")");
  return `<div class="overlay" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><div><div class="eyebrow">Bahan baku</div><h2 id="mt">${esc(n)}</h2></div><button class="btn sm" data-act="modal-close" aria-label="Tutup">✕</button></div>
    <div class="mb">
      <div class="kpis"><div class="kpi"><span class="eyebrow">Stok</span><span class="v ${b.stok<0?"neg":""}">${fmt(b.stok)}</span></div>
        <div class="kpi"><span class="eyebrow">Pakai 30 hari</span><span class="v">${fmt(b.p30)}</span></div>
        <div class="kpi"><span class="eyebrow">Cukup untuk</span><span class="v">${b.hari===null?"—":fmt(Math.max(0,Math.floor(b.hari)))+" hr"}</span></div>
        <div class="kpi"><span class="eyebrow">Stok minimum</span><span class="v">${b.min?fmt(b.min):"—"}</span></div></div>
      <div><div class="eyebrow" style="margin-bottom:6px">Pemakaian per bulan</div>${barChart(months.map(m=>({l:smonth(m),v:pm[m],title:fmonth(m)})),{h:150,label:"Pemakaian per bulan"})}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Penerimaan terakhir</div>${ins.length?`<div class="tw"><table><thead><tr><th>Tanggal</th><th class="n">Qty</th><th>Jenis</th><th>Keterangan</th></tr></thead><tbody>${ins.map(r=>`<tr><td>${fdate(r.tgl)}</td><td class="n">${fmt(r.qty)}</td><td>${r.reject?pill("bad","Reject"):pill("ok","Masuk")}</td><td class="wrap">${esc(r.ket)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="hint">Belum ada penerimaan.</div>`}</div>
      <div class="hint">Dipakai di: ${usedBy.length?esc(usedBy.join(", ")):"belum ada resep produk yang memakai bahan ini"}.</div>
    </div></div></div>`;
}

/* ----- Rencana ----- */
V.rencana = () => {

function rencanaResult(){

/* =================== Laporan produksi v3: sumber resmi PTCN + skema HPP + add-on + potongan + listrik =================== */
const HPP_DEFAULT = {
  "Aussie":{20000:133658,5000:46768,1000:9908,500:5926,250:10540},
  "Aussie Hijau":{1000:8421},
  "Aussie Ultimate":{1000:9908},
  "Bensu":{5000:46215,1000:9780,500:5798,250:10412,100:5985},
  "Kojien":{5000:46215,1000:9780,500:5798,250:10412,100:5985},
  "Saratoga":{1000:9405,500:5423,250:10037,100:5349},
  "Amino Aktif":{1000:9405,500:5423,250:10037,100:5349},
  "Amino Pro":{}, "Asaminox":{}
};
const MEREK_LABEL = {"Aussie":"Aussie (Merah)","Bensu":"Bensu (Biru)","Kojien":"Kojien (Ungu)"};
const HPP_SIZES = [20000,5000,1000,500,250,100];
const LISTRIK_DEFAULT = {tarifKwh:1440, jamHari:8, lembur:0, alat:[{nama:"Kipas",kw:0.05},{nama:"Lampu",kw:0.02},{nama:"Sealer",kw:0.15},{nama:"AC",kw:0.1}]};
const HPP_MULAI = "2026-08";
const mLabel = m => MEREK_LABEL[m] || m;
const dec = x => x==null||x==="" ? "" : String(x).replace(".",",");
const nn = v => { const x=num(v); return isFinite(x)?x:0; };
/* HPP berversi: tiap versi berlaku mulai bulan tertentu, jadi kenaikan harga tidak mengubah bulan sebelumnya. */
function hppVersions(){ const st=S.setting||{}; const v=(st.hppVersi&&st.hppVersi.length) ? st.hppVersi : [{mulai:HPP_MULAI, tabel:st.hpp||HPP_DEFAULT}]; return [...v].sort((a,b)=>a.mulai.localeCompare(b.mulai)); }
function hppVersionFor(m){ const v=hppVersions(); m=m||TODAY.slice(0,7); let pick=v[0]; for(const x of v) if(x.mulai<=m) pick=x; return pick; }
function hppTable(m){ return hppVersionFor(m).tabel||{}; }
function hppOf(merek, ml, m){ const t=hppTable(m)[merek]; return t ? (+t[ml]||0) : 0; }
function pickYear(kind, y){
  if(kind==="kas"||kind==="lr"){ const ms=kasMonthsOf(y); S.ui.kasMonth=ms[0]||y+"-12"; S.ui.lrOpen=""; S.catEdit=null; }
  else if(kind==="lap"){ const ms=monthlySeries().map(s=>s.bulan).filter(m=>m.startsWith(y)).sort(); S.ui.lapYear=y; S.ui.lapMonth=ms.filter(m=>m<TODAY.slice(0,7)).pop()||ms.pop()||S.ui.lapMonth; }
  else if(kind==="rw"){ const ms=S.calc.months.filter(m=>m.startsWith(y)).sort(); S.ui.rwYear=y; S.ui.rwMonth=ms.pop()||("Y:"+y); }
}
function addonTemplates(){ return (S.setting && S.setting.addon) || {}; }
function arsipOf(m){ const a=S.arsipPTCN && S.arsipPTCN.bulan; return a && a[m] && a[m].length ? a[m] : null; }
function inputRowsOf(m){
  const pm=PMAP();
  return S.calc.rows.produksi.filter(r=>r._m===m).map(r=>{ const p=pm[r.produk]||{}; return {tgl:r.tgl, merek:p.merek||"Lainnya", ml:+p.ml||0, qty:+r.qty||0, produk:r.produk}; });
}
const itemHarga = t => (t.komponen && t.komponen.length) ? t.komponen.reduce((a,k)=>a+(+k.harga||0),0) : (+t.harga||0);
const itemTotal = t => (t.jumlah!=null && t.qty==null) ? (+t.jumlah||0) : (+t.qty||0)*itemHarga(t);
function bayarCfg(m){
  const b=((S.setting||{}).bayar||{})[m]||{};
  const L=b.listrik||{};
  return {
    skema: b.skema || (m>=HPP_MULAI ? "hpp" : "liter"),
    tarif: b.tarif ?? (S.setting.komisi||{})[m] ?? S.setting.komisiDefault ?? 3500,
    listrik: {tarifKwh: L.tarifKwh ?? LISTRIK_DEFAULT.tarifKwh, jamHari: L.jamHari ?? LISTRIK_DEFAULT.jamHari, lembur: L.lembur ?? 0, alat: (L.alat && L.alat.length) ? L.alat : LISTRIK_DEFAULT.alat},
    hari: b.hari ?? null, listrikManual: b.listrikManual ?? null,
    tambahan: b.tambahan||[], potongan: (b.potongan||[]).map(p=>p.qty==null&&p.jumlah!=null?{nama:p.nama, qty:1, harga:+p.jumlah||0}:p), catatan: b.catatan||""
  };
}
function sumRows(rows){
  const days={}, sizes=new Set(); let botol=0, liter=0;
  for(const r of rows){ const q=+r.qty||0; sizes.add(r.ml); const d=r.tgl||""; days[d]=days[d]||{}; days[d][r.ml]=(days[d][r.ml]||0)+q; botol+=q; liter+=q*r.ml/1000; }
  return {days, sizes:[...sizes].sort((a,b)=>a-b), botol, liter};
}
/* Laporan PTCN tanpa pemisahan merek: bagi jumlah botol PTCN ke merek sesuai proporsi input harian
   (per tanggal & ukuran; bila hari itu tak ada input, pakai proporsi sebulan untuk ukuran itu). */
function allocateBrands(ar, inp){
  const day={}, mon={};
  for(const r of inp){ const kd=r.tgl+"|"+r.ml; (day[kd]=day[kd]||{})[r.merek]=(day[kd][r.merek]||0)+r.qty; (mon[r.ml]=mon[r.ml]||{})[r.merek]=(mon[r.ml][r.merek]||0)+r.qty; }
  const out=[];
  for(const r of ar){ const p=day[r.tgl+"|"+r.ml] || mon[r.ml]; const tot=p?Object.values(p).reduce((a,x)=>a+x,0):0;
    if(!tot){ out.push({...r, merek:"Belum diketahui"}); continue; }
    for(const b in p) out.push({tgl:r.tgl, ml:r.ml, merek:b, qty:r.qty*p[b]/tot}); }
  return out;
}
function monthReport(m){
  const ar=arsipOf(m); const inp=inputRowsOf(m);
  const src = ar ? "ptcn" : "input";
  const rows = ar ? ar : inp;
  const arsipHasBrand = !!(ar && ar.some(r=>r.merek));
  const brandMode = !ar ? "input" : arsipHasBrand ? "ptcn" : "alokasi";
  const brandRows = brandMode==="input" ? inp : brandMode==="ptcn" ? ar : allocateBrands(ar, inp);
  const base=sumRows(rows); const inS=sumRows(inp);
  const brand={}; let nilaiHpp=0;
  for(const r of brandRows){ const b=r.merek||"Lainnya"; brand[b]=brand[b]||{}; brand[b][r.ml]=brand[b][r.ml]||{q:0,v:0}; const v=(+r.qty||0)*hppOf(b,r.ml,m); brand[b][r.ml].q+=+r.qty||0; brand[b][r.ml].v+=v; nilaiHpp+=v; }
  const cfg=bayarCfg(m);
  const hariAuto=Object.keys(base.days).filter(Boolean).length;
  const hari = cfg.hari ?? hariAuto;
  const L=cfg.listrik;
  const alatRows = L.alat.map(a=>({nama:a.nama, kw:+a.kw||0, biaya:(+a.kw||0)*(+L.jamHari||0)*(+L.tarifKwh||0)}));
  const perHari = alatRows.reduce((a,x)=>a+x.biaya,0);
  const totalJam = hari*(+L.jamHari||0) + (+L.lembur||0);
  // rumus sesuai sheet PTCN: biaya per hari (kW × jam × tarif) × total jam kerja
  const listrik = cfg.listrikManual!=null ? +cfg.listrikManual : perHari*totalJam;
  const tambahan = cfg.tambahan.reduce((a,x)=>a+itemTotal(x),0);
  const potongan = cfg.potongan.reduce((a,x)=>a+itemTotal(x),0);
  const komisi = base.liter*cfg.tarif;
  const pendapatan = cfg.skema==="hpp" ? nilaiHpp - listrik + tambahan - potongan : komisi + tambahan - potongan;
  let selisih=[];
  if(ar){ const keys=new Set([...Object.keys(base.days),...Object.keys(inS.days)]);
    for(const d of [...keys].sort()){ for(const ml of new Set([...Object.keys(base.days[d]||{}),...Object.keys(inS.days[d]||{})].map(Number))){
      const a=(base.days[d]||{})[ml]||0, b=(inS.days[d]||{})[ml]||0; if(Math.abs(a-b)>1e-9) selisih.push({tgl:d, ml, ptcn:a, input:b}); } }
    selisih.sort((x,y)=>x.tgl.localeCompare(y.tgl)||x.ml-y.ml); }
  return {m, src, rows, inp, days:base.days, sizes:base.sizes, botol:base.botol, liter:base.liter, inputLiter:inS.liter,
    hppVer:hppVersionFor(m), brand, brandMode, brandFromInput: brandMode!=="ptcn", nilaiHpp, cfg, hari, hariAuto, alatRows, perHari, totalJam, listrik, tambahan, potongan, komisi, pendapatan, tarif:cfg.tarif, selisih,
    hpp:nilaiHpp, arsip: ar ? {liter:base.liter} : ((S.setting.arsip||[]).find(a=>a.bulan===m)||null)};
}
function monthlySeries(){
  const ms=new Set();
  (S.setting.arsip||[]).forEach(a=>ms.add(a.bulan));
  Object.keys((S.arsipPTCN&&S.arsipPTCN.bulan)||{}).forEach(m=>ms.add(m));
  (S.calc?S.calc.months:[]).forEach(m=>ms.add(m));
  return [...ms].sort().map(m=>{ const R=monthReport(m); const old=(S.setting.arsip||[]).find(a=>a.bulan===m);
    const resmi = R.src==="ptcn" ? R.liter : (R.inp.length ? R.inputLiter : (old?old.liter:null));
    return {bulan:m, resmi, input:R.inp.length?R.inputLiter:null, arsip: R.src==="ptcn"?R.liter:(old?old.liter:null), skema:R.cfg.skema, pendapatan: (R.inp.length||R.src==="ptcn")?R.pendapatan:(old&&old.hasil!=null?old.hasil:null)}; });
}
function lapRows(){
  const R=monthReport(S.ui.lapMonth); const sizes=R.sizes; const days=Object.keys(R.days).sort();
  const out=[["Tanggal",...sizes.map(sizeLabel),"Liter"]];
  for(const d of days){ const r=R.days[d]; out.push([d||"tanpa tanggal",...sizes.map(s=>r[s]||0), sizes.reduce((a,s)=>a+(r[s]||0)*s/1000,0)]); }
  out.push(["SUB TOTAL",...sizes.map(s=>days.reduce((a,d)=>a+(R.days[d][s]||0),0)),R.liter]);
  out.push([]); out.push(["TOTAL LITER",R.liter]);
  if(R.cfg.skema==="hpp"){
    out.push(["NILAI PRODUK JADI (HPP)",R.nilaiHpp]);
    out.push(["BIAYA LISTRIK ("+R.perHari+" per hari x "+R.totalJam+" jam)",-R.listrik]);
  } else out.push(["KOMISI ("+R.liter+" L x "+R.tarif+")",R.komisi]);
  R.cfg.tambahan.forEach(t=>out.push(["TAMBAHAN: "+t.nama+" ("+t.qty+" x "+itemHarga(t)+")",itemTotal(t)]));
  R.cfg.potongan.forEach(t=>out.push(["POTONGAN: "+t.nama+" ("+t.qty+" x "+itemHarga(t)+")",-itemTotal(t)]));
  out.push(["PENDAPATAN PTCN",R.pendapatan]);
  return out;
}

async function saveHpp(){
  const H=S.hppEdit; const seen=new Set(); const vers=[];
  for(const v of H.vers){ if(!/^\d{4}-\d{2}$/.test(v.mulai||"")){ toast("Isi bulan mulai berlaku untuk setiap versi HPP."); return; } if(seen.has(v.mulai)){ toast("Dua versi HPP mulai di bulan yang sama ("+fmonth(v.mulai)+")."); return; } seen.add(v.mulai);
    const tabel={}; for(const m in v.tabel){ const row={}; for(const s of HPP_SIZES){ const x=num(v.tabel[m][s]); if(isFinite(x)&&x>0) row[s]=x; } tabel[m]=row; } vers.push({mulai:v.mulai, tabel}); }
  vers.sort((a,b)=>a.mulai.localeCompare(b.mulai));
  try{ const ns={...S.setting, hppVersi:vers, hpp:vers[vers.length-1].tabel}; await saveMaster("setting",ns); S.setting=ns; S.hppEdit=null; toast("Tabel HPP disimpan ("+vers.length+" versi)."); render(); }catch(e){ writeErr(e); }
}
async function saveAddon(){

  try{ const ns={...S.setting, addon:out}; await saveMaster("setting",ns); S.setting=ns; S.addonEdit=null; toast("Add-on disimpan."); render(); }catch(e){ writeErr(e); }
}

const H2I_URL = window.__H2I_URL || "https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js";
const SNAP_VIEWS = {tugas:"Tugas", bahan:"Stok bahan baku", produk:"Stok produk jadi", riwayat:"Riwayat", laporan:"Laporan produksi", kas:"Buku kas", keuangan:"Laporan keuangan"};
function loadH2I(){ return new Promise((res,rej)=>{ if(window.htmlToImage) return res(); const s=document.createElement("script"); s.src=H2I_URL; s.onload=()=>res(); s.onerror=()=>rej(new Error("Gagal memuat alat gambar. Periksa koneksi internet.")); document.head.appendChild(s); }); }
function snapButton(){ return SNAP_VIEWS[S.view] ? `<button class="btn no-snap" data-act="snap" title="Simpan halaman ini sebagai gambar PNG">Unduh gambar</button>` : ""; }
async function snapPage(){
  const main=$("#main"); if(!main || S.snapBusy) return; S.snapBusy=true;
  const title=(main.querySelector("h1")||{}).textContent||SNAP_VIEWS[S.view]||"Halaman";
  toast("Membuat gambar…");
  const html=document.documentElement; html.classList.add("snapping");
  const cap=document.createElement("div"); cap.className="snapcap"; cap.innerHTML=`<b>${esc(NAMA_USAHA)} Super App</b> · ${esc(title)} · dibuat ${fdt(new Date().toISOString())} oleh ${esc((S.profile&&S.profile.nama)||"")}`;
  main.prepend(cap);
  try{
    await loadH2I();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const w=Math.ceil(Math.max(main.scrollWidth, ...[...main.querySelectorAll(".tw,.board")].map(t=>t.scrollWidth+48)));
    main.style.width=w+"px";
    const h=Math.ceil(main.scrollHeight);
    if(h>60000) throw new Error("Halaman terlalu panjang untuk dijadikan gambar. Persempit dulu (pilih satu bulan atau gunakan pencarian).");
    const ratio=Math.max(0.5, Math.min(2, Math.sqrt(1.2e8/(w*h)), 30000/h));
    const bg=getComputedStyle(document.body).backgroundColor;
    const blob=await htmlToImage.toBlob(main,{pixelRatio:ratio, width:w, height:h, backgroundColor:bg, cacheBust:false, skipFonts:false,
      filter:n=>!(n.classList && (n.classList.contains("no-snap")))});
    if(!blob) throw new Error("Gambar kosong.");
    const name=(NAMA_USAHA+" "+title).replace(/[\\/:*?"<>|]+/g,"-").trim()+".png";
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
    toast("Gambar disimpan: "+name);
  }catch(e){ toast((e&&e.message)||"Gagal membuat gambar."); }
  finally{ cap.remove(); main.style.width=""; html.classList.remove("snapping"); S.snapBusy=false; }
}

  const ada=new Set(pekerjaRows().filter(r=>r.tgl===F.tgl).map(r=>r.pid+"|"+r.shift)); const dup=lines.find(l=>ada.has(l.pid+"|"+l.shift));

/* rekap per bulan (Laporan produksi) */
function rekapPekerja(m){
  const rows=pekerjaRows().filter(r=>(r.tgl||"").slice(0,7)===m); const o={};
  for(const r of rows){ const k=r.pid||r.nama; const x=o[k]=o[k]||{pid:r.pid, nama:r.nama, hari:new Set(), s1:0, s2:0, leader:0, liter:0};
    x.hari.add(r.tgl); if(r.shift==="2") x.s2++; else x.s1++; if(r.jabatan==="Leader") x.leader++; x.liter+=+r.liter||0; }
  return Object.values(o).map(x=>{ const g=gajiOf(x.pid); const shift=x.s1+x.s2; const est=shift*(+g.gajiShift||0)+x.leader*(+g.tunjLeader||0)+x.liter*(+g.upahLiter||0);

function kelSums(m){ const o=Object.fromEntries(KELOMPOK.map(g=>[g,0])); for(const r of (S.kas[m]||[])) if(r.jenis==="keluar") o[kelOf(r.kategori)]+=+r.jumlah||0; return o; }

/* ----- tinjau kategori ----- */
const RX_BB=/STIKER|STICKER|BROSUR|BOTOL|KARDUS|KARTON|LABEL|HOLOGRAM|SHIELD|SEAL ?TAG|SEALTAG|JIRIGEN|JERIGEN|PLASTIK|SHRINK|AMINO|TUTUP|SOLASI|LAKBAN|CAIRAN|BAHAN BAKU|SPIRTUS|PRASETYA|MANYAR|BENTONIT|KARDUS DP/;
const RX_AKTIVA=/\bTAB\b|TABLET|LAPTOP|KOMPUTER|PRINTER|MESIN|SEALER|KIPAS|\bAC\b|SOFA|KURSI|MEJA|LEMARI|\bRAK\b|TIMBANGAN|CCTV|DISPENSER|POMPA|TANDON|ETALASE/;
const RX_KANTOR=/\bATK\b|KERTAS|TINTA|GALON|\bAIR\b|TISSUE|TISU|PULSA|INTERNET|WIFI|\bKUE\b|ROKOK|SNACK|KONSUMSI|MAKAN|AKOMODASI|RAPAT|TEKNISI|LISTRIK|SABUN|KEBERSIHAN/;
function saranKat(r){
  const u=String(r.ket||"").toUpperCase();
  if(/^CASH\b|TARIK TUNAI/.test(u)) return "__tarik";
  if(/INVEST|SAHAM|PASAR MODAL|SEKURITAS|TOP-?UP SAHAM/.test(u)) return "Investasi";
  if(/HARIAN|MINGGUAN|UPAH/.test(u)) return "Gaji Harian";
  if(/\bGAJI\b|\bTHR\b|BPJS|BULANAN/.test(u)) return "Gaji Tetap";
  if(RX_BB.test(u)) return "Bahan baku";
  if(/BENSIN|BBM|ONGKIR|ONGKOS KIRIM|PARKIR|\bTOL\b|GRAB|GOJEK|KURIR/.test(u)) return "Belanja & Biaya Lain-lain";
  if(RX_AKTIVA.test(u)) return "Aktiva tetap";
  if(RX_KANTOR.test(u)) return "Kantor";
  return "";
}
function tinjauRows(){
  const T=S.tj; const out=[];
  for(const m of Object.keys(S.kas).filter(m=>pakaiKelompok(m) && (T.m==="*"||m===T.m)).sort())
    for(const r of S.kas[m]) if(r.jenis==="keluar" && (T.f==="semua" || (r.kategori==="Belanja & Biaya Lain-lain"||!r.kategori) && !r.ditinjau)) out.push({...r,_m:m});
  return out.sort((a,b)=>(a.tgl||"").localeCompare(b.tgl||""));
}

      ${rows.map(r=>{ const p=T.pick[r.id]||""; const sar=saranKat(r); return `<tr${T.sel[r.id]?' class="pick"':""}>${edit?`<td><input type="checkbox" id="tj-c-${esc(r.id)}" data-tjc="${esc(r.id)}" ${T.sel[r.id]?"checked":""} aria-label="Pilih"></td>`:""}

async function saveTinjau(){
  const T=S.tj; const rows=tinjauRows().filter(r=>T.sel[r.id]); if(!rows.length) return;

  const byM={}; rows.forEach(r=>(byM[r._m]=byM[r._m]||[]).push(r));

      await mutate(m, b=>{ b.items=b.items.map(x=>{ if(!(x.id in ids)) return x; n++; const p=ids[x.id];

        return {...x, kategori:p, ditinjau:true, editBy:S.uid, editAt:now}; }); }, "kas"); }
    S.tj={...T, sel:{}, pick:{}, busy:false}; toast(n+" transaksi diperbarui.");

}

/* =================== Firebase data layer =================== */
let fb=null, auth=null, fs=null;
async function mutate(key, fn, col){
  col = col || "trx";
  const ref = fs.collection(col).doc(key);
  await fs.runTransaction(async tx => {
    const s = await tx.get(ref);
    const body = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};
    if(col==="trx"){ for(const t of ["pembelian","produksi","keluar","pekerja"]) body[t]=body[t]||[]; } else body.items=body.items||[];
    fn(body);
    const empty = col==="trx" ? (!body.pembelian.length && !body.produksi.length && !body.keluar.length && !body.pekerja.length) : (!body.items.length && body.saldoAwal==null && !(body.catatan||[]).length && !Object.values(body.saldoAwalAkun||{}).some(v=>v!=null));
    if(empty){ if(s.exists) tx.delete(ref); } else tx.set(ref, body);
  });
}
async function saveMaster(doc, body){ await fs.collection("master").doc(doc).set(body); }
let rencanaTimer=null;
function saveRencana(){ clearTimeout(rencanaTimer); rencanaTimer=setTimeout(async()=>{ try{ await fs.collection("shared").doc("rencana").set({items:S.rencana.items||[]}); }catch(e){ writeErr(e); } rencanaTimer=null; },800); }
function stamp(o){ return {...o, by:S.uid||null, at:new Date().toISOString()}; }
function writeErr(e){
  const c=e && e.code;
  if(c==="permission-denied") toast("Akun Anda tidak punya izin untuk perubahan ini.");
  else if(c==="unavailable") toast("Sedang offline. Coba lagi setelah internet tersambung.");
  else toast("Gagal menyimpan: "+((e&&e.message)||e));
}
function gudangReady(){ return ["produk","bahan","bom","setting","trx"].every(k=>S.ready[k]); }
let scheduled=false;
function schedule(){ if(scheduled) return; scheduled=true; requestAnimationFrame(()=>{ scheduled=false; if(gudangReady()) compute(); render(); if(S.modal && S.modal.kind==="bahan") renderModal(); }); }
function stopSubs(){ S.unsub.forEach(f=>{ try{ f(); }catch(e){} }); S.unsub=[]; S.subsOn=false; S.ready={}; }
function startSubs(){
  if(S.subsOn) return; S.subsOn=true;
  const err=k=>e=>{ S.ready[k]=true; if(!(e && e.code==="permission-denied")) toast("Sebagian data gagal dimuat ("+k+")."); schedule(); };
  const doc=(path,k,apply)=>S.unsub.push(fs.doc(path).onSnapshot(s=>{ apply(s.exists?s.data():null); S.ready[k]=true; schedule(); }, err(k)));
  const col=(path,k,apply)=>S.unsub.push(fs.collection(path).onSnapshot(qs=>{ apply(qs.docs.map(d=>Object.assign({id:d.id}, d.data()))); S.ready[k]=true; schedule(); }, err(k)));
  doc("master/produk","produk",d=>S.produk=(d&&d.items)||[]);
  doc("master/bahan","bahan",d=>S.bahan=(d&&d.items)||[]);
  doc("master/bom","bom",d=>S.bom=(d&&d.items)||{});

  doc("shared/rencana","rencana",d=>{ if(!rencanaTimer || S.view!=="rencana") S.rencana=d||{items:[]}; });
  col("trx","trx",docs=>{ const o={}; docs.forEach(d=>{ o[d.id]={pembelian:d.pembelian||[],produksi:d.produksi||[],keluar:d.keluar||[],pekerja:d.pekerja||[]}; }); S.trx=o; });

  }
}

/* =================== Keuangan (format laporan keuangan & laba-rugi PTCN) =================== */
const KEU_DEFAULT = {
  kategoriMasuk:["Ongkos produksi","Reimburse Belanja","Bunga Bank","Lain-lain"],
  kategoriKeluar:["Bahan baku","Gaji Harian","Gaji Tetap","Lembur pegawai tetap","Bonus pegawai tetap","Aktiva tetap","Kantor","Admin Bank","Pajak Bunga","Investasi","Belanja & Biaya Lain-lain"],
  akun:[{nama:"Rekening BCA",saldoAwal:0},{nama:"Kas tunai",saldoAwal:0}]
};
const isTunai = n => /tunai|cash/i.test(n||"");
function keu(){ const k=S.keu||{}; let akun=k.akun&&k.akun.length?k.akun:KEU_DEFAULT.akun.slice(0,1);
  if(!akun.some(a=>isTunai(a.nama))) akun=[...akun,{nama:"Kas tunai",saldoAwal:0}];
  let kk=k.kategoriKeluar||KEU_DEFAULT.kategoriKeluar;
  if(!k.kelompokOf) kk=[...new Set([KAT_BARU[0], ...kk, ...KAT_BARU.slice(1)])];   /* sebelum pengaturan kelompok disimpan: tambahkan kategori baru */
  return {kategoriMasuk:k.kategoriMasuk||KEU_DEFAULT.kategoriMasuk, kategoriKeluar:kk, akun, kelompokOf:{...KEL_DEFAULT, ...(k.kelompokOf||{})}}; }
const akunNames = () => keu().akun.map(a=>a.nama);
const akunUtama = () => keu().akun[0].nama;
const akunTunai = () => (keu().akun.find(a=>isTunai(a.nama))||keu().akun[keu().akun.length-1]).nama;
function akunOf(r){ const n=akunNames(); return n.includes(r.akun) ? r.akun : n[0]; }
function pindahLabel(dari,ke){ return isTunai(ke)&&!isTunai(dari) ? "Tarik tunai" : isTunai(dari)&&!isTunai(ke) ? "Setor tunai" : "Pindah dana"; }
function kasAll(){ const out=[]; for(const m in S.kas) for(const r of S.kas[m]) out.push({...r,_m:m}); return out; }
/* untuk laba-rugi: pindah dana (tarik/setor tunai) tidak dihitung sebagai pemasukan/pengeluaran */
function kasSum(rows){ let masuk=0, keluar=0, nm=0, nk=0; for(const r of rows){ if(r.jenis==="pindah") continue; if(r.jenis==="masuk"){ masuk+=+r.jumlah||0; nm++; } else { keluar+=+r.jumlah||0; nk++; } } return {masuk,keluar,net:masuk-keluar,nm,nk}; }
/* arah transaksi untuk satu akun: +1 masuk, -1 keluar, 0 tidak menyentuh akun ini */
function arah(r, a){ if(r.jenis==="pindah") return r.ke===a ? 1 : r.dari===a ? -1 : 0; if(akunOf(r)!==a) return 0; return r.jenis==="masuk" ? 1 : -1; }
function kasSumAkun(rows, a){ let masuk=0, keluar=0, nm=0, nk=0; for(const r of rows){ const s=arah(r,a); if(s>0){ masuk+=+r.jumlah||0; nm++; } else if(s<0){ keluar+=+r.jumlah||0; nk++; } } return {masuk,keluar,net:masuk-keluar,nm,nk}; }
function nextMonth(m){ let y=+m.slice(0,4), b=+m.slice(5)+1; if(b>12){ b=1; y++; } return y+"-"+pad(b); }
function anchorOf(m, a){ const meta=(S.kasMeta||{})[m]||{}; const v=meta.saldoAwalAkun&&meta.saldoAwalAkun[a];
  if(typeof v==="number") return v; if(meta.saldoAwalAkun && a in meta.saldoAwalAkun) return null;
  if(a===akunUtama() && typeof meta.saldoAwal==="number") return meta.saldoAwal; return null; }
/* Saldo per bulan per akun: saldo awal = angka yang diisi untuk bulan itu, atau saldo akhir bulan sebelumnya. */
let _led=null;
function ledgerAll(){
  const key=S.kasVer||0; if(_led && _led.key===key && _led.today===TODAY) return _led;
  const ms=Object.keys(S.kas).concat(Object.keys(S.kasMeta||{})).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  const akun=keu().akun; const per={}; const tot={};
  for(const ak of akun){ const d={}; per[ak.nama]=d; if(!ms.length) continue; const last=[ms[ms.length-1], TODAY.slice(0,7)].sort()[1]; let prev=null;
    for(let m=ms[0]; m<=last; m=nextMonth(m)){ const s=kasSumAkun(S.kas[m]||[], ak.nama); const an=anchorOf(m, ak.nama); const anchored=an!=null;
      const awal=anchored?an:(prev==null?(+ak.saldoAwal||0):prev); const akhir=awal+s.net; d[m]={m, awal, akhir, ...s, anchored, selisih: anchored&&prev!=null ? awal-prev : 0, prev}; prev=akhir; } }
  for(const m of Object.keys(per[akun[0].nama]||{})){ const s=kasSum(S.kas[m]||[]); const rows=akun.map(a=>per[a.nama][m]);
    const awal=rows.reduce((x,r)=>x+r.awal,0), akhir=rows.reduce((x,r)=>x+r.akhir,0);
    tot[m]={m, awal, akhir, ...s, anchored:rows.some(r=>r.anchored), selisih:rows.reduce((x,r)=>x+r.selisih,0), prev:rows.every(r=>r.prev!=null)?rows.reduce((x,r)=>x+r.prev,0):null, perAkun:Object.fromEntries(akun.map(a=>[a.nama,per[a.nama][m]]))}; }
  _led={key, today:TODAY, per, tot}; return _led;
}
function ledger(a){ const L=ledgerAll(); return !a||a==="*" ? L.tot : (L.per[a]||{}); }
function ledOf(m, a){ const L=ledger(a); if(L[m]) return L[m]; const ms=Object.keys(L).sort();
  const base = !a||a==="*" ? keu().akun.reduce((x,k)=>x+(+k.saldoAwal||0),0) : +((keu().akun.find(k=>k.nama===a)||{}).saldoAwal||0);
  const before=ms.filter(x=>x<m).pop(); const awal=before?L[before].akhir:base; return {m, awal, akhir:awal, masuk:0, keluar:0, net:0, nm:0, nk:0, anchored:false, selisih:0}; }
function saldoKini(a){ return ledOf(TODAY.slice(0,7), a).akhir; }
function saldoRincian(){ const ak=keu().akun; if(ak.length<2) return ""; return ak.map(a=>esc(a.nama.replace(/^Rekening /,""))+" "+rp(saldoKini(a.nama))).join(" · ")+"<br>"; }
function kasYears(){ return [...new Set([...Object.keys(ledger()).map(m=>m.slice(0,4)), TODAY.slice(0,4)])].sort().reverse(); }
function kasMonthsOf(y){ const L=ledger(); return Array.from({length:12},(_,i)=>y+"-"+pad(i+1)).filter(m=>L[m] || m===TODAY.slice(0,7)).reverse(); }
function ensureKasMonth(){ const L=ledger(); const all=Object.keys(L).sort();
  if(!S.ui.kasMonth || !(L[S.ui.kasMonth] || S.ui.kasMonth===TODAY.slice(0,7))) S.ui.kasMonth = (S.kas[TODAY.slice(0,7)]||[]).length ? TODAY.slice(0,7) : (all.filter(m=>(S.kas[m]||[]).length).pop() || TODAY.slice(0,7));
  return S.ui.kasMonth; }
function ensureKasAkun(){ const n=akunNames(); if(S.ui.kasAkun!=="*" && !n.includes(S.ui.kasAkun)) S.ui.kasAkun=n[0]; return S.ui.kasAkun; }
function yearMonthPicker(kind, m, years, months){
  return `<select id="${kind}Year" data-year="${kind}" aria-label="Tahun">${years.map(y=>`<option value="${y}"${y===m.slice(0,4)?" selected":""}>${y}</option>`).join("")}</select>
    <select id="${kind}Month" data-ui="kasMonth" aria-label="Bulan">${months.map(x=>`<option value="${x}"${x===m?" selected":""}>${BLNF[+x.slice(5)-1]}</option>`).join("")}</select>`;
}
function kasRowsSorted(m){ return (S.kas[m]||[]).map((r,i)=>({...r,_m:m,_i:i})).sort((a,b)=>(a.tgl||"").localeCompare(b.tgl||"")||a._i-b._i); }
function newKasForm(){ const a=S.ui.kasAkun&&S.ui.kasAkun!=="*"?S.ui.kasAkun:akunUtama(); return {tgl:TODAY, jenis:"keluar", kategori:"", akun:a, dari:akunUtama(), ke:akunTunai(), jumlah:"", ket:"", busy:false}; }
const upMonth = m => (BLNF[+m.slice(5)-1]+" "+m.slice(0,4)).toUpperCase();
const JENIS_OPT = d => `<option value="keluar"${d.jenis==="keluar"?" selected":""}>Debit (uang keluar)</option><option value="masuk"${d.jenis==="masuk"?" selected":""}>Kredit (uang masuk)</option><option value="pindah"${d.jenis==="pindah"?" selected":""}>Tarik / setor tunai (pindah dana)</option>`;
function kasFields(d, pre, attr){ /* field kategori/akun atau dari/ke sesuai jenis */
  const k=keu(); const names=akunNames();
  if(d.jenis==="pindah") return `<label class="f">Dari<select id="${pre}-dari" ${attr}="dari">${opts(names,d.dari)}</select></label>
      <label class="f">Ke<select id="${pre}-ke" ${attr}="ke">${opts(names,d.ke)}</select></label>`;
  const cats=k.kategoriMasuk;
  return `<label class="f">Kategori<select id="${pre}-kat" ${attr}="kategori">${d.jenis==="masuk"?opts([...new Set([...cats, d.kategori].filter(Boolean))],d.kategori,"Pilih kategori…"):katOptions(d.kategori)}</select></label>
      <label class="f">Akun<select id="${pre}-akun" ${attr}="akun">${opts(names,d.akun)}</select></label>`;

function barChart2(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||250, pl=52, pb=24, pt=12; const max=Math.max(1,...data.flatMap(d=>[d.a||0,d.b||0]));
  const step=niceStep(max/4); const top=Math.ceil(max*1.15/step)*step; const bw=(W-pl-8)/data.length; const ih=H-pt-pb;
  let g=""; for(let v=0; v<=top+1e-9; v+=step){ const y=pt+ih*(1-v/top); g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${esc(short(v))}</text>`; }
  let b=""; data.forEach((d,i)=>{ const x0=pl+i*bw+bw*.12, w=bw*.36;
    [[d.a,"var(--ok)","pemasukan",x0],[d.b,"var(--bad)","pengeluaran",x0+w+2]].forEach(([v,c,lab,x])=>{ v=v||0; const h=ih*(v/top); const y=H-pb-h;
      b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${esc(d.title||d.l)} ${lab}: ${rp(v)}</title></rect>`;
      b+=barLabel(v, x, w, y, h, H, pb); });
    b+=`<text x="${x0+w+1}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Grafik')}">${g}${b}</svg>`;
}
