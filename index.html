const CAM={};
function camClose(){ try{ CAM.stream&&CAM.stream.getTracks().forEach(t=>t.stop()); }catch(e){} if(CAM.watch!=null&&navigator.geolocation) navigator.geolocation.clearWatch(CAM.watch); const el=document.getElementById("absenCam"); el&&el.remove(); Object.keys(CAM).forEach(k=>delete CAM[k]); }
function camStatus(){
  const g=document.getElementById("cam-gps"), b=document.getElementById("cam-send"); if(!g) return;
  if(CAM.gpsErr) g.innerHTML=`<span class="neg">${esc(CAM.gpsErr)}</span>`;

      <div id="cam-err" class="note bad" hidden></div>
      <div id="cam-alt" class="row" style="justify-content:center;margin-top:8px" hidden><button class="btn" data-act="cam-retry">Coba lagi</button><label class="btn pri" for="cam-file">Pakai kamera HP</label><input type="file" id="cam-file" accept="image/*" capture="user" hidden></div>

    er=>{ CAM.gpsErr=er.code===1?"Izin lokasi ditolak. Izinkan lokasi untuk situs ini di pengaturan browser, lalu coba lagi.":"Lokasi belum didapat. Pastikan GPS menyala."; camStatus(); }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000}); }

async function camStart(){
  const el=document.getElementById("cam-err"), alt=document.getElementById("cam-alt"); if(el) el.hidden=true; if(alt) alt.hidden=true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw {name:"NoSupport"};

    catch(e1){ if(e1&&(e1.name==="NotAllowedError"||e1.name==="SecurityError")) throw e1; CAM.stream=await navigator.mediaDevices.getUserMedia({video:true, audio:false}); }
    const v=document.getElementById("cam-v"); if(v){ v.srcObject=CAM.stream; v.hidden=false; }
  }catch(e){
    const n=e&&e.name; const msg=n==="NotAllowedError"||n==="SecurityError"?"Izin kamera ditolak. Ketuk ikon di kiri alamat situs → Izin → Kamera → Izinkan, lalu ketuk Coba lagi. Atau pakai tombol Pakai kamera HP."
      : n==="NotReadableError"||n==="TrackStartError"?"Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/WhatsApp, lalu ketuk Coba lagi. Atau pakai tombol Pakai kamera HP."
      : n==="NotFoundError"||n==="DevicesNotFoundError"?"Kamera tidak ditemukan di perangkat ini. Pakai tombol Pakai kamera HP."
      : "Kamera di dalam browser tidak bisa dibuka. Pakai tombol Pakai kamera HP, atau ketuk Coba lagi.";
    if(el){ el.hidden=false; el.textContent=msg; } if(alt) alt.hidden=false; const sh=document.getElementById("cam-shot"); if(sh) sh.hidden=true;
  }
}
function camFromFile(f){
  if(!f) return; const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{ const w=360, h=Math.round(img.height*w/img.width); const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    CAM.foto=c.toDataURL("image/jpeg",0.6); CAM.dariFile=true; const pv=document.getElementById("cam-img"), v=document.getElementById("cam-v"); pv.src=CAM.foto; pv.hidden=false; if(v) v.hidden=true;
    const er=document.getElementById("cam-err"); if(er) er.hidden=true; camStatus(); };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast("Foto tidak bisa dibaca. Coba lagi."); }; img.src=url;
}
function camShot(){
  const v=document.getElementById("cam-v"); if(!v||!v.videoWidth){ toast("Kamera belum siap."); return; }
  const w=360, h=Math.round(v.videoHeight*w/v.videoWidth); const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
  x.translate(w,0); x.scale(-1,1); x.drawImage(v,0,0,w,h); CAM.foto=c.toDataURL("image/jpeg",0.6);
  const img=document.getElementById("cam-img"); img.src=CAM.foto; img.hidden=false; v.hidden=true;

}
function camRetake(){ CAM.foto=null; const v=document.getElementById("cam-v"), img=document.getElementById("cam-img"); v.hidden=false; img.hidden=true; document.getElementById("cam-shot").hidden=false; document.getElementById("cam-retake").hidden=true; camStatus(); }
async function camSend(){
  const p=myPekerja(); if(!p||!CAM.foto||!CAM.pos) return; if(CAM.pos.jarak>ABSEN.radius){ toast("Anda di luar area pabrik."); return; }
  CAM.busy=true; camStatus(); const tipe=CAM.tipe; const tgl=wib(new Date()).tgl; const id=logId(tgl,S.uid,tipe); const ref=fs.collection("absenLog").doc(id);
  try{
    await ref.set({uid:S.uid, pid:p.id, nama:p.nama, tgl, tipe, at:SERVER_TS(), lat:CAM.pos.lat, lng:CAM.pos.lng, acc:CAM.pos.acc, jarak:CAM.pos.jarak, foto:CAM.foto, ...(CAM.dariFile?{kameraHP:true}:{})});

function newRec(p, id, tipe, w, jarak, extra){

}
async function autoRecord(p, id, tipe, w, jarak){ // pegawai tetap: otomatis disetujui bila di lokasi
  const rec=newRec(p,id,tipe,w,jarak,{auto:true}); await mutate(w.tgl.slice(0,7), b=>{ if(!b.items.some(r=>r.id===id)) b.items.push(rec); }, "absen");
}

async function approveLogs(ids, ok){
  const L=ids.map(id=>S.absLog[id]).filter(Boolean); if(!L.length) return;
  const byM={};
  for(const l of L){ const p=(S.pekerja||[]).find(x=>x.id===l.pid); if(!p) continue; const w=wib(toDateAny(l.at)||new Date()); const rec=newRec(p, l.id, l.tipe, w, l.jarak, ok?{}:{status:"tolak"}); (byM[w.tgl.slice(0,7)]=byM[w.tgl.slice(0,7)]||[]).push({p,rec}); }
  try{
    for(const m in byM){
      await mutate(m, b=>{ for(const {rec} of byM[m]) if(!b.items.some(r=>r.id===rec.id)) b.items.push(rec); }, "absen");
      if(ok){ const add=byM[m].filter(({p,rec})=>!isTetap(p)&&rec.tipe==="masuk"); if(add.length) await mutate(m, b=>{ for(const {p,rec} of add) if(!b.pekerja.some(x=>x.pid===p.id&&x.tgl===rec.tgl)) b.pekerja.push(pekerjaDariAbsen(p, rec.tgl)); }); }
    }
    toast(ok?L.length+" absen disetujui.":"Absen ditolak.");
  }catch(e){ writeErr(e); }
}

function rekapTetap(dari, sampai){
  const ms=[...new Set(Object.keys(S.absen||{}))].filter(m=>m>=dari.slice(0,7)&&m<=sampai.slice(0,7));
  const recs=ms.flatMap(m=>absenRecs(m)).filter(r=>r.tgl>=dari&&r.tgl<=sampai&&r.status==="ok");
  return (S.pekerja||[]).filter(p=>isTetap(p)&&wajibAbsen(p)).map(p=>{ const mine=recs.filter(r=>r.pid===p.id); const tgls=[...new Set(mine.map(r=>r.tgl))].sort(); const tj=tarifJamOf(p.id);
    const hari=tgls.map(t=>{ const m=mine.find(r=>r.tgl===t&&r.tipe==="masuk"), pl=mine.find(r=>r.tgl===t&&r.tipe==="pulang"); const tl=m&&!m.izin?(m.telat||0):0; const lb=pl&&pl.lemburStatus==="ok"?(pl.lembur||0):0;
      return {tgl:t, m, pl, telat:tl, pot:tl*tj/60, lembur:lb, nLembur:bolehLembur(p)?lb*tj/60:0}; });
    const sum=k=>hari.reduce((a,h)=>a+h[k],0);
    return {p, tj, hari, hadir:hari.filter(h=>h.m).length, telat:sum("telat"), pot:sum("pot"), lembur:sum("lembur"), nLembur:sum("nLembur")}; });
}

async function saveAbsenEdit(){
  const M=S.modal, d=M.d; if(!/^\d{1,2}:\d{2}$/.test(d.jam||"")){ toast("Isi jam dengan benar."); return; }
  const ket=String(d.ket||"").trim(); const now=new Date().toISOString(); const m=M.tgl.slice(0,7);
  M.busy=true; renderModal();
  try{
    if(M.isNew){ if(!ket){ M.busy=false; renderModal(); toast("Isi keterangan, mis. lupa absen atau HP rusak."); return; }
      const p=M.p; const rec=newRec(p, "man_"+rid(), "masuk", {tgl:M.tgl, jam:d.jam}, null, {manual:true, izin:!!d.izin, ket, hist:[{by:S.uid, at:now, ket:"Dicatat manual: "+d.jam+(d.izin?", izin":"")+" · "+ket}]});
      await mutate(m, b=>{ if(!b.items.some(r=>r.pid===p.id&&r.tgl===M.tgl&&r.tipe==="masuk")) b.items.push(rec); }, "absen");
      if(!isTetap(p)) await mutate(m, b=>{ if(!b.pekerja.some(x=>x.pid===p.id&&x.tgl===M.tgl)) b.pekerja.push(pekerjaDariAbsen(p, M.tgl)); });
    } else {
      const r=M.rec; const lb=Math.max(0, Math.round(num(d.lembur)||0));
      const ch=[]; if(d.jam!==r.jam) ch.push("jam "+r.jam+" → "+d.jam); if(M.tipe==="masuk"&&!!d.izin!==!!r.izin) ch.push(d.izin?"izin, tidak dipotong":"izin dibatalkan"); if(M.tipe==="pulang"&&(r.lemburStatus!=="ok"||lb!==(r.lembur||0))) ch.push("lembur "+mntTxt(lb)); if(ket!==(r.ket||"")) ch.push("keterangan"); if(!!d.simpanFoto!==!!r.simpanFoto) ch.push(d.simpanFoto?"foto disimpan":"foto tidak disimpan");
      if(!ch.length){ S.modal=null; renderModal(); return; }
      await mutate(m, b=>{ b.items=b.items.map(x=>{ if(x.id!==r.id) return x; const y={...x, jam:d.jam, ket, simpanFoto:!!d.simpanFoto, hist:[...(x.hist||[]), {by:S.uid, at:now, ket:ch.join(", ")+(ket?" · "+ket:"")}]};

    }
    S.modal=null; renderModal(); toast("Absen disimpan.");
  }catch(e){ M.busy=false; renderModal(); writeErr(e); }
}

/* ---- riwayat absen pekerja harian (60 hari), disalin ke absenSaya/{uid} oleh perangkat Admin/Akses penuh ---- */
const RIWAYAT_HARI = 60;
let syncTimer=null;
function syncAbsenSaya(){
  if(!fs || !(role()==="admin"||role()==="penuh") || !can("viewKeu") || !S.ready.pekerja || !S.ready.trx || !S.absen || !S.gaji) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(async ()=>{
    const dari=addDays(TODAY,-RIWAYAT_HARI+1); S.asCache=S.asCache||{};
    for(const p of (S.pekerja||[]).filter(p=>p.uid && !isTetap(p) && p.aktif!==false)){
      const R=rekapOrang(dari, TODAY, p.id)[0]; const hm=Object.fromEntries(((R&&R.hari)||[]).map(h=>[h.tgl,h]));
      const tgls=new Set(Object.keys(hm)); for(const m of Object.keys(S.absen)) for(const r of absenRecs(m)) if(r.pid===p.id&&r.tipe==="masuk"&&r.tgl>=dari) tgls.add(r.tgl);
      const items=[...tgls].sort().reverse().map(t=>{ const r=recOf(p.id,t,"masuk"), h=hm[t];
        return {tgl:t, jam:r?r.jam:"", telat:r&&!r.izin?(r.telat||0):0, izin:!!(r&&r.izin&&r.telat), status:r?r.status:(h?"ok":""), manual:!!(r&&r.manual), ket:r&&r.ket||"",
          shift:h?h.nS:0, liter:h?Math.round(h.liter*100)/100:0, upahShift:h?Math.round(h.upahShift):0, upahLt:h?Math.round(h.upahLt):0, pot:h?Math.round(h.pot):0, total:h?Math.round(h.total):0}; });
      const key=JSON.stringify(items); if(S.asCache[p.uid]===key) continue;
      try{ await fs.collection("absenSaya").doc(p.uid).set({nama:p.nama, items, at:new Date().toISOString()}); S.asCache[p.uid]=key; }catch(e){}
    }
  }, 4000);
}

function riwayatSaya(){

  const it=(D.items||[]); if(!it.length) return `<section class="panel"><div class="ph"><h2>Riwayat absen saya</h2></div><div class="empty">Belum ada riwayat. Riwayat muncul setelah absen disetujui manajer.</div></section>`;

  const st=x=>x.status==="tolak"?pill("bad","Ditolak"):x.manual?pill("ok","Dicatat manual"):x.status==="ok"?pill("ok","Disetujui"):pill("warn","Menunggu");
  return `<section class="panel riwayat-saya"><div class="ph"><div><h2>Riwayat absen saya</h2><div class="hint">${RIWAYAT_HARI} hari terakhir · upah per hari sebelum dibayar</div></div></div>
  ${Object.entries(wk).map(([k,xs])=>{ const tot=xs.reduce((a,x)=>a+(x.status==="tolak"?0:x.total),0);

/* =================== Firebase data layer =================== */
let fb=null, auth=null, fs=null;
async function mutate(key, fn, col){
  col = col || "trx";
  const ref = fs.collection(col).doc(key);
  await fs.runTransaction(async tx => {
    const s = await tx.get(ref);
    const body = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};
    if(col==="trx"){ for(const t of ["pembelian","produksi","keluar","pekerja","tambahan"]) body[t]=body[t]||[]; } else body.items=body.items||[];
    fn(body);
    const empty = col==="trx" ? (!body.pembelian.length && !body.produksi.length && !body.keluar.length && !body.pekerja.length && !body.tambahan.length) : (!body.items.length && body.saldoAwal==null && !(body.catatan||[]).length && !Object.values(body.saldoAwalAkun||{}).some(v=>v!=null));
    if(empty){ if(s.exists) tx.delete(ref); } else tx.set(ref, body);
  });
}

const KEU_DEFAULT = {

const akunNames = () => keu().akun.map(a=>a.nama);

function kasSum(rows){ let masuk=0, keluar=0, nm=0, nk=0; for(const r of rows){ if(r.jenis==="pindah") continue; if(r.jenis==="masuk"){ masuk+=+r.jumlah||0; nm++; } else { keluar+=+r.jumlah||0; nk++; } } return {masuk,keluar,net:masuk-keluar,nm,nk}; }
/* arah transaksi untuk satu akun: +1 masuk, -1 keluar, 0 tidak menyentuh akun ini */
function arah(r, a){ if(r.jenis==="pindah") return r.ke===a ? 1 : r.dari===a ? -1 : 0; if(akunOf(r)!==a) return 0; return r.jenis==="masuk" ? 1 : -1; }
function kasSumAkun(rows, a){ let masuk=0, keluar=0, nm=0, nk=0; for(const r of rows){ const s=arah(r,a); if(s>0){ masuk+=+r.jumlah||0; nm++; } else if(s<0){ keluar+=+r.jumlah||0; nk++; } } return {masuk,keluar,net:masuk-keluar,nm,nk}; }
function nextMonth(m){ let y=+m.slice(0,4), b=+m.slice(5)+1; if(b>12){ b=1; y++; } return y+"-"+pad(b); }
function anchorOf(m, a){ const meta=(S.kasMeta||{})[m]||{}; const v=meta.saldoAwalAkun&&meta.saldoAwalAkun[a];
  if(typeof v==="number") return v; if(meta.saldoAwalAkun && a in meta.saldoAwalAkun) return null;
  if(a===akunUtama() && typeof meta.saldoAwal==="number") return meta.saldoAwal; return null; }
/* Saldo per bulan per akun: saldo awal = angka yang diisi untuk bulan itu, atau saldo akhir bulan sebelumnya. */
let _led=null;
function ledgerAll(){
  const key=S.kasVer||0; if(_led && _led.key===key && _led.today===TODAY) return _led;
  const ms=Object.keys(S.kas).concat(Object.keys(S.kasMeta||{})).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  const akun=keu().akun; const per={}; const tot={};
  for(const ak of akun){ const d={}; per[ak.nama]=d; if(!ms.length) continue; const last=[ms[ms.length-1], TODAY.slice(0,7)].sort()[1]; let prev=null;
    for(let m=ms[0]; m<=last; m=nextMonth(m)){ const s=kasSumAkun(S.kas[m]||[], ak.nama); const an=anchorOf(m, ak.nama); const anchored=an!=null;
      const awal=anchored?an:(prev==null?(+ak.saldoAwal||0):prev); const akhir=awal+s.net; d[m]={m, awal, akhir, ...s, anchored, selisih: anchored&&prev!=null ? awal-prev : 0, prev}; prev=akhir; } }
  for(const m of Object.keys(per[akun[0].nama]||{})){ const s=kasSum(S.kas[m]||[]); const rows=akun.map(a=>per[a.nama][m]);
    const awal=rows.reduce((x,r)=>x+r.awal,0), akhir=rows.reduce((x,r)=>x+r.akhir,0);
    tot[m]={m, awal, akhir, ...s, anchored:rows.some(r=>r.anchored), selisih:rows.reduce((x,r)=>x+r.selisih,0), prev:rows.every(r=>r.prev!=null)?rows.reduce((x,r)=>x+r.prev,0):null, perAkun:Object.fromEntries(akun.map(a=>[a.nama,per[a.nama][m]]))}; }
  _led={key, today:TODAY, per, tot}; return _led;
}
function ledger(a){ const L=ledgerAll(); return !a||a==="*" ? L.tot : (L.per[a]||{}); }
function ledOf(m, a){ const L=ledger(a); if(L[m]) return L[m]; const ms=Object.keys(L).sort();
  const base = !a||a==="*" ? keu().akun.reduce((x,k)=>x+(+k.saldoAwal||0),0) : +((keu().akun.find(k=>k.nama===a)||{}).saldoAwal||0);
  const before=ms.filter(x=>x<m).pop(); const awal=before?L[before].akhir:base; return {m, awal, akhir:awal, masuk:0, keluar:0, net:0, nm:0, nk:0, anchored:false, selisih:0}; }
function saldoKini(a){ return ledOf(TODAY.slice(0,7), a).akhir; }
function saldoRincian(){ const ak=keu().akun; if(ak.length<2) return ""; return ak.map(a=>esc(a.nama.replace(/^Rekening /,""))+" "+rp(saldoKini(a.nama))).join(" · ")+"<br>"; }

V.kas = () => {
  if(!S.ready.kas) return `<div class="head"><div><h1>Buku kas</h1></div></div>`+loadingBox();
  const m=ensureKasMonth(); const A=ensureKasAkun(); const Lm=ledOf(m, A); const k=keu(); const edit=can("editKeu");

function kasRecord(d){

/* grafik dua batang (masuk/keluar) dengan angka di dalam batang */
function barChart2(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||250, pl=52, pb=24, pt=12; const max=Math.max(1,...data.flatMap(d=>[d.a||0,d.b||0]));
  const step=niceStep(max/4); const top=Math.ceil(max*1.15/step)*step; const bw=(W-pl-8)/data.length; const ih=H-pt-pb;
  let g=""; for(let v=0; v<=top+1e-9; v+=step){ const y=pt+ih*(1-v/top); g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${esc(short(v))}</text>`; }
  let b=""; data.forEach((d,i)=>{ const x0=pl+i*bw+bw*.12, w=bw*.36;
    [[d.a,"var(--ok)","pemasukan",x0],[d.b,"var(--bad)","pengeluaran",x0+w+2]].forEach(([v,c,lab,x])=>{ v=v||0; const h=ih*(v/top); const y=H-pb-h;
      b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${esc(d.title||d.l)} ${lab}: ${rp(v)}</title></rect>`;
      b+=barLabel(v, x, w, y, h, H, pb); });
    b+=`<text x="${x0+w+1}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Grafik')}">${g}${b}</svg>`;
}
function lrData(m){
  const k=keu(); const L=ledOf(m); const rows=S.kas[m]||[];
  const group=(j,list)=>{ const o={}; list.forEach(c=>o[c]={nama:c,jumlah:0,items:[]}); rows.filter(r=>r.jenis===j).forEach(r=>{ const c=r.kategori||"Tanpa kategori"; (o[c]=o[c]||{nama:c,jumlah:0,items:[]}); o[c].jumlah+=+r.jumlah||0; o[c].items.push(r); }); return Object.values(o); };
  const masuk=group("masuk",k.kategoriMasuk), keluar=group("keluar",k.kategoriKeluar);
  const catatan=(((S.kasMeta||{})[m]||{}).catatan)||[];
  const tc=catatan.reduce((a,c)=>a+(+c.jumlah||0),0);
  const grp = pakaiKelompok(m) ? KELOMPOK.map(g=>{ const kat=keluar.filter(c=>kelOf(c.nama)===g); return {nama:g, kat, jumlah:kat.reduce((a,c)=>a+c.jumlah,0)}; }) : null;
  return {m, L, masuk, keluar, grp, tm:L.masuk, tk:L.keluar, catatan, tc, total:L.akhir+tc};
}

async function doImport(){
  const f=$("#importFile") && $("#importFile").files[0]; if(!f){ toast("Pilih file data-awal.json dulu."); return; }
  let d; try{ d=JSON.parse(await f.text()); }catch(e){ toast("File tidak bisa dibaca. Pastikan memilih file .json dari Claude."); return; }
  if(d && ((d.trx && Object.keys(S.trx).length) || (d.kas && Object.keys(S.kas).some(m=>(S.kas[m]||[]).length))) && !S.importArmed){ S.importArmed=true; render(); return; }
  S.importArmed=false;
  if(!d || !(d.master || d.trx || d.masterSet || d.masterMerge || d.ops || d.kas || d.keuangan)){ toast("Isi file tidak sesuai format data aplikasi."); return; }
  try{
    const batch=fs.batch(); let n=0;
    for(const k in (d.master||{})){ batch.set(fs.collection("master").doc(k), d.master[k]); n++; }
    for(const k in (d.masterSet||{})){ batch.set(fs.collection("master").doc(k), d.masterSet[k]); n++; }
    for(const k in (d.masterMerge||{})){ batch.set(fs.collection("master").doc(k), d.masterMerge[k], {merge:true}); n++; }
    for(const k in (d.shared||{})){ batch.set(fs.collection("shared").doc(k), d.shared[k]); n++; }
    for(const k in (d.trx||{})){ batch.set(fs.collection("trx").doc(k), d.trx[k]); n++; }
    for(const k in (d.kas||{})){ batch.set(fs.collection("kas").doc(k), d.kas[k]); n++; }
    for(const k in (d.keuangan||{})){ batch.set(fs.collection("keuangan").doc(k), d.keuangan[k]); n++; }
    await batch.commit();
    // operasi tambahan yang tidak menimpa data: tambah bahan, produk, dan resep bila belum ada
    if(d.ops && d.ops.length){
      let bahan=[...(S.bahanLama||[])], produk=[...S.produk], bom={...(S.bomLama||{})}, ch={bahan:0,produk:0,bom:0};
      for(const o of d.ops){
        if(o.op==="addBahan" && !bahan.some(b=>b.nama===o.nama)){ bahan.push({nama:o.nama,min:0}); ch.bahan++; }
        if(o.op==="addProduk" && !produk.some(p=>p.nama===o.item.nama)){ produk.push(o.item); ch.produk++; }
        if(o.op==="setBom" && !(bom[o.produk]&&bom[o.produk].length)){ bom[o.produk]=o.items; ch.bom++; }
      }
      if(ch.bahan) await saveMaster("bahan",{items:bahan.sort((x,y)=>x.nama.localeCompare(y.nama,"id"))});
      if(ch.produk) await saveMaster("produk",{items:produk});
      if(ch.bom) await saveMaster("bom",{items:bom});
      n+=ch.bahan+ch.produk+ch.bom;
    }
    toast("Impor selesai: "+n+" perubahan."); render();
  }catch(e){ writeErr(e); }
}

    <form id="authForm" autocomplete="on">
      ${m==="daftar"?`<label class="f">Nama lengkap<input type="text" id="a-nama" data-af="nama" value="${esc(F.nama)}" autocomplete="name" required></label>`:""}
      <label class="f">Email<input type="email" id="a-email" data-af="email" value="${esc(F.email)}" autocomplete="email" required></label>
      ${m!=="reset"?`<label class="f">Password<input type="password" id="a-pass" data-af="pass" value="${esc(F.pass)}" autocomplete="${m==="daftar"?"new-password":"current-password"}" minlength="6" required></label>`:""}
      ${S.authErr?`<div class="err" role="alert">${esc(S.authErr)}</div>`:""}${S.authInfo?`<div class="note info">${esc(S.authInfo)}</div>`:""}
      <button class="btn pri" type="submit" ${S.authBusy?"disabled":""} style="justify-content:center">${S.authBusy?"Memproses…":m==="masuk"?"Masuk":m==="daftar"?"Daftar":"Kirim link reset"}</button>
    </form>
    <div class="row hint">${m==="masuk"?`<a href="#" data-act="authMode" data-v="reset">Lupa password?</a>`:m==="reset"?`<a href="#" data-act="authMode" data-v="masuk">Kembali ke halaman masuk</a>`:`<span>Setelah daftar, admin perlu menyetujui akun Anda.</span>`}</div>
  </div></div>`;
}
function authMsg(e){
  const c=e&&e.code||"";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c)) return "Email atau password salah.";
  if(c==="auth/email-already-in-use") return "Email ini sudah terdaftar. Silakan masuk.";
  if(c==="auth/weak-password") return "Password minimal 6 karakter.";
  if(c==="auth/invalid-email") return "Format email tidak valid.";
  if(c==="auth/too-many-requests") return "Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.";
  if(c==="auth/operation-not-allowed") return "Login email/password belum diaktifkan di Firebase (Authentication → Sign-in method).";
  if(c==="auth/unauthorized-domain") return "Alamat situs ini belum diizinkan di Firebase (Authentication → Settings → Authorized domains).";
  if(c==="auth/network-request-failed") return "Tidak ada koneksi internet.";
  return (e&&e.message)||"Terjadi kesalahan.";
}
async function doAuth(){
  const m=S.authMode, F=S.af; S.authErr=""; S.authInfo="";
  const email=String(F.email).trim();
  if(!email){ S.authErr="Isi email."; render(); return; }
  S.authBusy=true; render();
  try{
    if(m==="masuk") await auth.signInWithEmailAndPassword(email, F.pass);
    else if(m==="daftar"){ if(!String(F.nama).trim()){ throw {message:"Isi nama lengkap."}; } S.pendingNama=String(F.nama).trim(); await auth.createUserWithEmailAndPassword(email, F.pass); }
    else { await auth.sendPasswordResetEmail(email); S.authInfo="Link untuk mengatur ulang password sudah dikirim ke "+email+". Cek juga folder spam."; }
    F.pass="";
  }catch(e){ S.authErr=authMsg(e); }
  S.authBusy=false; render();
}
function pendingScreen(){
  const r=role();
  return `<div class="authwrap"><div class="authcard">
    <div class="brand"><b>${esc(NAMA_USAHA)} Super App</b><span>${esc(S.profile.email||"")}</span></div>
    ${r==="nonaktif"?`<h2>Akun dinonaktifkan</h2><p class="sub">Hubungi admin bila ini keliru.</p>`
      :`<h2>Menunggu persetujuan admin</h2><p class="sub">Akun Anda sudah terdaftar. Halaman ini akan terbuka sendiri begitu admin memilihkan peran untuk Anda.</p>`}
    <button class="btn" data-act="logout">Keluar</button></div></div>`;
}
function setupScreen(){
  return `<div class="main" style="max-width:none"><div class="setup">
    <div class="eyebrow">Pemasangan</div><h1>Aplikasi belum tersambung ke Firebase</h1>

    <p class="hint">Ikuti panduan pemasangan yang menyertai file ini.</p></div></div>`;
}

/* =================== render =================== */
function shell(){
  if($("#main")) return;
  $("#root").innerHTML=`<div class="app"><aside class="rail"><div class="brand"><b>${esc(NAMA_USAHA)} Super App</b><span>Gudang · Tugas · Keuangan</span></div><nav class="nav" id="nav"></nav>
    <div class="foot"><div class="me" id="me"></div></div></aside><main class="main" id="main"></main></div>`;
}
function allowed(v){
  if(v==="catat") return can("editGudang");
  if(v==="kas"||v==="keuangan") return can("viewKeu");
  if(v==="pengguna") return role()==="admin";
  if(v==="absen") return can("absenView");
  return true;
}
function renderNav(){
  const minus=S.calc&&gudangReady()?S.calc.bahan.filter(b=>b.st==="bad").length:0;
  const myLate=S.tugas.filter(t=>t.untuk===S.uid && isLate(t)).length; const un=unreadAnn();
  const pend=role()==="admin"?Object.values(S.users).filter(u=>u.role==="menunggu").length:0;
  let abPend=0; if(can("absenView") && S.ready.pekerja && isManajer()){ ensureLogs(TODAY); abPend=absenOrang().filter(p=>p.uid&&S.absLog&&S.absLog[logId(TODAY,p.uid,"masuk")]&&!recOf(p.id,TODAY,"masuk")).length; }
  const badge={absen:abPend, bahan:minus, tugas:myLate+(S.view==="tugas"?0:doneNew().length+taskNew().length), pengumuman:un, pengguna:pend};
  $("#nav").innerHTML=NAV.filter(g=>!g.need||(g.need==="admin"?role()==="admin":can(g.need))).map(g=>`<div class="navg"><div class="gl">${esc(g.g)}</div>${g.items.filter(it=>!it[2]||can(it[2])).map(([k,l])=>`<a href="#${k}" class="${S.view===k?"on":""}">${l}${badge[k]?`<span class="badge">${badge[k]}</span>`:""}</a>`).join("")}</div>`).join("");
  const p=S.profile||{}; $("#me").innerHTML=`<b>${esc(p.nama||"")}</b><span>${esc(ROLES[p.role]||"")}</span><a href="#" data-act="logout">Keluar</a>`;
}
function render(){
  const root=$("#root");
  if(!fb){ root.innerHTML=setupScreen(); return; }
  if(!S.authReady){ root.innerHTML=loadingBox("Menyiapkan…"); return; }
  if(!S.auth){ const ae=document.activeElement, aid=ae&&ae.id; root.innerHTML=authScreen(); if(aid){ const el=document.getElementById(aid); el&&el.focus(); } return; }
  if(!S.profile){ root.innerHTML=S.authErr?`<div class="authwrap"><div class="authcard"><div class="err">${esc(S.authErr)}</div><button class="btn" data-act="logout">Keluar</button></div></div>`:loadingBox("Membuka profil…"); return; }
  if(role()==="absen"){ root.innerHTML=absenOnlyScreen(); return; }
  if(!ACTIVE.includes(role())){ root.innerHTML=pendingScreen(); return; }
  shell(); renderNav();
  const main=$("#main");
  const ae=document.activeElement, aid=ae&&ae.id&&main.contains(ae)?ae.id:null; let ss=null; try{ ss=ae.selectionStart; }catch(e){}
  const sy=window.scrollY;
  let html;
  if(GUDANG_VIEWS.includes(S.view) && !gudangReady()) html=loadingBox("Memuat data gudang…");
  else html=(V[S.view]||V.beranda)();
  main.innerHTML=html;
  if(SNAP_VIEWS[S.view]){ const hd=main.querySelector(".head"); if(hd) hd.insertAdjacentHTML("beforeend", snapButton()); }
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,ss); }catch(e){} } }
  window.scrollTo(0,sy);
}
function renderModal(){
  const root=$("#modal"); const M=S.modal;
  if(!M){ root.innerHTML=""; return; }
  root.innerHTML = M.kind==="edit"?editModal(): M.kind==="bahan"?bahanModal(): M.kind==="prod"?prodModal(): M.kind==="tugas"?tugasModal(): M.kind==="ann"?annModal(): M.kind==="kas"?kasModal(): M.kind==="saldo"?saldoModal(): M.kind==="bahanEdit"?bahanEditModal(): M.kind==="pekerja"?pekerjaModal(): M.kind==="pkEdit"?pkEditModal(): M.kind==="bayar"?bayarModal(): M.kind==="absenEdit"?absenEditModal(): M.kind==="absenFoto"?absenFotoModal():"";
}
function live(){
  const map={"live-bahan":bahanTable,"live-produk":produkTable,"live-catat":catatPreview,"live-rw":rwTable,"live-rencana":rencanaResult};
  for(const id in map){ const el=document.getElementById(id); if(el) el.innerHTML=map[id](); }
  if(S.view==="catat" && S.form) S.form.lines.forEach((l,i)=>{ const el=document.getElementById("l-dus-"+i); if(el) el.textContent=dusHint(l); });
  const kp=document.getElementById("k-prev"); if(kp && S.kasForm) kp.textContent=num(S.kasForm.jumlah)>0?rp(num(S.kasForm.jumlah)):"";
}
function route(){
  const h=location.hash.slice(1);
  const all=NAV.flatMap(g=>g.items.map(i=>i[0]));
  S.view = all.includes(h) && allowed(h) ? h : "beranda";
  S.modal=null; renderModal(); render(); window.scrollTo(0,0);
  if(S.view==="pengumuman") markAnnSeen();
  if(S.view==="tugas"){ S.doneSeenPrev=null; S.taskSeenPrev=null; markDoneSeen(); markTaskSeen(); } else { S.doneSeenPrev=null; S.taskSeenPrev=null; }
}

/* =================== new events =================== */
document.addEventListener("click", async e=>{
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act, v=a.dataset.v;
  switch(act){
    case "logout": e.preventDefault(); stopSubs(); S.authMode="masuk"; S.authErr=""; S.authInfo=""; S.af={email:"",pass:"",nama:""}; S.kasForm=null; S.keuEdit=null; S.modal=null; renderModal(); location.hash=""; await auth.signOut(); break;
    case "authMode": e.preventDefault(); S.authMode=v; S.authErr=""; S.authInfo=""; render(); break;
    case "tugasF": S.ui.tugasF=v; render(); break;
    case "dl-tugas": download("Riwayat Tugas "+(S.ui.thM?fmonth(S.ui.thM):S.ui.thY)+".csv", tugasCsv()); break;
    case "t-new": S.modal={kind:"tugas", isNew:true, d:{judul:"",catatan:"",untuk:"",tenggat:"",prioritas:"biasa",status:"belum"}}; renderModal(); { const el=$("#x-judul"); el&&el.focus(); } break;
    case "t-open": { const t=S.tugas.find(x=>x.id===v); if(!t) return; S.modal={kind:"tugas", isNew:false, id:t.id, orig:t.status, d:{...t}}; renderModal(); break; }
    case "t-move": { e.stopPropagation(); const t=S.tugas.find(x=>x.id===v); if(!t) return; const now=new Date().toISOString(); const upd={status:a.dataset.s, updatedAt:now, updatedBy:S.uid}; if(a.dataset.s==="selesai"){ upd.selesaiAt=now; upd.selesaiBy=S.uid; }
      try{ await fs.collection("tugas").doc(v).update(upd); toast(a.dataset.s==="selesai"?"Tugas selesai.":"Status diperbarui."); }catch(err){ writeErr(err); } break; }
    case "t-save": saveTugas(); break;
    case "t-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } try{ await fs.collection("tugas").doc(M.id).delete(); S.modal=null; renderModal(); toast("Tugas dihapus."); }catch(err){ writeErr(err); } break; }
    case "a-edit": { const x=S.pengumuman.find(p=>p.id===v); if(!x) return; S.modal={kind:"ann", id:x.id, d:{...x}}; renderModal(); break; }
    case "a-save": { const M=S.modal; if(!String(M.d.judul).trim()||!String(M.d.isi).trim()){ toast("Judul dan isi wajib diisi."); return; } M.busy=true; renderModal();
      try{ await fs.collection("pengumuman").doc(M.id).update({judul:String(M.d.judul).trim(), isi:String(M.d.isi).trim(), penting:!!M.d.penting, updatedAt:new Date().toISOString()}); S.modal=null; renderModal(); toast("Pengumuman disimpan."); }catch(err){ M.busy=false; renderModal(); writeErr(err); } break; }
    case "a-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } try{ await fs.collection("pengumuman").doc(M.id).delete(); S.modal=null; renderModal(); toast("Pengumuman dihapus."); }catch(err){ writeErr(err); } break; }
    case "kasJenis": S.ui.kasJenis=v; render(); break;
    case "k-edit": { const r=(S.kas[a.dataset.m]||[]).find(x=>x.id===a.dataset.id); if(!r) return; S.modal={kind:"kas", m:a.dataset.m, id:r.id, d:{dari:akunUtama(), ke:akunTunai(), ...r, akun:akunOf(r), jumlah:dec(r.jumlah)}}; renderModal(); break; }
    case "k-save": saveKasEdit(); break;
    case "k-del": { const M=S.modal; if(!M.armed){ M.armed=true; renderModal(); return; } M.busy=true; renderModal();
      try{ await mutate(M.m, b=>{ b.items=b.items.filter(x=>x.id!==M.id); }, "kas"); S.modal=null; renderModal(); toast("Transaksi dihapus."); }catch(err){ M.busy=false; renderModal(); writeErr(err); } break; }
    case "keuTab": S.ui.keuTab=v; S.keuEdit=null; render(); break;
    case "ka-add": S.keuEdit.akun.push({nama:"",saldoAwal:"0"}); S.keuEdit.dirty=true; render(); break;
    case "ka-del": S.keuEdit.akun.splice(+v,1); S.keuEdit.dirty=true; render(); break;
    case "keu-save": saveKeuSetting(); break;
    case "dl-kas": { const m=ensureKasMonth(); const A=ensureKasAkun(); const L=ledOf(m,A); let run=L.awal;
      const sg=r=>A==="*"?(r.jenis==="pindah"?0:r.jenis==="masuk"?1:-1):arah(r,A);
      download("Laporan Keuangan PTCN "+(A==="*"?"":A+" ")+fmonth(m)+".csv", [["TANGGAL","KETERANGAN","KATEGORI","Kredit","Debit","SALDO"],[m+"-01","SALDO AWAL","","","",L.awal],
        ...kasRowsSorted(m).filter(r=>sg(r)!==0).map(r=>{ const g=sg(r); run+=g*(+r.jumlah||0); return [r.tgl,r.ket,r.jenis==="pindah"?pindahLabel(r.dari,r.ke):r.kategori,g>0?+r.jumlah:"",g<0?+r.jumlah:"",run]; }),
        ["","TOTAL","",L.masuk,L.keluar,L.akhir],[],["SALDO AWAL","","",L.awal],["MUTASI CR",L.nm,"",L.masuk],["MUTASI DB",L.nk,"",L.keluar],["SALDO AKHIR","","",L.akhir]]); break; }
    case "dl-keu": download("Rekap Keuangan "+S.ui.keuYear+".csv", rekapCsv(S.ui.keuYear)); break;
    case "dl-lr": download("Laba Rugi "+fmonth(ensureKasMonth())+".csv", lrRows(ensureKasMonth())); break;
    case "copy-lr": copyRows(lrRows(ensureKasMonth())); break;
    case "lr-go": e.preventDefault(); S.ui.kasMonth=v; S.ui.keuTab="lr"; S.ui.lrOpen=""; if(location.hash!=="#keuangan") location.hash="keuangan"; else render(); window.scrollTo(0,0); break;
    case "lr-open": S.ui.lrOpen = S.ui.lrOpen===v ? "" : v; render(); break;
    case "saldo-edit": { const m=ensureKasMonth(); const A=ensureKasAkun(); const an=anchorOf(m,A); S.modal={kind:"saldo", m, akun:A, d:{saldo:an!=null?fmt(an):""}}; renderModal(); break; }
    case "kasAkun": S.ui.kasAkun=v; S.kasForm=null; render(); break;
    case "kas-now": S.ui.kasMonth=TODAY.slice(0,7); break;
    case "lap-now": S.ui.lapMonth=TODAY.slice(0,7); break;
    case "bahan-go": S.ui.bahanQ=v; S.ui.bahanF="semua"; break;
    case "saldo-save": saveSaldo(); break;
    case "ct-add": S.catEdit.rows.push({nama:"",jumlah:""}); S.catEdit.dirty=true; render(); break;
    case "ct-del": S.catEdit.rows.splice(+v,1); S.catEdit.dirty=true; render(); break;
    case "cat-save": saveCatatan(); break;
    case "import": doImport(); break;
  }
});
document.addEventListener("input", e=>{
  const t=e.target, ds=t.dataset;
  if(ds.af!=null){ S.af[ds.af]=t.value; return; }
  if(ds.x!=null && S.modal){ S.modal.d[ds.x]= t.type==="checkbox" ? t.checked : t.value; S.modal.armed=false; if(ds.rerender){ S.modal.d.kategori=""; renderModal(); } return; }
  if(ds.kf!=null && S.kasForm){ S.kasForm[ds.kf]=t.value; if(ds.kf==="jenis"){ S.kasForm.kategori=""; render(); } else if(ds.kf==="dari"||ds.kf==="ke") render(); else live(); return; }
  if(ds.an!=null){ S.annForm[ds.an]= t.type==="checkbox" ? t.checked : t.value; return; }
  if(ds.ke!=null && S.keuEdit){ S.keuEdit[ds.ke]=t.value; S.keuEdit.dirty=true; return; }
  if(ds.kel!=null && S.keuEdit){ S.keuEdit.kel[ds.kel]=t.value; S.keuEdit.dirty=true; return; }
  if(ds.ka!=null && S.keuEdit){ S.keuEdit.akun[+ds.ka][ds.k]=t.value; S.keuEdit.dirty=true; return; }
  if(ds.th){ S.ui[ds.th]=t.value; if(ds.th==="thY") S.ui.thM=""; render(); return; }
  if(ds.ct!=null && S.catEdit){ S.catEdit.rows[+ds.ct][ds.k]=t.value; S.catEdit.dirty=true; return; }
  if(ds.year){ const y=t.value; pickYear(ds.year, y); render(); return; }
  if(ds.ui && ["kasMonth","keuYear","keuPeriod","tugasDone"].includes(ds.ui)){ /* handled by generic ui handler -> render */ }
});
document.addEventListener("change", async e=>{
  const t=e.target; if(t.dataset.actChange!=="role") return;
  const uid=t.dataset.v, r=t.value;
  try{ await fs.collection("users").doc(uid).update({role:r, roleBy:S.uid, roleAt:new Date().toISOString()}); toast("Peran "+(S.users[uid]?.nama||"")+" diubah menjadi "+ROLES[r]+"."); }catch(err){ writeErr(err); render(); }
});
document.addEventListener("submit", e=>{
  if(e.target.id==="authForm"){ e.preventDefault(); doAuth(); }
  if(e.target.id==="kasForm"){ e.preventDefault(); submitKas(); }
  if(e.target.id==="annForm"){ e.preventDefault(); (async()=>{ const F=S.annForm; if(!F.judul.trim()||!F.isi.trim()){ toast("Judul dan isi wajib diisi."); return; } F.busy=true; render();
    try{ await fs.collection("pengumuman").doc().set({judul:F.judul.trim(), isi:F.isi.trim(), penting:!!F.penting, createdBy:S.uid, createdAt:new Date().toISOString()}); S.annForm={judul:"",isi:"",penting:false}; toast("Pengumuman terkirim ke semua staf."); }
    catch(err){ F.busy=false; writeErr(err); } render(); })(); }
});
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches(".task[data-act]")){ e.preventDefault(); e.target.click(); } });
window.addEventListener("hashchange", route);

/* =================== boot =================== */
(function boot(){
  const configured = typeof firebase!=="undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/TEMPEL/.test(FIREBASE_CONFIG.apiKey);
  if(!configured){ render(); return; }
  fb=firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); fs=firebase.firestore();
  const h=location.hash.slice(1); S.view = h || "beranda";
  render();
  auth.onAuthStateChanged(u=>{
    stopSubs(); if(S.profUnsub){ S.profUnsub(); S.profUnsub=null; }
    S.authReady=true; S.auth=u; S.profile=null; S.uid=u?u.uid:null; S.users={}; S.tugas=[]; S.pengumuman=[]; S.kas={}; S.kasMeta={}; S.catEdit=null; S.trx={}; S.calc=null; S.authErr=u?"":S.authErr;
    if(!u){ $("#root").innerHTML=""; render(); return; }
    S.profUnsub=fs.collection("users").doc(u.uid).onSnapshot(async s=>{
      if(!s.exists){
        if(S.creating) return; S.creating=true;
        const base={email:u.email||"", nama:S.pendingNama||(u.email||"").split("@")[0], createdAt:new Date().toISOString()};
        const ref=fs.collection("users").doc(u.uid);
        // Server rules decide who is the owner: try admin first, fall back to waiting for approval.
        try{ await ref.set({...base, role:"admin"}); }
        catch(e1){ try{ await ref.set({...base, role:"menunggu"}); }
          catch(err){ S.authErr="Profil gagal dibuat ("+(err.code||err.message)+"). Pastikan aturan Firestore sudah dipasang."; render(); } }
        S.creating=false; return;
      }
      const prevRole=role();
      S.profile=Object.assign({id:s.id}, s.data());
      S.canWrite=can("editGudang"); S.canEdit=role()==="admin"||role()==="penuh";
      if(ACTIVE.includes(role())){ if(S.subsOn && prevRole!==role()){ stopSubs(); } startSubs(); if(!allowed(S.view)) S.view="beranda"; }
      else if(role()==="absen"){ if(S.subsOn && prevRole!==role()){ stopSubs(); } startAbsenSubs(); }
      else { stopSubs(); $("#root").innerHTML=""; }
      render();
    }, err=>{ S.authErr="Profil tidak bisa dibaca ("+(err.code||err.message)+"). Pastikan aturan Firestore sudah dipasang."; render(); });
  });
})();
})();
