<style>
/* Layout: warehouse ledger — fixed side rail of sections, working area of tables and entry forms; bin-label chips for codes. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#16201B; --muted:#5D6A63; --line:#D8DFD9;
  --accent:#1D5B8F; --accent-ink:#FFFFFF; --accent-soft:#E1EBF4;
  --ok:#2E7A4D; --ok-soft:#E1F0E6; --warn:#A86A12; --warn-soft:#F8ECD6; --bad:#B0322A; --bad-soft:#F7E1DE;
  --rail:#1B2621; --rail-ink:#D9E2DC; --rail-muted:#8A9A91;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --sunk:#121a16; --ink:#E4EBE6; --muted:#93A199; --line:#28332D;
  --accent:#78AEE0; --accent-ink:#0D1B28; --accent-soft:#1C2E3E;
  --ok:#62BD87; --ok-soft:#183026; --warn:#E3AA4E; --warn-soft:#33281A; --bad:#EA6B61; --bad-soft:#3A1F1C;
  --rail:#0B100D; --rail-ink:#D9E2DC; --rail-muted:#7F8E86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --sunk:#121a16; --ink:#E4EBE6; --muted:#93A199; --line:#28332D;
  --accent:#78AEE0; --accent-ink:#0D1B28; --accent-soft:#1C2E3E;
  --ok:#62BD87; --ok-soft:#183026; --warn:#E3AA4E; --warn-soft:#33281A; --bad:#EA6B61; --bad-soft:#3A1F1C;
  --rail:#0B100D; --rail-ink:#D9E2DC; --rail-muted:#7F8E86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.01em;line-height:1.05}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--rail-ink);text-decoration:none;padding:8px 10px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);font-weight:600}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-muted)}
.main{min-width:0;padding-block:24px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.pb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi{overflow:hidden}
.kpi .v{overflow-wrap:anywhere;font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tbody tr:hover{background:var(--sunk)}
tr.click{cursor:pointer}
tfoot td{font-weight:600;background:var(--sunk)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.code{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--sunk);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:20px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--sunk);color:var(--muted)}
.neg{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:0}
.qty{width:110px;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>input,label.f>select{color:var(--ink);font-size:14px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 120px auto auto;gap:8px;align-items:center}
.line.p3{grid-template-columns:minmax(0,1fr) 120px 120px auto}
.hint{font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 5px 5px 0}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.chart .vl{fill:var(--ink);font-family:var(--f-mono);font-weight:600}
.chart .vl.in{fill:#fff}
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.right{margin-left:auto}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;gap:14px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--rail)}
  .brand span,.rail .foot{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;min-width:0}
  .nav a{white-space:nowrap;padding:6px 9px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  h1{font-size:24px}
  .line,.line.p3{grid-template-columns:minmax(0,1fr) 96px auto}
  .line.p3 .ex{grid-column:1/-1}
  .qty{width:96px}
  .kpi .v{font-size:22px}
  .kpis{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- super app additions --- */
.navg{display:flex;flex-direction:column;gap:2px}
.navg>.gl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:10px 10px 4px;font-weight:600}
.nav{gap:6px;overflow-y:auto;min-height:0}
.rail .me{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.rail .me b{color:var(--rail-ink);font-weight:600}
.rail .me a{color:var(--rail-muted)}
.authwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--rail)}
.authcard{background:var(--surface);border-radius:10px;width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.authcard .brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:28px;color:var(--ink)}
.authcard .brand span{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.authcard form{display:flex;flex-direction:column;gap:12px}
.authcard input{width:100%}
.err{color:var(--bad);font-size:13px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>.ch{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-weight:600}
.task{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--muted)}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}
.task.late{border-left:3px solid var(--bad)}
.ann{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.ann .at{font-size:12px;color:var(--muted)}
.ann .body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.ann.pin{background:var(--warn-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
.money{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.setup{max-width:760px;display:flex;flex-direction:column;gap:14px}
.setup code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:3px}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .navg{flex-direction:row}
  .navg>.gl{display:none}

  .rail .foot{display:block;flex:none;margin-top:0}
  .rail .me b,.rail .me span{display:none}

#root{min-height:100%}
.authwrap{min-height:100vh}
[hidden]{display:none!important}

@media print{
  html,body{background:#fff!important}
  .rail,.toast,#modal,.no-print,.btn,.seg button:not(.on),.no-snap,.note.info{display:none!important}
  .app{display:block!important} .main{padding:0!important;max-width:none!important;width:auto!important;margin:0!important}

  .head{margin-bottom:8px} .head h1{font-size:20px}
  .panel{box-shadow:none!important;border:1px solid #ccc!important;break-inside:auto}

/* ===== Tema PTCN: hijau tua · emas · putih ===== */
:root{
  --g900:#06241A; --g800:#0B3324; --g700:#0F4430; --g600:#15573E; --g500:#1E6E50; --g100:#E3EFE8; --g50:#F1F7F3;

  --bg:#F5F4EE; --surface:#FFFFFF; --sunk:#F0EFE7; --ink:#10221A; --muted:#5B6B62; --line:#E2E2D6;
  --accent:#0F4430; --accent-ink:#FFFFFF; --accent-soft:#E3EFE8;
  --ok:#1C7C52; --ok-soft:#DFF2E7; --warn:#A8740F; --warn-soft:#FBF0D5; --bad:#B5362C; --bad-soft:#FBE4E0;
  --rail:#0B3324; --rail-ink:#EAF2EC; --rail-muted:#9DB8A9;
  --grad-rail:linear-gradient(170deg,#0B3324 0%,#0F4430 48%,#14563D 100%);
  --grad-pri:linear-gradient(135deg,#1E6E50 0%,#0F4430 60%,#0B3324 100%);
  --grad-gold:linear-gradient(135deg,#F1DC9C 0%,#D8B65E 45%,#B98F35 100%);
  --grad-hero:linear-gradient(120deg,#0B3324 0%,#11503A 55%,#1E6E50 100%);
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
  --sh1:0 1px 2px rgba(16,34,26,.05),0 2px 8px rgba(16,34,26,.04);
  --sh2:0 4px 14px rgba(16,34,26,.08),0 1px 3px rgba(16,34,26,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1712; --surface:#10221A; --sunk:#0D1D16; --ink:#E9F0EB; --muted:#9AB0A3; --line:#1F3529;

const num = v => { if(typeof v==="number") return v; const s=String(v??"").trim().replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?n:NaN; };

/* ---------- calculations ---------- */
function usage(prodTot, mode, bom){ // botol: dibulatkan ke atas per total produk; karton: per karton penuh (sisa dibawa ke produksi berikutnya)
  const u = {}; bom=bom||S.bom; const pm=mode==="lama"?null:Object.fromEntries((S.produk||[]).map(p=>[p.nama,p]));
  for(const p in prodTot){ for(const b of (bom[p]||[])){ let q;
    if(b.per==="karton" && pm){ const isi=+(pm[p]||{}).isiKardus||0; if(!isi) continue; const k=mode==="ceil"?Math.ceil(prodTot[p]/isi-1e-9):Math.floor(prodTot[p]/isi+1e-9); q=k*(+b.qty||0); }
    else q=Math.ceil(prodTot[p]*b.qty-1e-9);
    if(q) u[b.bahan]=(u[b.bahan]||0)+q; } }
  return u;
}
function compute(){
  applyG2();
  const rows={pembelian:[],produksi:[],keluar:[]};
  for(const k in S.trx){ const d=S.trx[k]; for(const t in rows){ for(const r of (d[t]||[])) rows[t].push({...r,_m:k,_t:t}); } }
  const masuk={}, reject={}, prodTot={}, keluarTot={}, prod30={}, lastIn={};
  const from30 = addDays(TODAY,-30);
  for(const r of rows.pembelian){ const q=+r.qty||0; if(r.reject) reject[r.bahan]=(reject[r.bahan]||0)+q; else { masuk[r.bahan]=(masuk[r.bahan]||0)+q; if(r.tgl && (!lastIn[r.bahan]||r.tgl>lastIn[r.bahan])) lastIn[r.bahan]=r.tgl; } }
  for(const r of rows.produksi){ const q=+r.qty||0; prodTot[r.produk]=(prodTot[r.produk]||0)+q; if(r.tgl && r.tgl>=from30 && r.tgl<=TODAY) prod30[r.produk]=(prod30[r.produk]||0)+q; }
  for(const r of rows.keluar){ keluarTot[r.produk]=(keluarTot[r.produk]||0)+(+r.qty||0); }
  const pakai = usage(prodTot), pakai30 = usage(prod30);
  const names = new Set([...S.bahan.map(b=>b.nama), ...Object.keys(masuk), ...Object.keys(reject), ...Object.keys(pakai)]);
  const minMap = Object.fromEntries(S.bahan.map(b=>[b.nama,+b.min||0]));
  const korMap = Object.fromEntries(S.bahan.map(b=>[b.nama,(b.koreksi||[]).reduce((a,k)=>a+(+k.qty||0),0)]));
  const offSet = new Set(S.bahan.filter(b=>b.nonaktif).map(b=>b.nama));
  const bahan = [...names].map(n=>{
    const m=masuk[n]||0, rj=reject[n]||0, pk=pakai[n]||0, kor=korMap[n]||0, stok=m-rj-pk+kor, p30=pakai30[n]||0, perHari=p30/30;
    const hari = perHari>0 ? stok/perHari : null; const min=minMap[n]||0;
    let st="ok"; if(offSet.has(n)) st="off"; else if(stok<0) st="bad"; else if((hari!==null && hari<14) || (min>0 && stok<min)) st="warn"; else if(p30===0) st="idle";
    return {nama:n, masuk:m, reject:rj, pakai:pk, koreksi:kor, off:offSet.has(n), stok, p30, hari, min, st, lastIn:lastIn[n]||"", known:n in minMap};
  }).sort((a,b)=>a.nama.localeCompare(b.nama,"id"));
  const produk = S.produk.map(p=>{
    const pr=prodTot[p.nama]||0, kl=keluarTot[p.nama]||0, stok=pr-kl;
    return {...p, prod:pr, keluar:kl, stok, dus: p.isiKardus? stok/p.isiKardus : 0, p30:prod30[p.nama]||0};
  });
  const months = Object.keys(S.trx).filter(k=>k!=="tanpa-tanggal").sort();
  let bahanAkhir=bahan, prodTotG=prodTot;
  if(g2Active()){ S.calc={rows}; const g=bahanG2Calc(rows); bahanAkhir=g.list; prodTotG=g.prodTot; }
  S.calc = {rows, bahan:bahanAkhir, produk, months, prodTot, prodTotG, undated: (S.trx["tanpa-tanggal"]||{}),
    undatedCount: ["pembelian","produksi","keluar"].reduce((a,t)=>a+((S.trx["tanpa-tanggal"]||{})[t]||[]).length,0)};
}

const pill = (st, txt) => `<span class="pill p-${st}">${esc(txt)}</span>`;
const stTxt = {ok:"Aman", warn:"Menipis", bad:"Minus", idle:"Belum terpakai", off:"Tidak dipakai"};
function barLabel(v, x, w, yTop, h, H, pb, money){
  if(!(v>0)) return ""; const narrow=(window.innerWidth||1000)<640; const fs=narrow?17:10.5;
  const t=esc(narrow||money==="short" ? short(v) : fmt(Math.round(v))); const need=t.length*fs*.62+8; const cx=x+w/2+fs*.36;
  return h>=need ? `<text class="vl in" style="font-size:${fs}px" transform="translate(${cx},${H-pb-5}) rotate(-90)">${t}</text>`
                 : `<text class="vl" style="font-size:${fs}px" transform="translate(${cx},${yTop-4}) rotate(-90)">${t}</text>`;
}
function barChart(data, opt={}){
  if(!data.length) return `<div class="empty">Belum ada data.</div>`;
  const W=680, H=opt.h||230, pl=44, pb=24, pt=10; const max=Math.max(1,...data.map(d=>d.v||0));
  const step=niceStep(max/4); const top=Math.ceil(max*1.12/step)*step; const bw=(W-pl-8)/data.length;
  let g=""; for(let v=0; v<=top+1e-9; v+=step){ const y=pt+(H-pt-pb)*(1-v/top); g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${esc(short(v))}</text>`; }
  let b=""; data.forEach((d,i)=>{ const h=(H-pt-pb)*((d.v||0)/top); const x=pl+i*bw+bw*.18; const w=bw*.64;
    b+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${Math.max(0,h)}" rx="2" fill="${d.muted?'var(--line)':'var(--accent)'}"><title>${esc(d.title||d.l)}: ${fmt(d.v)}</title></rect>`;
    if(data.length<=24) b+=barLabel(d.v||0, x, w, H-pb-h, h, H, pb);
    if(data.length<=14 || i%2===0) b+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Grafik')}">${g}${b}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function short(v){ return v>=1e6? nf.format(v/1e6)+"jt" : v>=1000? nf.format(v/1000)+"rb" : nf.format(v); }
function opts(list, sel, ph){ return (ph?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(v)}</option>`).join(""); }

function rencanaResult(){
  const items=(S.rencana.items||[]).filter(i=>num(i.qty)>0); const pmap=Object.fromEntries(S.calc.produk.map(p=>[p.nama,p]));
  const po=(S.rencana.items||[]).filter(i=>num(i.po)>0);
  const poShort=po.map(i=>({n:i.produk,kurang:num(i.po)-(pmap[i.produk]?.stok||0)})).filter(x=>x.kurang>0);
  const poNote=poShort.length?`<div class="note" style="margin-bottom:12px">Stok produk belum cukup untuk PO:<ol class="rh-list" style="margin:6px 0 0">${poShort.map(x=>`<li>${esc(x.n)} kurang <b>${fmt(x.kurang)}</b></li>`).join("")}</ol></div>`:"";
  if(!items.length) return `${poNote}<div class="empty">Isi kolom “Rencana produksi” untuk melihat bahan yang dibutuhkan.</div>`;
  const tot={}; for(const i of items) tot[i.produk]=(tot[i.produk]||0)+num(i.qty);
  const cn=g2CairNeed(tot); const need={...cn.out,...usage(tot,"ceil")}; const bm=Object.fromEntries(S.calc.bahan.map(b=>[b.nama,b]));
  const rows=Object.entries(need).map(([n,q])=>({n,q,stok:bm[n]?.stok||0,lt:cn.liter[n]})).map(x=>({...x,sisa:x.stok-x.q})).sort((a,b)=>a.sisa-b.sisa);
  const kurang=rows.filter(r=>r.sisa<0);
  const liter=items.reduce((a,i)=>a+num(i.qty)*((pmap[i.produk]?.ml)||0)/1000,0);
  return `<div class="row" style="margin-bottom:12px">${kurang.length?pill("bad",kurang.length+" bahan kurang"):pill("ok","Semua bahan cukup")}<span class="hint">${fmt(items.reduce((a,i)=>a+num(i.qty),0))} botol · ${fmt(liter)} liter</span>
    ${kurang.length?`<button class="btn sm right" data-act="copy-kurang">Salin daftar belanja</button>`:""}</div>
    ${poNote}
    <div class="tw"><table><thead><tr><th>Bahan</th><th class="n">Butuh</th><th class="n">Stok</th><th class="n">Kurang</th></tr></thead><tbody>

}

async function saveProd(){
  const M=S.modal, d=M.d; const nama=String(d.nama||"").trim(), kode=String(d.kode||"").trim();
  if(!nama||!kode){ toast("Kode dan nama produk wajib diisi."); return; }
  if(M.isNew && S.produk.some(p=>p.nama===nama)){ toast("Nama produk sudah ada."); return; }
  if(S.produk.some(p=>p.kode===kode && p.nama!==M.orig)){ toast("Kode sudah dipakai produk lain."); return; }
  const rec={kode,nama,merek:String(d.merek||"").trim()||nama.split(" ")[0],ml:num(d.ml)||0,isiKardus:num(d.isiKardus)||0,hpp:+d.hpp||0};
  const g=g2Active(); const bom=d.bom.filter(b=>b.bahan&&num(b.qty)>0).map(b=>g?{bahan:b.bahan,qty:num(b.qty),per:b.per==="karton"?"karton":"botol"}:{bahan:b.bahan,qty:num(b.qty)});
  const list=M.isNew?[...S.produk,rec]:S.produk.map(p=>p.nama===M.orig?rec:p);
  M.busy=true; renderModal();
  try{ await saveMaster("produk",{items:list}); if(g) await saveG2({mulai:g2Mulai(), resep:{[nama]:bom}, cair:{[nama]:d.cair||""}}); else await saveMaster("bom",{items:{...S.bom,[nama]:bom}}); S.modal=null; renderModal(); toast("Produk disimpan."); }
  catch(e){ M.busy=false; renderModal(); writeErr(e); }
}

/* HPP berversi: tiap versi berlaku mulai bulan tertentu, jadi kenaikan harga tidak mengubah bulan sebelumnya. */
function hppVersions(){ const st=S.setting||{}; const v=(st.hppVersi&&st.hppVersi.length) ? st.hppVersi : [{mulai:HPP_MULAI, tabel:st.hpp||HPP_DEFAULT}]; return [...v].sort((a,b)=>a.mulai.localeCompare(b.mulai)); }
function hppVersionFor(m){ const v=hppVersions(); m=m||TODAY.slice(0,7); let pick=v[0]; for(const x of v) if(x.mulai<=m) pick=x; return pick; }

function pickYear(kind, y){

  else if(kind==="lap"){ const ms=monthlySeries().map(s=>s.bulan).filter(m=>m.startsWith(y)).sort(); S.ui.lapYear=y; S.ui.lapMonth=ms.filter(m=>m<TODAY.slice(0,7)).pop()||ms.pop()||S.ui.lapMonth; }
  else if(kind==="rw"){ const ms=S.calc.months.filter(m=>m.startsWith(y)).sort(); S.ui.rwYear=y; S.ui.rwMonth=ms.pop()||("Y:"+y); }

function addonTemplates(){ return (S.setting && S.setting.addon) || {}; }
function arsipOf(m){ const a=S.arsipPTCN && S.arsipPTCN.bulan; return a && a[m] && a[m].length ? a[m] : null; }
function inputRowsOf(m){

  return S.calc.rows.produksi.filter(r=>r._m===m).map(r=>{ const p=pm[r.produk]||{}; return {tgl:r.tgl, merek:p.merek||"Lainnya", ml:+p.ml||0, qty:+r.qty||0, produk:r.produk}; });
}
const itemHarga = t => (t.komponen && t.komponen.length) ? t.komponen.reduce((a,k)=>a+(+k.harga||0),0) : (+t.harga||0);
const itemTotal = t => (t.jumlah!=null && t.qty==null) ? (+t.jumlah||0) : (+t.qty||0)*itemHarga(t);
function bayarCfg(m){
  const b=((S.setting||{}).bayar||{})[m]||{};
  const L=b.listrik||{};
  return {
    skema: b.skema || (m>=HPP_MULAI ? "hpp" : "liter"),
    tarif: b.tarif ?? (S.setting.komisi||{})[m] ?? S.setting.komisiDefault ?? 3500,
    listrik: {tarifKwh: L.tarifKwh ?? LISTRIK_DEFAULT.tarifKwh, jamHari: L.jamHari ?? LISTRIK_DEFAULT.jamHari, lembur: L.lembur ?? 0, alat: (L.alat && L.alat.length) ? L.alat : LISTRIK_DEFAULT.alat},
    hari: b.hari ?? null, listrikManual: b.listrikManual ?? null,
    tambahan: b.tambahan||[], potongan: (b.potongan||[]).map(p=>p.qty==null&&p.jumlah!=null?{nama:p.nama, qty:1, harga:+p.jumlah||0}:p), catatan: b.catatan||""
  };
}
function sumRows(rows){
  const days={}, sizes=new Set(); let botol=0, liter=0;
  for(const r of rows){ const q=+r.qty||0; sizes.add(r.ml); const d=r.tgl||""; days[d]=days[d]||{}; days[d][r.ml]=(days[d][r.ml]||0)+q; botol+=q; liter+=q*r.ml/1000; }
  return {days, sizes:[...sizes].sort((a,b)=>a-b), botol, liter};
}
/* Laporan PTCN tanpa pemisahan merek: bagi jumlah botol PTCN ke merek sesuai proporsi input harian
   (per tanggal & ukuran; bila hari itu tak ada input, pakai proporsi sebulan untuk ukuran itu). */
function allocateBrands(ar, inp){
  const day={}, mon={};
  for(const r of inp){ const kd=r.tgl+"|"+r.ml; (day[kd]=day[kd]||{})[r.merek]=(day[kd][r.merek]||0)+r.qty; (mon[r.ml]=mon[r.ml]||{})[r.merek]=(mon[r.ml][r.merek]||0)+r.qty; }
  const out=[];
  for(const r of ar){ const p=day[r.tgl+"|"+r.ml] || mon[r.ml]; const tot=p?Object.values(p).reduce((a,x)=>a+x,0):0;
    if(!tot){ out.push({...r, merek:"Belum diketahui"}); continue; }
    for(const b in p) out.push({tgl:r.tgl, ml:r.ml, merek:b, qty:r.qty*p[b]/tot}); }
  return out;
}
function monthReport(m){
  const ar=arsipOf(m); const inp=inputRowsOf(m);
  const src = ar ? "ptcn" : "input";
  const rows = ar ? ar : inp;
  const arsipHasBrand = !!(ar && ar.some(r=>r.merek));
  const brandMode = !ar ? "input" : arsipHasBrand ? "ptcn" : "alokasi";
  const brandRows = brandMode==="input" ? inp : brandMode==="ptcn" ? ar : allocateBrands(ar, inp);
  const base=sumRows(rows); const inS=sumRows(inp);
  const brand={}; let nilaiHpp=0;
  for(const r of brandRows){ const b=r.merek||"Lainnya"; brand[b]=brand[b]||{}; brand[b][r.ml]=brand[b][r.ml]||{q:0,v:0}; const v=(+r.qty||0)*hppOf(b,r.ml,m); brand[b][r.ml].q+=+r.qty||0; brand[b][r.ml].v+=v; nilaiHpp+=v; }
  const cfg=bayarCfg(m);
  const hariAuto=Object.keys(base.days).filter(Boolean).length;
  const hari = cfg.hari ?? hariAuto;
  const L=cfg.listrik;
  const alatRows = L.alat.map(a=>({nama:a.nama, kw:+a.kw||0, biaya:(+a.kw||0)*(+L.jamHari||0)*(+L.tarifKwh||0)}));
  const perHari = alatRows.reduce((a,x)=>a+x.biaya,0);
  const totalJam = hari*(+L.jamHari||0) + (+L.lembur||0);
  // rumus sesuai sheet PTCN: biaya per hari (kW × jam × tarif) × total jam kerja
  const listrik = cfg.listrikManual!=null ? +cfg.listrikManual : perHari*totalJam;
  const tambahan = cfg.tambahan.reduce((a,x)=>a+itemTotal(x),0);
  const potongan = cfg.potongan.reduce((a,x)=>a+itemTotal(x),0);
  const komisi = base.liter*cfg.tarif;
  const pendapatan = cfg.skema==="hpp" ? nilaiHpp - listrik + tambahan - potongan : komisi + tambahan - potongan;
  let selisih=[];
  if(ar){ const keys=new Set([...Object.keys(base.days),...Object.keys(inS.days)]);
    for(const d of [...keys].sort()){ for(const ml of new Set([...Object.keys(base.days[d]||{}),...Object.keys(inS.days[d]||{})].map(Number))){
      const a=(base.days[d]||{})[ml]||0, b=(inS.days[d]||{})[ml]||0; if(Math.abs(a-b)>1e-9) selisih.push({tgl:d, ml, ptcn:a, input:b}); } }
    selisih.sort((x,y)=>x.tgl.localeCompare(y.tgl)||x.ml-y.ml); }
  return {m, src, rows, inp, days:base.days, sizes:base.sizes, botol:base.botol, liter:base.liter, inputLiter:inS.liter,
    hppVer:hppVersionFor(m), brand, brandMode, brandFromInput: brandMode!=="ptcn", nilaiHpp, cfg, hari, hariAuto, alatRows, perHari, totalJam, listrik, tambahan, potongan, komisi, pendapatan, tarif:cfg.tarif, selisih,
    hpp:nilaiHpp, arsip: ar ? {liter:base.liter} : ((S.setting.arsip||[]).find(a=>a.bulan===m)||null)};
}
function monthlySeries(){
  const ms=new Set();
  (S.setting.arsip||[]).forEach(a=>ms.add(a.bulan));
  Object.keys((S.arsipPTCN&&S.arsipPTCN.bulan)||{}).forEach(m=>ms.add(m));
  (S.calc?S.calc.months:[]).forEach(m=>ms.add(m));
  return [...ms].sort().map(m=>{ const R=monthReport(m); const old=(S.setting.arsip||[]).find(a=>a.bulan===m);
    const resmi = R.src==="ptcn" ? R.liter : (R.inp.length ? R.inputLiter : (old?old.liter:null));
    return {bulan:m, resmi, input:R.inp.length?R.inputLiter:null, arsip: R.src==="ptcn"?R.liter:(old?old.liter:null), skema:R.cfg.skema, pendapatan: (R.inp.length||R.src==="ptcn")?R.pendapatan:(old&&old.hasil!=null?old.hasil:null)}; });
}
function lapRows(){
  const R=monthReport(S.ui.lapMonth); const sizes=R.sizes; const days=Object.keys(R.days).sort();
  const out=[["Tanggal",...sizes.map(sizeLabel),"Liter"]];
  for(const d of days){ const r=R.days[d]; out.push([d||"tanpa tanggal",...sizes.map(s=>r[s]||0), sizes.reduce((a,s)=>a+(r[s]||0)*s/1000,0)]); }
  out.push(["SUB TOTAL",...sizes.map(s=>days.reduce((a,d)=>a+(R.days[d][s]||0),0)),R.liter]);
  out.push([]); out.push(["TOTAL LITER",R.liter]);
  if(R.cfg.skema==="hpp"){
    out.push(["NILAI PRODUK JADI (HPP)",R.nilaiHpp]);
    out.push(["BIAYA LISTRIK ("+R.perHari+" per hari x "+R.totalJam+" jam)",-R.listrik]);
  } else out.push(["KOMISI ("+R.liter+" L x "+R.tarif+")",R.komisi]);
  R.cfg.tambahan.forEach(t=>out.push(["TAMBAHAN: "+t.nama+" ("+t.qty+" x "+itemHarga(t)+")",itemTotal(t)]));
  R.cfg.potongan.forEach(t=>out.push(["POTONGAN: "+t.nama+" ("+t.qty+" x "+itemHarga(t)+")",-itemTotal(t)]));
  out.push(["PENDAPATAN PTCN",R.pendapatan]);
  return out;
}

async function saveBayar(){
  const M=S.modal, d=M.d; const n=v=>{ const x=num(v); return isFinite(x)?x:null; };
  const cfg={skema:d.skema, tarif:n(d.tarif)??3500,
    listrik:{tarifKwh:n(d.tarifKwh)??0, jamHari:n(d.jamHari)??0, lembur:n(d.lembur)??0, alat:d.alat.filter(a=>String(a.nama).trim()).map(a=>({nama:String(a.nama).trim(), kw:n(a.kw)||0}))},
    hari: String(d.hari).trim()===""?null:n(d.hari), listrikManual: String(d.listrikManual).trim()===""?null:n(d.listrikManual),
    tambahan:d.tambahan.filter(t=>String(t.nama).trim()).map(t=>{ const k=(t.komponen||[]).filter(c=>String(c.nama).trim()).map(c=>({nama:String(c.nama).trim(), harga:n(c.harga)||0}));
      return k.length ? {nama:String(t.nama).trim(), qty:n(t.qty)||0, komponen:k, harga:k.reduce((a,c)=>a+c.harga,0)} : {nama:String(t.nama).trim(), qty:n(t.qty)||0, harga:n(t.harga)||0}; }),
    potongan:d.potongan.filter(t=>String(t.nama).trim()).map(t=>({nama:String(t.nama).trim(), qty:n(t.qty)||0, harga:n(t.harga)||0})),
    catatan:String(d.catatan||"").trim()};
  M.busy=true; renderModal();
  try{ const bayar={...((S.setting||{}).bayar||{}), [M.m]:cfg}; await saveMaster("setting",{...S.setting, bayar}); S.modal=null; renderModal(); toast("Perhitungan "+fmonth(M.m)+" disimpan."); }
  catch(e){ M.busy=false; renderModal(); writeErr(e); }
}

function tarifHppView(ro){
  const vers=hppVersions(); const merek=[...new Set([...Object.keys(HPP_DEFAULT), ...vers.flatMap(v=>Object.keys(v.tabel||{})), ...S.produk.map(p=>p.merek).filter(Boolean)])];
  const strTab=t=>Object.fromEntries(merek.map(m=>[m,Object.fromEntries(HPP_SIZES.map(s=>[s, (t&&t[m]&&t[m][s])?dec(t[m][s]):""]))]));
  if(!S.hppEdit){ const cur=hppVersionFor(TODAY.slice(0,7)); S.hppEdit={vi:Math.max(0,vers.indexOf(cur)), vers:vers.map(v=>({mulai:v.mulai, tabel:strTab(v.tabel)}))}; }
  if(!S.addonEdit){ const a=addonTemplates(); S.addonEdit=Object.keys(a).sort().map(k=>({nama:k, komponen:(a[k].komponen||[]).map(c=>({nama:c.nama,harga:dec(c.harga)}))})); }
  const H=S.hppEdit; if(H.vi>=H.vers.length) H.vi=H.vers.length-1; const V0=H.vers[H.vi]; const E=V0.tabel, A=S.addonEdit;
  const sorted=H.vers.map((v,i)=>({...v,i})).sort((a,b)=>String(a.mulai).localeCompare(String(b.mulai)));
  const pos=sorted.findIndex(v=>v.i===H.vi); const nextV=sorted[pos+1];
  const until=nextV&&/^\d{4}-\d{2}$/.test(nextV.mulai) ? "sampai "+fmonth((()=>{ let y=+nextV.mulai.slice(0,4), b=+nextV.mulai.slice(5)-1; if(b<1){ b=12; y--; } return y+"-"+pad(b); })()) : "dan seterusnya";
  return `<section class="panel"><div class="ph"><h2>Tabel HPP per kemasan</h2>${ro?"":`<div class="row"><button class="btn" data-act="hv-add">+ Versi baru (harga naik)</button><button class="btn pri" data-act="hpp-save">Simpan HPP</button></div>`}</div>

      <div class="seg">${sorted.map(v=>`<button data-act="hv-pick" data-v="${v.i}" class="${v.i===H.vi?"on":""}">Mulai ${/^\d{4}-\d{2}$/.test(v.mulai)?esc(smonth(v.mulai)):"?"}</button>`).join("")}</div>
      ${ro?`<span class="hint">berlaku ${/^\d{4}-\d{2}$/.test(V0.mulai)?fmonth(V0.mulai):""} ${until}</span>`:`<label class="f" style="margin:0">Berlaku mulai bulan<input type="month" id="hv-mulai" data-hv="mulai" value="${esc(V0.mulai)}"></label>

async function saveHpp(){

    const tabel={}; for(const m in v.tabel){ const row={}; for(const s of HPP_SIZES){ const x=num(v.tabel[m][s]); if(isFinite(x)&&x>0) row[s]=x; } tabel[m]=row; } vers.push({mulai:v.mulai, tabel}); }

const H2I_URL = window.__H2I_URL || "https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js";
const SNAP_VIEWS = {tugas:"Tugas", bahan:"Stok bahan baku", produk:"Stok produk jadi", riwayat:"Riwayat", laporan:"Laporan produksi", rekappekerja:"Rekap pekerja", kas:"Buku kas", keuangan:"Laporan keuangan"};
function loadH2I(){ return new Promise((res,rej)=>{ if(window.htmlToImage) return res(); const s=document.createElement("script"); s.src=H2I_URL; s.onload=()=>res(); s.onerror=()=>rej(new Error("Gagal memuat alat gambar. Periksa koneksi internet.")); document.head.appendChild(s); }); }
function snapButton(){ return SNAP_VIEWS[S.view] ? `<button class="btn no-snap" data-act="snap" title="Simpan halaman ini sebagai gambar PNG">Unduh gambar</button>` : ""; }
/* gambar dipotong per halaman A4 (otomatis tegak/mendatar), dipotong di batas baris */
const A4PX = {p:[794,1123], l:[1123,794]}, A4M = 34, A4FOOT = 22;
const tick = () => new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function contentWidth(main){ return Math.ceil(Math.max(main.scrollWidth, ...[...main.querySelectorAll(".tw,.board,table")].map(t=>t.scrollWidth+40))); }
async function snapPage(){
  const main=$("#main"); if(!main || S.snapBusy) return; S.snapBusy=true;
  const title=(main.querySelector("h1")||{}).textContent||SNAP_VIEWS[S.view]||"Halaman";
  toast("Membuat gambar A4…");
  const html=document.documentElement; html.classList.add("snapping");
  const cap=document.createElement("div"); cap.className="snapcap"; cap.innerHTML=`<b>${esc(NAMA_USAHA)} Super App</b> · ${esc(title)} · dibuat ${fdt(new Date().toISOString())} oleh ${esc((S.profile&&S.profile.nama)||"")}`;
  main.prepend(cap);
  try{
    await loadH2I();
    let ori="p"; main.style.width=(A4PX.p[0]-2*A4M)+"px"; await tick();
    let need=contentWidth(main);
    if(need>A4PX.p[0]-2*A4M+4){ ori="l"; main.style.width=(A4PX.l[0]-2*A4M)+"px"; await tick(); need=contentWidth(main); }
    const cw=A4PX[ori][0]-2*A4M; const W=Math.max(cw,need); main.style.width=W+"px"; await tick();
    const H=Math.ceil(main.scrollHeight); const scale=cw/W;
    const pageH=Math.floor((A4PX[ori][1]-2*A4M-A4FOOT)/scale);
    const top0=main.getBoundingClientRect().top;
    const bps=[...new Set([...main.querySelectorAll("tbody tr,tfoot tr,section.panel,.kpis,.head,.note,.task,.li,.ann,.snapcap,.box2,.pb,figure,.board")].map(e=>Math.round(e.getBoundingClientRect().bottom-top0)).filter(y=>y>0&&y<H))].sort((a,b)=>a-b);
    const cuts=[0]; while(H-cuts[cuts.length-1]>pageH){ const last=cuts[cuts.length-1]; const c=bps.filter(y=>y>last+pageH*0.4 && y<=last+pageH).pop(); cuts.push(c||last+pageH); }
    cuts.push(H); const n=cuts.length-1;
    if(n>25) throw new Error("Halaman ini jadi "+n+" lembar A4. Persempit dulu (pilih satu bulan atau gunakan pencarian).");
    const PR=2; const base=(NAMA_USAHA+" "+title).replace(/[\\/:*?"<>|]+/g,"-").trim();
    const filter=nd=>!(nd.classList && nd.classList.contains("no-snap"));
    for(let i=0;i<n;i++){
      const y0=cuts[i], h=cuts[i+1]-cuts[i];
      const part=await htmlToImage.toCanvas(main,{pixelRatio:scale*PR, width:W, height:h, backgroundColor:"#ffffff", cacheBust:false, filter, style:{transform:`translateY(-${y0}px)`, transformOrigin:"top left"}});
      const pg=document.createElement("canvas"); pg.width=A4PX[ori][0]*PR; pg.height=A4PX[ori][1]*PR; const cx=pg.getContext("2d");
      cx.fillStyle="#ffffff"; cx.fillRect(0,0,pg.width,pg.height);
      cx.drawImage(part, A4M*PR, A4M*PR, cw*PR, h*scale*PR);
      cx.fillStyle="#777"; cx.font=`${10*PR}px sans-serif`; cx.textAlign="right";
      cx.fillText(`${NAMA_USAHA} · ${title} · halaman ${i+1} dari ${n}`, pg.width-A4M*PR, pg.height-(A4M-6)*PR);
      const blob=await new Promise(r=>pg.toBlob(r,"image/png")); if(!blob) throw new Error("Gambar kosong.");
      const name=base+(n>1?` (hal ${i+1} dari ${n})`:"")+".png";
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
      if(n>1) await new Promise(r=>setTimeout(r,350));
    }
    toast(n>1?`${n} gambar A4 ${ori==="l"?"mendatar":"tegak"} disimpan di Download.`:`Gambar A4 ${ori==="l"?"mendatar":"tegak"} disimpan di Download.`);
  }catch(e){ toast((e&&e.message)||"Gagal membuat gambar."); }
  finally{ cap.remove(); main.style.width=""; html.classList.remove("snapping"); S.snapBusy=false; }
}

function rekapOrang(dari, sampai, pidFilter){
  const rows=pekerjaRows().filter(r=>r.tgl>=dari && r.tgl<=sampai && (!pidFilter || (r.pid||r.nama)===pidFilter)); const o={};

  const tr=tarifLiter();
  return Object.values(o).map(x=>{ const p=(S.pekerja||[]).find(q=>q.id===x.pid); const g=gajiOf(x.pid);
    const hari=Object.values(x.hari).sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(h=>{ const lt=literPerOrang(h.tgl); const nS=h.nS;
      const upahShift=nS*(+g.gajiShift||0)+h.leaderS*(+g.tunjLeader||0); const upahLt=lt*tr; const ar=p?recOf(p.id,h.tgl,"masuk"):null; const telat=ar&&ar.status==="ok"&&!ar.izin?(ar.telat||0):0; const pot=p&&telat?potonganTelat(p,ar):0;

}

/* ----- tinjau kategori ----- */
const RX_BB=/STIKER|STICKER|BROSUR|BOTOL|KARDUS|KARTON|LABEL|HOLOGRAM|SHIELD|SEAL ?TAG|SEALTAG|JIRIGEN|JERIGEN|PLASTIK|SHRINK|AMINO|TUTUP|SOLASI|LAKBAN|CAIRAN|BAHAN BAKU|SPIRTUS|PRASETYA|MANYAR|BENTONIT|KARDUS DP/;
const RX_AKTIVA=/\bTAB\b|TABLET|LAPTOP|KOMPUTER|PRINTER|MESIN|SEALER|KIPAS|\bAC\b|SOFA|KURSI|MEJA|LEMARI|\bRAK\b|TIMBANGAN|CCTV|DISPENSER|POMPA|TANDON|ETALASE/;
const RX_KANTOR=/\bATK\b|KERTAS|TINTA|GALON|\bAIR\b|TISSUE|TISU|PULSA|INTERNET|WIFI|\bKUE\b|ROKOK|SNACK|KONSUMSI|MAKAN|AKOMODASI|RAPAT|TEKNISI|LISTRIK|SABUN|KEBERSIHAN/;
function saranKat(r){
  const u=String(r.ket||"").toUpperCase();
  if(/^CASH\b|TARIK TUNAI/.test(u)) return "__tarik";
  if(/INVEST|SAHAM|PASAR MODAL|SEKURITAS|TOP-?UP SAHAM/.test(u)) return "Investasi";
  if(/HARIAN|MINGGUAN|UPAH/.test(u)) return "Gaji Harian";
  if(/\bGAJI\b|\bTHR\b|BPJS|BULANAN/.test(u)) return "Gaji Tetap";
  if(RX_BB.test(u)) return "Bahan baku";
  if(/BENSIN|BBM|ONGKIR|ONGKOS KIRIM|PARKIR|\bTOL\b|GRAB|GOJEK|KURIR/.test(u)) return "Belanja & Biaya Lain-lain";
  if(RX_AKTIVA.test(u)) return "Aktiva tetap";
  if(RX_KANTOR.test(u)) return "Kantor";
  return "";
}

  for(const m of Object.keys(S.kas).filter(m=>pakaiKelompok(m) && (T.m==="*"||m===T.m)).sort())

}

async function saveTinjau(){
  const T=S.tj; const rows=tinjauRows().filter(r=>T.sel[r.id]); if(!rows.length) return;

/* ----- rekap tahunan berkelompok (format Rekap Keuangan) ----- */
function rekapRows(y){
  const L=ledger(); return Array.from({length:12},(_,i)=>y+"-"+pad(i+1)).filter(m=>L[m]).map(m=>({...L[m], kel: pakaiKelompok(m)?kelSums(m):null}));
}
function rekapCsv(y){

  return [["Bulan","Saldo awal","Pemasukan",...KELOMPOK,"Pengeluaran","Pemasukan - Pengeluaran","Saldo akhir"],
    ...rows.map(r=>[fmonth(r.m),r.awal,r.masuk,...KELOMPOK.map(g=>r.kel?r.kel[g]:""),r.keluar,r.net,r.akhir]),
    ["Total "+y,"",t.masuk,...KELOMPOK.map(g=>t.adaKel?t.kel[g]:""),t.keluar,t.net,rows.length?rows[rows.length-1].akhir:""]];

function rekapTotal(rows){ const t={masuk:0,keluar:0,net:0,kel:Object.fromEntries(KELOMPOK.map(g=>[g,0])),adaKel:false};
  rows.forEach(r=>{ t.masuk+=r.masuk; t.keluar+=r.keluar; t.net+=r.net; if(r.kel){ t.adaKel=true; KELOMPOK.forEach(g=>t.kel[g]+=r.kel[g]); } }); return t; }

function kasPrintSheet(m, A){
  const semua=A==="*"; const sg=r=>semua?(r.jenis==="pindah"?0:r.jenis==="masuk"?1:-1):arah(r,A);
  const rows=kasRowsSorted(m).filter(r=>sg(r)!==0).map(r=>{ const g=sg(r), j=+r.jumlah||0;
    const kel = g>0 ? null : r.jenis==="pindah" ? KEL_TARIK : kelOf(r.kategori);
    const note = r.jenis==="pindah" ? (g<0?"Cash":"Tarik tunai") : (semua && akunOf(r)!==akunUtama() ? akunOf(r) : "");
    return {r, masuk:g>0?j:0, total:g<0?j:0, kel, note}; });
  const cols=KELOMPOK.filter(k=>k!=="Lain-lain" || rows.some(x=>x.kel==="Lain-lain"));
  const T={masuk:0,total:0}; cols.forEach(c=>T[c]=0); rows.forEach(x=>{ T.masuk+=x.masuk; T.total+=x.total; if(x.kel) T[x.kel]=(T[x.kel]||0)+x.total; });

      <tr>${cols.map(c=>`<th>${esc((KEL_LABEL[c]||c).toUpperCase())}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(x=>`<tr><td class="c">${x.r.tgl?x.r.tgl.split("-").reverse().join("/"):""}</td><td>${esc(x.r.ket)}</td>${cell(x.masuk)}${cell(x.total)}${cols.map(c=>cell(x.kel===c?x.total:0)).join("")}<td class="c ${x.note==="Cash"?"cash":""}">${esc(x.note)}</td></tr>`).join("")||`<tr><td colspan="${5+cols.length}" class="c">Belum ada transaksi.</td></tr>`}</tbody>
    <tr class="kptot"><td></td><td class="c"><b>TOTAL ${esc(upMonth(m))}</b></td>${cell(T.masuk)}${cell(T.total)}${cols.map(c=>cell(T[c])).join("")}<td></td></tr></tbody></table>
    <table class="kpsum"><tbody><tr><td>Saldo awal</td><td class="n">${rp(L.awal)}</td></tr><tr><td>Penerimaan</td><td class="n">${rp(T.masuk)}</td></tr><tr><td>Pengeluaran</td><td class="n">${rp(T.total)}</td></tr><tr><td><b>Saldo akhir</b></td><td class="n"><b>${rp(L.akhir)}</b></td></tr></tbody></table></div>`;
}
function cetak(landscape, mode){
  const st=document.createElement("style"); st.id="pgsize"; st.textContent=`@page{size:A4 ${landscape?"landscape":"portrait"};margin:10mm}`; document.head.appendChild(st);
  const cap=document.createElement("div"); cap.className="printcap"; cap.innerHTML=`<b>${esc(NAMA_USAHA)}</b> · dicetak ${fdt(new Date().toISOString())} oleh ${esc((S.profile&&S.profile.nama)||"")}`; $("#main").prepend(cap);
  if(mode) document.documentElement.classList.add("pmode");
  const done=()=>{ st.remove(); cap.remove(); document.documentElement.classList.remove("pmode"); window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done); setTimeout(()=>window.print(),60); setTimeout(()=>{ if(document.getElementById("pgsize")) done(); },60000);
}

function g2Doc(){ return S.g2 || {}; }
function g2Active(){ return !g2Doc().nonaktif; }
function g2Mulai(){ return g2Doc().mulai || G2_MULAI; }
function g2Items(){
  const saved=g2Doc().items; const list=(saved&&saved.length?saved:G2_ITEMS).map(x=>({...x}));
  const have=new Set(list.map(x=>x.nama));
  for(const b of (S.bahanLama||[])){ // bahan lama yang tidak ada di lembar gudang tetap ikut, stok awalnya dari sistem lama per 4 Nov
    if(G2_NAMA[b.nama] || have.has(b.nama)) continue;
    list.push({nama:b.nama, awal:null, min:+b.min||0, nonaktif:!!b.nonaktif}); have.add(b.nama);
  }
  return list;
}
function g2Alias(){ const a={...G2_NAMA}; for(const it of g2Items()) for(const n of (it.lama||[])) a[n]=it.nama; return a; }
function g2Derive(p){
  const old=(S.bomLama||{})[p]; if(!old||!old.length) return G2_RESEP_EXTRA[p] ? G2_RESEP_EXTRA[p].map(x=>({...x})) : [];
  const out=[];
  for(const b of old){ if(G2_CAIR[b.bahan]) continue; const n=G2_NAMA[b.bahan]||b.bahan; const kt=isKartonNama(b.bahan)||isKartonNama(n);
    const r=kt?{bahan:n,qty:1,per:"karton"}:{bahan:n,qty:+b.qty||0,per:"botol"}; const ex=out.find(x=>x.bahan===r.bahan&&x.per===r.per); if(ex) ex.qty+=r.qty; else out.push(r); }
  const prod=(S.produk||[]).find(x=>x.nama===p);
  // produk tanpa stiker karton (250 mL, Saratoga, dll.): label kartonnya pakai stiker botol, 1 lembar per karton
  if(prod && prod.ml<=1000 && out.some(x=>x.per==="karton"&&/^Karton\b/.test(x.bahan)) && !out.some(x=>/^Stiker Karton\b/.test(x.bahan))){
    const st=out.find(x=>x.per==="botol"&&/^Stiker\b/.test(x.bahan)); if(st) out.push({bahan:st.bahan,qty:1,per:"karton"});
  }
  return out;
}
function g2CairDerive(p){ const old=(S.bomLama||{})[p]||[]; const c=old.find(b=>G2_CAIR[b.bahan]); if(c) return G2_CAIR[c.bahan]; return G2_RESEP_EXTRA[p]?G2_CAIR["Bahan Baku"]:""; }
function g2Resep(){ const saved=g2Doc().resep||{}; const o={}; for(const p of (S.produk||[])) o[p.nama]= saved[p.nama] ? saved[p.nama].map(x=>({...x})) : g2Derive(p.nama); return o; }
function g2Cair(p){ const c=g2Doc().cair||{}; return p in c ? c[p] : g2CairDerive(p); }
function g2Jirigen(){ return S.bahan.filter(b=>b.satuan==="jirigen"); }
function isJir(n){ const b=S.bahan.find(x=>x.nama===n); return !!(b&&b.satuan==="jirigen"); }
function satuanOf(n){ return isJir(n)?"jirigen":""; }

const JENIS_TXT={masuk:"Masuk",reject:"Reject",lain:"Pemakaian lain",buka:"Jirigen dibuka",rusak:"Reject produksi",addon:"Keluar (add-on)"};
const jenisOf = r => !r.reject ? "masuk" : (r.jenis==="lain"||r.jenis==="buka"||r.jenis==="rusak"||r.jenis==="addon") ? r.jenis : "reject";
function jenisPill(r){ const j=jenisOf(r); return j==="masuk"?pill("ok","Masuk"):j==="reject"?pill("bad","Reject"):j==="rusak"?pill("bad","Reject produksi"):j==="addon"?pill("info","Add-on"):j==="buka"?pill("info","Jirigen dibuka"):pill("warn","Pemakaian lain"); }

/* stok sistem lama (resep lama), hanya transaksi sebelum tanggal mulai */
function bahanLamaCalc(rows, before){
  const ok=r=>!before || (r.tgl && r.tgl<before);
  const masuk={}, reject={}, prodTot={};
  for(const r of rows.pembelian) if(ok(r)){ const q=+r.qty||0; if(r.reject) reject[r.bahan]=(reject[r.bahan]||0)+q; else masuk[r.bahan]=(masuk[r.bahan]||0)+q; }
  for(const r of rows.produksi) if(ok(r)) prodTot[r.produk]=(prodTot[r.produk]||0)+(+r.qty||0);
  const pakai=usage(prodTot,"lama",S.bomLama||{});
  const lama=S.bahanLama||[]; const kor=Object.fromEntries(lama.map(b=>[b.nama,(b.koreksi||[]).filter(k=>!before||(k.tgl&&k.tgl<before)).reduce((a,k)=>a+(+k.qty||0),0)]));
  const names=new Set([...lama.map(b=>b.nama),...Object.keys(masuk),...Object.keys(reject),...Object.keys(pakai)]);
  return [...names].map(n=>{ const m=masuk[n]||0, rj=reject[n]||0, pk=pakai[n]||0, k=kor[n]||0; return {nama:n, masuk:m, reject:rj, pakai:pk, koreksi:k, stok:m-rj-pk+k, off:!!(lama.find(b=>b.nama===n)||{}).nonaktif}; })
    .sort((a,b)=>a.nama.localeCompare(b.nama,"id"));
}

/* stok sistem baru */
function bahanG2Calc(rows){
  const mulai=g2Mulai(), alias=g2Alias(), items=S.bahan, idx=Object.fromEntries(items.map(b=>[b.nama,b]));
  const nm=n=>idx[n]?n:(alias[n]||n);
  const from30=mulai>addDays(TODAY,-29)?mulai:addDays(TODAY,-29), lama=Object.fromEntries(bahanLamaCalc(rows,mulai).map(b=>[b.nama,b.stok]));
  const win=Math.max(1, Math.round((new Date(TODAY+"T00:00:00")-new Date(from30+"T00:00:00"))/864e5)+1);
  const masuk={}, reject={}, buka={}, buka30={}, lastIn={}, prodTot={}, prod30={}, hariPakai={}, prodHari={};
  for(const r of rows.pembelian){ if(!r.tgl||r.tgl<mulai) continue; const n=nm(r.bahan); let q=+r.qty||0;
    if(G2_CAIR[r.bahan] && idx[n] && idx[n].satuan==="jirigen") q = r.jirigen!=null ? +r.jirigen : q/(+idx[n].isi||25); // catatan lama (liter) → jirigen
    const j=jenisOf(r);
    if(j==="masuk"){ masuk[n]=(masuk[n]||0)+q; if(!lastIn[n]||r.tgl>lastIn[n]) lastIn[n]=r.tgl; }
    else if(j==="buka"){ buka[n]=(buka[n]||0)+q; if(r.tgl>=from30&&r.tgl<=TODAY){ buka30[n]=(buka30[n]||0)+q; (hariPakai[n]=hariPakai[n]||new Set()).add(r.tgl); } }
    else reject[n]=(reject[n]||0)+q; }
  for(const r of rows.produksi){ if(!r.tgl||r.tgl<mulai) continue; const q=+r.qty||0; prodTot[r.produk]=(prodTot[r.produk]||0)+q; if(r.tgl>=from30&&r.tgl<=TODAY){ prod30[r.produk]=(prod30[r.produk]||0)+q; const d=prodHari[r.tgl]||(prodHari[r.tgl]={}); d[r.produk]=(d[r.produk]||0)+q; } }
  for(const t in prodHari){ const u=usage(prodHari[t],"ceil"); for(const n in u) if(u[n]>0) (hariPakai[n]=hariPakai[n]||new Set()).add(t); }
  const pakai=usage(prodTot), pakai30=usage(prod30);
  const names=new Set([...items.map(b=>b.nama),...Object.keys(masuk),...Object.keys(reject),...Object.keys(buka),...Object.keys(pakai)]);
  const list=[...names].map(n=>{ const it=idx[n]||{}; const jir=it.satuan==="jirigen";
    const awal = it.awal!=null ? +it.awal : (lama[n]!=null ? lama[n] : 0);
    const m=masuk[n]||0, rj=reject[n]||0, pk=(pakai[n]||0)+(buka[n]||0), kor=(it.koreksi||[]).reduce((a,k)=>a+(+k.qty||0),0);
    const stok=awal+m-rj-pk+kor, p30=(pakai30[n]||0)+(buka30[n]||0), nh=hariPakai[n]?hariPakai[n].size:0, min=+it.min||0;
    const perProd=nh?p30/nh:0, hariProd=perProd>0?stok/perProd:null, hari=p30>0?stok/(p30/win):null, kirim=kirimOf({...it,nama:n});
    let st="ok"; if(it.nonaktif) st="off"; else if(stok<0) st="bad"; else if((hari!==null&&hari<kirim)||(min>0&&stok<min)) st="warn"; else if(p30===0) st="idle";
    return {nama:n, hariProd, perProd, nh, win, kirim, habis:hari!==null&&hari>=0?addDays(TODAY,Math.floor(hari)):"", awal, awalLama:it.awal==null, masuk:m, reject:rj, buka:buka[n]||0, pakai:pk, koreksi:kor, off:!!it.nonaktif, stok, p30, hari, min, st, lastIn:lastIn[n]||"", known:!!idx[n], jir, isi:+it.isi||0};
  });
  const order=Object.fromEntries(items.map((b,i)=>[b.nama,i]));
  return {list:list.sort((a,b)=>(order[a.nama]??1e6)-(order[b.nama]??1e6)||a.nama.localeCompare(b.nama,"id")), prodTot};
}

/* laporan pemakaian jirigen: jirigen dibuka vs liter produk */
function jirigenReport(m){
  const c=S.calc, mulai=g2Mulai(), pm=PMAP(), jir=g2Jirigen(); const days={};
  const day=t=>days[t]||(days[t]={tgl:t, buka:{}, liter:{}});
  for(const r of c.rows.pembelian){ if(!r.tgl||r.tgl<mulai||r._m!==m||jenisOf(r)!=="buka") continue; const d=day(r.tgl); d.buka[r.bahan]=(d.buka[r.bahan]||0)+(+r.qty||0); }
  for(const r of c.rows.produksi){ if(!r.tgl||r.tgl<mulai||r._m!==m) continue; const cr=g2Cair(r.produk); if(!cr) continue; const p=pm[r.produk]; const d=day(r.tgl); d.liter[cr]=(d.liter[cr]||0)+(+r.qty||0)*((p&&p.ml)||0)/1000; }
  return {jir, rows:Object.values(days).sort((a,b)=>a.tgl.localeCompare(b.tgl))};
}
function jirigenPanel(){
  const c=S.calc; const mulai=g2Mulai(); const months=c.months.filter(k=>k>=mulai.slice(0,7)); if(!months.length) months.push(TODAY.slice(0,7));
  if(!months.includes(S.ui.jirMonth)) S.ui.jirMonth=months.includes(TODAY.slice(0,7))?TODAY.slice(0,7):months[months.length-1];
  const R=jirigenReport(S.ui.jirMonth); const J=R.jir.filter(b=>!b.nonaktif);
  const sel=(n,d)=>{ const b=J.find(x=>x.nama===n); const lt=(d.buka[n]||0)*(+b.isi||0), lp=d.liter[n]||0; return {jb:d.buka[n]||0, lt, lp, s:lt-lp}; };
  const cell=x=>`<td class="n">${x.jb?fmt(x.jb):"—"}</td><td class="n">${fmt(Math.round(x.lp*10)/10)}</td><td class="n ${x.s<0?"neg":""}">${x.jb||x.lp?(x.s>0?"+":"")+fmt(Math.round(x.s*10)/10):"—"}</td>`;
  const tot={tgl:"",buka:{},liter:{}}; for(const d of R.rows) for(const b of J){ tot.buka[b.nama]=(tot.buka[b.nama]||0)+(d.buka[b.nama]||0); tot.liter[b.nama]=(tot.liter[b.nama]||0)+(d.liter[b.nama]||0); }
  return `<section class="panel" style="margin-top:20px"><div class="ph"><div><h2>Pemakaian jirigen</h2><div class="hint">Jirigen dibuka × isi dibanding liter produk yang dihasilkan. Selisih plus berarti cairan yang dibuka lebih banyak dari yang jadi produk.</div></div>
    <select id="jirMonth" data-ui="jirMonth" aria-label="Bulan">${months.slice().reverse().map(k=>`<option value="${k}"${k===S.ui.jirMonth?" selected":""}>${fmonth(k)}</option>`).join("")}</select></div>
    ${R.rows.length?`<div class="tw"><table><thead><tr><th rowspan="2">Tanggal</th>${J.map(b=>`<th colspan="3" class="c">${esc(b.nama)} <span class="hint">(${fmt(b.isi)} L)</span></th>`).join("")}</tr>
      <tr>${J.map(()=>`<th class="n">Dibuka</th><th class="n">Liter produk</th><th class="n">Selisih L</th>`).join("")}</tr></thead><tbody>
      ${R.rows.map(d=>`<tr><td>${fdate(d.tgl)}</td>${J.map(b=>cell(sel(b.nama,d))).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td>${J.map(b=>cell(sel(b.nama,tot))).join("")}</tr></tfoot></table></div>`
    :`<div class="empty">Belum ada produksi atau jirigen dibuka di bulan ini.</div>`}</section>`;
}

function bahanG2Table(){
  const q=S.ui.bahanQ.toLowerCase(); const list=S.calc.bahan.filter(b=>(!q||b.nama.toLowerCase().includes(q))&&(S.ui.bahanF==="semua"?!b.off:b.st===S.ui.bahanF));
  if(!list.length) return `<div class="empty">Tidak ada bahan yang cocok.</div>`;

/* =================== Laporan stok bahan bulanan + nilai stok =================== */
function g2Norm(rows){ // pembelian sejak tanggal mulai, nama & satuan sudah disamakan
  const mulai=g2Mulai(), alias=g2Alias(), idx=Object.fromEntries(S.bahan.map(b=>[b.nama,b])); const nm=n=>idx[n]?n:(alias[n]||n);
  return rows.pembelian.filter(r=>r.tgl&&r.tgl>=mulai).map(r=>{ const n=nm(r.bahan); let q=+r.qty||0;
    if(G2_CAIR[r.bahan]&&idx[n]&&idx[n].satuan==="jirigen") q=r.jirigen!=null?+r.jirigen:q/(+idx[n].isi||25); return {tgl:r.tgl, n, q, j:jenisOf(r)}; });
}
function akhirBulan(m){ const d=new Date(m+"-01T00:00:00"); d.setMonth(d.getMonth()+1); d.setDate(0); return isoDate(d); }
function g2Bulanan(m){
  const mulai=g2Mulai(), rows=S.calc.rows; const dari=(m+"-01")<mulai?mulai:m+"-01", sampai=akhirBulan(m);
  const P=g2Norm(rows), lama=Object.fromEntries(bahanLamaCalc(rows,mulai).map(b=>[b.nama,b.stok]));
  const prodUpTo=t=>{ const o={}; for(const r of rows.produksi) if(r.tgl&&r.tgl>=mulai&&r.tgl<=t) o[r.produk]=(o[r.produk]||0)+(+r.qty||0); return o; };
  const u0=usage(prodUpTo(addDays(dari,-1))), u1=usage(prodUpTo(sampai));
  const sum=(n,j,a,b)=>P.reduce((s,x)=>s+(x.n===n&&(j==="lain"?(x.j!=="masuk"&&x.j!=="buka"):x.j===j)&&x.tgl>=a&&x.tgl<=b?x.q:0),0);
  const items=S.bahan.filter(b=>!b.nonaktif);
  const list=items.map(it=>{ const n=it.nama; const awal0=it.awal!=null?+it.awal:(lama[n]!=null?lama[n]:0);
    const kor=(a,b)=>(it.koreksi||[]).reduce((s,k)=>s+((k.tgl||"")>=a&&(k.tgl||"")<=b?(+k.qty||0):0),0);
    const sebelum=addDays(dari,-1);
    const awal=awal0+sum(n,"masuk",mulai,sebelum)-sum(n,"lain",mulai,sebelum)-sum(n,"buka",mulai,sebelum)-(u0[n]||0)+kor("0000",sebelum);
    const masuk=sum(n,"masuk",dari,sampai), keluar=sum(n,"lain",dari,sampai), pakai=(u1[n]||0)-(u0[n]||0)+sum(n,"buka",dari,sampai), k=kor(dari,sampai);
    const akhir=awal+masuk-keluar-pakai+k; const pihak=pihakOf(it), harga=pihak?0:hargaOf(it,m);
    return {nama:n, jir:it.satuan==="jirigen", awal, masuk, keluar, pakai, kor:k, akhir, pihak, harga, nilai:pihak?0:Math.max(0,akhir)*harga};
  });
  return {m, dari, sampai, list, total:list.reduce((a,x)=>a+x.nilai,0), tanpaHarga:list.filter(x=>!x.pihak&&!x.harga).length, nPihak:list.filter(x=>x.pihak).length};
}

/* =================== Pemakaian bahan per bulan & per tahun =================== */
const PT_GRUP=[["semua","Semua"],["botol","Botol"],["stiker","Stiker botol"],["stkarton","Stiker karton"],["karton","Karton"],["jerigen","Jerigen"],["aks","Shieldtag & hologram"],["brosur","Brosur"],["lain","Lainnya"]];
function ptGrup(n){
  if(/^Stiker (Karton|Kardus)/i.test(n)) return "stkarton";
  if(/^Stiker/i.test(n)) return "stiker";
  if(/^Botol/i.test(n)) return "botol";
  if(/^(Karton|Kardus)/i.test(n)) return "karton";
  if(/^(Jerigen|Jirigen)|Bahan Baku|Asam Amino/i.test(n)) return "jerigen";
  if(/Shieldtag|Sealtag|Hologram|Tutup/i.test(n)) return "aks";
  if(/^Brosur/i.test(n)) return "brosur";
  return "lain";
}
function ptHarga(it,m){ if(!it) return 0; const h=hargaOf(it,m); if(h) return h; const hs=(it.harga||[]).slice().sort((a,b)=>a.mulai.localeCompare(b.mulai)); return hs.length?+hs[0].harga:0; }
const PT={};
function ptHitung(y){
  if(PT.c===S.calc && PT.y===y && PT.t===S.trx) return PT.r;
  const rows=S.calc.rows, mulai=g2Mulai(), alias=g2Alias(), idx=Object.fromEntries(S.bahan.map(b=>[b.nama,b]));
  const nm=n=>idx[n]?n:(alias[n]||n);
  const cair=(nOld,n,q,r)=>{ if(G2_CAIR[nOld]&&idx[n]&&idx[n].satuan==="jirigen") return r&&r.jirigen!=null?+r.jirigen:q/(+idx[n].isi||25); return q; };

function rekapTetap(dari, sampai){
  const ms=[...new Set(Object.keys(S.absen||{}))].filter(m=>m>=dari.slice(0,7)&&m<=sampai.slice(0,7));
  const recs=ms.flatMap(m=>absenRecs(m)).filter(r=>r.tgl>=dari&&r.tgl<=sampai&&r.status==="ok");
  return (S.pekerja||[]).filter(p=>isTetap(p)&&wajibAbsen(p)).map(p=>{ const mine=recs.filter(r=>r.pid===p.id); const tgls=[...new Set(mine.map(r=>r.tgl))].sort(); const tj=tarifJamOf(p.id);
    const hari=tgls.map(t=>{ const m=mine.find(r=>r.tgl===t&&r.tipe==="masuk"), pl=mine.find(r=>r.tgl===t&&r.tipe==="pulang"); const tl=m&&!m.izin?(m.telat||0):0; const lb=pl&&pl.lemburStatus==="ok"?(pl.lembur||0):0;
      return {tgl:t, m, pl, telat:tl, pot:tl*tj/60, lembur:lb, nLembur:bolehLembur(p)?lb*tj/60:0}; });
    const sum=k=>hari.reduce((a,h)=>a+h[k],0);
    return {p, tj, hari, hadir:hari.filter(h=>h.m).length, telat:sum("telat"), pot:sum("pot"), lembur:sum("lembur"), nLembur:sum("nLembur")}; });
}

async function hapusAbsen(rec){
  const m=rec.tgl.slice(0,7); const p=(S.pekerja||[]).find(x=>x.id===rec.pid);
  await mutate(m, b=>{ b.items=b.items.filter(x=>x.id!==rec.id); }, "absen");
  if(rec.tipe==="masuk" && p && !isTetap(p)) await mutate(m, b=>{ b.pekerja=b.pekerja.filter(x=>!(x.pid===p.id&&x.tgl===rec.tgl&&x.dariAbsen)); });
  if(!rec.manual) await fs.collection("absenLog").doc(rec.id).delete().catch(()=>{});

async function saveAbsenEdit(){
  const M=S.modal, d=M.d; if(!/^\d{1,2}:\d{2}$/.test(d.jam||"")){ toast("Isi jam dengan benar."); return; }
  const ket=String(d.ket||"").trim(); const now=new Date().toISOString(); const m=M.tgl.slice(0,7);

  try{

      const p=M.p; const lb=String(d.lembur||"").trim()===""?lemburDari(d.jam,d.lewat):Math.max(0,Math.round(num(d.lembur)||0));
      const rec=newRec(p, "man_"+rid(), "pulang", {tgl:M.tgl, jam:d.jam, lewat:!!d.lewat}, null, {manual:true, ket, lembur:lb, lemburStatus:"ok", hist:[{by:S.uid, at:now, ket:"Lembur dicatat manual: pulang "+d.jam+(d.lewat?" (lewat tengah malam)":"")+", lembur "+mntTxt(lb)+" · "+ket}]});
      await mutate(m, b=>{ if(!b.items.some(r=>r.pid===p.id&&r.tgl===M.tgl&&r.tipe==="pulang")) b.items.push(rec); }, "absen");
    } else if(M.isNew){ if(!ket){ M.busy=false; renderModal(); toast("Isi keterangan, mis. lupa absen atau HP rusak."); return; }
      const p=M.p; const rec=newRec(p, "man_"+rid(), "masuk", {tgl:M.tgl, jam:d.jam}, null, {manual:true, izin:!!d.izin, ket, hist:[{by:S.uid, at:now, ket:"Dicatat manual: "+d.jam+(d.izin?", izin":"")+" · "+ket}]});
      await mutate(m, b=>{ if(!b.items.some(r=>r.pid===p.id&&r.tgl===M.tgl&&r.tipe==="masuk")) b.items.push(rec); }, "absen");
      if(!isTetap(p)) await mutate(m, b=>{ if(!b.pekerja.some(x=>x.pid===p.id&&x.tgl===M.tgl)) b.pekerja.push(pekerjaDariAbsen(p, M.tgl)); });
    } else {
      const r=M.rec; const lb=M.tipe==="pulang"&&String(d.lembur||"").trim()===""?lemburDari(d.jam,d.lewat):Math.max(0, Math.round(num(d.lembur)||0));
      const ch=[]; if(d.jam!==r.jam) ch.push("jam "+r.jam+" → "+d.jam); if(M.tipe==="masuk"&&!!d.izin!==!!r.izin) ch.push(d.izin?"izin, tidak dipotong":"izin dibatalkan"); if(M.tipe==="pulang"&&(r.lemburStatus!=="ok"||lb!==(r.lembur||0))) ch.push("lembur "+mntTxt(lb)); if(ket!==(r.ket||"")) ch.push("keterangan"); if(M.tipe==="pulang"&&!!d.lewat!==!!r.lewatHari) ch.push(d.lewat?"lewat tengah malam":"tidak lewat tengah malam"); if(!!d.simpanFoto!==!!r.simpanFoto) ch.push(d.simpanFoto?"foto disimpan":"foto tidak disimpan");
      if(!ch.length){ S.modal=null; renderModal(); return; }
      await mutate(m, b=>{ b.items=b.items.map(x=>{ if(x.id!==r.id) return x; const y={...x, jam:d.jam, ket, simpanFoto:!!d.simpanFoto, hist:[...(x.hist||[]), {by:S.uid, at:now, ket:ch.join(", ")+(ket?" · "+ket:"")}]};
        if(M.tipe==="masuk"){ y.izin=!!d.izin; y.telat=telatDari(d.jam); } else { y.lewatHari=!!d.lewat; y.lemburUsul=lemburDari(d.jam, !!d.lewat); y.lembur=lb; y.lemburStatus="ok"; } return y; }); }, "absen");
    }
    S.modal=null; renderModal(); toast("Absen disimpan.");
  }catch(e){ M.busy=false; renderModal(); writeErr(e); }
}

/* ---- riwayat absen pekerja harian (60 hari), disalin ke absenSaya/{uid} oleh perangkat Admin/Akses penuh ---- */
const RIWAYAT_HARI = 60;
let syncTimer=null;
function syncAbsenSaya(){
  if(!fs || !(role()==="admin"||role()==="penuh") || !can("viewKeu") || !S.ready.pekerja || !S.ready.trx || !S.absen || !S.gaji) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(async ()=>{
    const dari=addDays(TODAY,-RIWAYAT_HARI+1); S.asCache=S.asCache||{};
    for(const p of (S.pekerja||[]).filter(p=>p.uid && !isTetap(p) && p.aktif!==false)){
      const R=rekapOrang(dari, TODAY, p.id)[0]; const hm=Object.fromEntries(((R&&R.hari)||[]).map(h=>[h.tgl,h]));
      const tgls=new Set(Object.keys(hm)); for(const m of Object.keys(S.absen)) for(const r of absenRecs(m)) if(r.pid===p.id&&r.tipe==="masuk"&&r.tgl>=dari) tgls.add(r.tgl);
      const items=[...tgls].sort().reverse().map(t=>{ const r=recOf(p.id,t,"masuk"), h=hm[t];
        return {tgl:t, jam:r?r.jam:"", telat:r&&!r.izin?(r.telat||0):0, izin:!!(r&&r.izin&&r.telat), status:r?r.status:(h?"ok":""), manual:!!(r&&r.manual), ket:r&&r.ket||"",
          shift:h?h.nS:0, liter:h?Math.round(h.liter*100)/100:0, upahShift:h?Math.round(h.upahShift):0, upahLt:h?Math.round(h.upahLt):0, pot:h?Math.round(h.pot):0, total:h?Math.round(h.total):0}; });
      const key=JSON.stringify(items); if(S.asCache[p.uid]===key) continue;
      try{ await fs.collection("absenSaya").doc(p.uid).set({nama:p.nama, items, at:new Date().toISOString()}); S.asCache[p.uid]=key; }catch(e){}
    }
  }, 4000);
}
function watchSaya(){

      <div class="n">${x.status==="tolak"?`<span class="hint">tidak dihitung</span>`:`<b>${rp(x.total)}</b>${x.pot?`<div class="hint neg">− ${rp(x.pot)} telat</div>`:""}${x.upahLt?`<div class="hint">+ ${rp(x.upahLt)} liter</div>`:""}`}</div></div>`).join("")}</div>`; }).join("")}

const isLeader = p => !!p && p.aktif!==false && !isTetap(p) && p.jabatan==="Leader";

function kbWatch(tgl, uid){
  if(!fs||!uid) return; S.kbW=S.kbW||new Set(); S.kb=S.kb||{}; const id=kbId(tgl,uid); if(S.kbW.has(id)) return; S.kbW.add(id);
  S.unsub.push(fs.collection("kebersihan").doc(id).onSnapshot(s=>{ S.kb[id]=s.exists?{id,...s.data()}:null; schedule(); }, ()=>{ S.kb[id]=null; schedule(); }));
}
function kbDoc(tgl,uid){ return (S.kb||{})[kbId(tgl,uid)]; }
function kbStatusPill(d){ if(!d) return pill("idle","Belum kirim"); return d.status==="ok"?pill("ok","Bersih, disetujui"):d.status==="ulang"?pill("bad","Diminta foto ulang"):pill("warn","Menunggu dicek"); }

function kbResize(f){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(f);

  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("foto")); }; img.src=url; }); }

async function kbCleanup(){
  if(S.kbClean||!(role()==="admin"||role()==="penuh")) return; S.kbClean=true;
  let last=""; try{ last=localStorage.getItem("ptcn-kbclean")||""; }catch(e){}
  if(last===TODAY) return; const L=kbLeaders(); if(!L.length) return;
  const cut=addDays(TODAY,-KB_HARI); const b=fs.batch(); let n=0;
  for(let i=1;i<=30;i++){ const t=addDays(cut,-i); for(const p of L){ b.delete(fs.collection("kebersihan").doc(kbId(t,p.uid))); n++; } }
  try{ if(n) await b.commit(); localStorage.setItem("ptcn-kbclean",TODAY); }catch(e){}

function ensureRH(tgl){
  if(!fs || !tgl) return; S.rhW=S.rhW||new Set(); S.rh=S.rh||{}; if(S.rhW.has(tgl)) return; S.rhW.add(tgl);
  S.unsub.push(fs.collection("rencanaHarian").doc(tgl).onSnapshot(s=>{ S.rh[tgl]=s.exists?s.data():null; schedule(); }, ()=>{ S.rh[tgl]=null; }));
}

function rhShiftOf(pid, tgl){ const d=(S.rh||{})[tgl]; if(!d) return null; if(d.shift) return String(d.shift); const x=(d.pekerja||[]).find(y=>y.pid===pid); return x?String(x.shift||"1"):null; }

function rhCard(){

}

async function saveRH(){
  const tgl=S.ui.rhTgl; const D=S.rhEdit&&S.rhEdit[tgl]; if(!D) return;
  const items=D.items.filter(i=>i.produk&&num(i.qty)>0).map(i=>({produk:i.produk, qty:num(i.qty), prioritas:!!i.prioritas}));
  const shift=D.shift==="2"?"2":"1";
  S.rhBusy=true; render();
  try{ await quick(fs.collection("rencanaHarian").doc(tgl).set({tgl, items, catatan:String(D.catatan||"").trim(), shift, by:S.uid, at:new Date().toISOString()}));
    // shift ikut diperbarui untuk pekerja yang absennya sudah disetujui di tanggal itu
    if((S.trx[monthOf(tgl)]?.pekerja||[]).some(r=>r.tgl===tgl&&r.dariAbsen&&String(r.shift)!==shift))
      await mutate(monthOf(tgl), b=>{ b.pekerja=b.pekerja.map(r=>r.tgl===tgl&&r.dariAbsen?{...r, shift}:r); });
    delete S.rhEdit[tgl]; toast("Rencana "+fdate(tgl)+" disimpan."); }catch(e){ writeErr(e); }
  S.rhBusy=false; render();
}

/* =================== Daftar PO (Rencana produksi) =================== */
// Data: shared/po {list:[{id,no,distributor,tglMasuk,target,ket,items:[{produk,qty}],urgent:{target,items:[{produk,qty,base}]}|null,tutup:bool,at,by}], order:["id:u","id:s",...]}
const poN = s => String(s||"").trim().toLowerCase();
const poList = () => ((S.poData&&S.poData.list)||[]);
function poSent(po){
  const o={}; const rows=(S.calc&&S.calc.rows&&S.calc.rows.keluar)||[];
  for(const r of rows){ if(r.jenis==="sample") continue;
    const hit = r.poId ? r.poId===po.id : (po.no && poN(r.noPo)===poN(po.no) && (!po.tglMasuk || !r.tgl || r.tgl>=po.tglMasuk));
    if(hit) o[r.produk]=(o[r.produk]||0)+(+r.qty||0); }
  return o;
}
function poState(po){
  const sent=poSent(po); const um=Object.fromEntries(((po.urgent&&po.urgent.items)||[]).map(i=>[i.produk,i]));
  const items=(po.items||[]).filter(i=>i.produk&&num(i.qty)>0).map(i=>{ const q=num(i.qty), s=sent[i.produk]||0, rem=Math.max(0,q-s);
    const u=um[i.produk]; const urg=u?Math.min(rem, Math.max(0,(+u.base||0)+num(u.qty)-s)):0;
    return {produk:i.produk, q, sent:s, rem, urg, sisa:rem-urg}; });
  const tot=items.reduce((a,i)=>a+i.q,0), kirim=items.reduce((a,i)=>a+Math.min(i.q,i.sent),0);
  const urgRem=items.reduce((a,i)=>a+i.urg,0), sisaRem=items.reduce((a,i)=>a+i.sisa,0);
  return {items, tot, kirim, urgRem, sisaRem, done: tot>0 && urgRem+sisaRem===0, aktif: !po.tutup && urgRem+sisaRem>0};
}
function poSlots(){
  const map={}; for(const po of poList()){ const st=poState(po); if(!st.aktif) continue;
    if(st.urgRem>0) map[po.id+":u"]={key:po.id+":u", po, st, part:"u", items:st.items.filter(i=>i.urg>0).map(i=>({produk:i.produk, rem:i.urg}))};
    if(st.sisaRem>0) map[po.id+":s"]={key:po.id+":s", po, st, part:"s", items:st.items.filter(i=>i.sisa>0).map(i=>({produk:i.produk, rem:i.sisa}))}; }
  const ord=((S.poData&&S.poData.order)||[]).filter(k=>map[k]); for(const k in map) if(!ord.includes(k)) ord.push(k);
  return ord.map(k=>map[k]).sort((a,b)=>(poSt(a.po)==="masuk")-(poSt(b.po)==="masuk"));
}
function poOrderKeys(){ return poSlots().map(s=>s.key); }
function needOf(tot){ return {...g2CairNeed(tot).out, ...usage(tot,"ceil")}; }
function poAlloc(){
  const slots=poSlots(); const pm=Object.fromEntries(S.calc.produk.map(p=>[p.nama,p])); const bm=Object.fromEntries(S.calc.bahan.map(b=>[b.nama,b]));
  const pool={}; const cum={}; let prevNeed={}, prevShort={};
  for(const s of slots){
    s.prod={}; s.fromStock=0; s.perlu=0;
    for(const i of s.items){ if(pool[i.produk]==null) pool[i.produk]=Math.max(0,pm[i.produk]?.stok||0);
      const fs=Math.min(pool[i.produk], i.rem); pool[i.produk]-=fs; s.fromStock+=fs; i.fromStock=fs; i.prod=i.rem-fs;
      if(i.prod>0){ s.prod[i.produk]=(s.prod[i.produk]||0)+i.prod; cum[i.produk]=(cum[i.produk]||0)+i.prod; s.perlu+=i.prod; } }
    const need=needOf(cum); s.need={}; s.short={};
    for(const b in need){ const d=need[b]-(prevNeed[b]||0); if(d>0) s.need[b]=d;
      const sh=Math.max(0,need[b]-Math.max(0,bm[b]?.stok||0)); const ds=sh-(prevShort[b]||0); if(ds>0) s.short[b]=ds; prevShort[b]=sh; }
    prevNeed=need;
  }
  return {slots, totNeed:prevNeed, totShort:prevShort, prodTot:cum};
}
function poRemByProduk(){ const o={}; for(const s of poSlots()) for(const i of s.items) o[i.produk]=(o[i.produk]||0)+i.rem; return o; }
function poCanEdit(){ return S.canWrite!==false && isManajer(); }

function poGuardMsg(F, lines){
  const A=poAlloc(); if(!A.slots.length) return "";
  const firstIdx=F.poId?A.slots.findIndex(s=>s.po.id===F.poId):A.slots.length; const ahead=A.slots.slice(0, firstIdx<0?A.slots.length:firstIdx);
  const pm=Object.fromEntries(S.calc.produk.map(p=>[p.nama,p])); const agg={}; lines.forEach(l=>agg[l.item]=(agg[l.item]||0)+num(l.qty));
  const out=[];
  for(const n in agg){ const need=ahead.reduce((a,s)=>a+s.items.filter(i=>i.produk===n).reduce((b,i)=>b+i.rem,0),0); if(!need) continue;
    const stok=Math.max(0,pm[n]?.stok||0); const before=Math.max(0,need-stok), after=Math.max(0,need-(stok-agg[n])); const d=after-before;
    if(d>0){ const who=ahead.filter(s=>s.items.some(i=>i.produk===n)).map(s=>`${esc(s.po.no)}${s.part==="u"?" urgent":""} (${esc(s.po.distributor||"—")}, urutan ${A.slots.indexOf(s)+1})`); out.push(`<li><b>${esc(n)} ${fmt(d)}</b> yang disiapkan untuk ${who.join(", ")}</li>`); } }
  return out.length?`<div class="po-warn"><b>⚠ Pengiriman ini memakai stok yang disiapkan untuk PO lain:</b><ul>${out.join("")}</ul>PO tersebut jadi kurang dan perlu diproduksi lagi.
    <div class="row" style="margin-top:10px"><span class="right"></span><button type="button" class="btn" data-act="po-warn-x">Batal</button><button type="button" class="btn pri" data-act="po-warn-ok">Tetap simpan</button></div></div>`:"";
}

    case "pi-del": if(M&&M.kind==="po"){ M.d.items.splice(+v,1); renderModal(); } break;

    case "po-urg-save": { const po=poList().find(p=>p.id===M.id); if(!po) break; const st=poState(po);
      const its=st.items.map(i=>({produk:i.produk, qty:Math.min(i.rem, num(M.d.q[i.produk])), base:i.sent})).filter(i=>i.qty>0);

      po.urgent={target:M.d.target||"", items:its}; S.poData.order=[po.id+":u", ...poOrderKeys().filter(k=>k!==po.id+":u")];
      S.modal=null; renderModal(); render(); savePO("Bagian urgent "+po.no+" dipisahkan dan ditaruh di urutan 1."); break; }
    case "po-merge": { const po=poList().find(p=>p.id===v); if(!po) break; po.urgent=null; render(); savePO("Bagian urgent "+po.no+" digabungkan lagi."); break; }
    case "po-up": poMove(v,-1); break;
    case "po-down": poMove(v,1); break;
    case "po-migrate": { const old=(S.rencana.items||[]).filter(i=>num(i.po)>0); if(!old.length) break; S.modal={kind:"po", isNew:true, d:{no:"",distributor:"",tglMasuk:TODAY,target:"",ket:"Dari isian PO versi lama",tutup:false,items:old.map(i=>({produk:i.produk, qty:String(num(i.po))}))}}; renderModal(); break; }
    case "po-copy": { const A=poAlloc(); copyRows([["Bahan","Kekurangan"],...Object.entries(A.totShort).filter(([,q])=>q>0).map(([n,q])=>[n+(isJir(n)?" (jirigen)":""),q])]); break; }
    case "po-fill": { const F=S.form; const po=poList().find(p=>p.id===F.poId); if(!po) break; const st=poState(po);
      const its=st.items.filter(i=>i.rem>0); if(!its.length){ toast("PO ini sudah terkirim semua."); break; }
      F.lines=its.map(i=>({item:i.produk, qty:String(i.urg>0?i.urg:i.rem), reject:false, ket:"", jenisK:"kirim"})); render(); live();

    case "po-warn-x": if(S.form){ S.form.poWarn=""; render(); } break;
    case "po-warn-ok": if(S.form){ S.form.poOk=true; S.form.poWarn=""; submitCatat(); } break;

const HARI_ID=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

const kuotaLt = p => (p&&p.jabatan==="Leader") ? 80 : 70;
function kapPekerja(){ const ps=(S.pekerja||[]).filter(p=>p.aktif!==false&&!isTetap(p)); const L=ps.filter(p=>p.jabatan==="Leader").length, A=ps.length-L; return {L, A, base:L*80+A*70}; }
function kapHari(tgl){
  ensureRH(tgl); const K=kapPekerja(); const rh=(S.rh||{})[tgl]; const dow=new Date(tgl+"T00:00:00").getDay();
  const ada=!!(rh&&(((rh.items||[]).some(i=>i.produk&&num(i.qty)>0))||rh.shift||(rh.pekerja||[]).length));
  if(dow===0&&!ada) return {cap:0, shift:0, kerja:false, rencana:false};

  if(rh&&String(rh.shift||"")==="2"){ cap=K.base*2; sh=2; }
  else if(rh&&!rh.shift&&(rh.pekerja||[]).length){ cap=rh.pekerja.reduce((a,x)=>a+kuotaLt((S.pekerja||[]).find(q=>q.id===x.pid))*(+x.shift||1),0); sh=Math.max(1,...rh.pekerja.map(x=>+x.shift||1)); }

/* ---- saran jadwal: antrian PO dulu, sisa kapasitas untuk buffer ---- */
function bufSaran(A){
  const pm=PMAP(); const from=addDays(TODAY,-56); const kel={};
  for(const r of S.calc.rows.keluar){ if(r.jenis==="sample"||!r.tgl||r.tgl<from||r.tgl>TODAY) continue; kel[r.produk]=(kel[r.produk]||0)+(+r.qty||0); }
  const used={}; for(const s of A.slots) for(const i of s.items) used[i.produk]=(used[i.produk]||0)+(i.fromStock||0);
  const stok=Object.fromEntries(S.calc.produk.map(p=>[p.nama,Math.max(0,p.stok||0)]));
  const kurangBahan=new Set(Object.keys(A.totShort).filter(b=>A.totShort[b]>0));
  return Object.entries(kel).filter(([p])=>pm[p]&&!/- Lama$/i.test(p)).map(([p,q])=>{ const minggu=q/8, bebas=Math.max(0,(stok[p]||0)-(used[p]||0)), poLagi=A.prodTot[p]||0;

      return {p, ml:+pm[p].ml||0, minggu, bebas, saran:Math.max(0,Math.ceil((minggu-bebas-poLagi)/10)*10), blk}; })
    .filter(x=>x.minggu>=20&&x.saran>0).sort((a,b)=>b.minggu*b.ml-a.minggu*a.ml).slice(0,6);
}
function jdPlan(){
  const A=poAlloc(); const pm=PMAP(); const ltOf=r=>(+r.qty||0)*((pm[r.produk]||{}).ml||0)/1000;
  const days=[]; let t=TODAY;
  for(let n=0; days.length<8&&n<21; n++){ const k=kapHari(t); if(k.kerja){ let sisa=k.cap, sudah=0; if(t===TODAY){ sudah=S.calc.rows.produksi.filter(r=>r.tgl===TODAY).reduce((a,r)=>a+ltOf(r),0); sisa=Math.max(0,sisa-sudah); } days.push({tgl:t, ...k, sudah, sisa, lines:[]}); } t=addDays(t,1); }
  const items=[]; const blkOf={};
  for(const s of A.slots){ for(const p in s.prod){ const bs=Object.keys(needOf({[p]:1})).filter(b=>s.short[b]>0); if(bs.length) (blkOf[s.key]=blkOf[s.key]||{})[p]=bs;
    items.push({key:s.key, s, p, ml:(pm[p]||{}).ml||0, rest:s.prod[p], blocked:bs.length>0, wait:poSt(s.po)==="masuk"}); } }
  const eta={};
  const put=(it,d)=>{ if(it.rest<=0||d.sisa<=0) return; if(!it.ml){ d.lines.push({p:it.p, btl:it.rest, key:it.key, wait:it.wait}); it.rest=0; return; }
    const b=Math.min(it.rest, Math.floor((d.sisa*1000+1e-6)/it.ml)); if(b<=0) return; it.rest-=b; d.sisa-=b*it.ml/1000;
    const last=d.lines[d.lines.length-1]; if(last&&last.key===it.key&&last.p===it.p) last.btl+=b; else d.lines.push({p:it.p, btl:b, key:it.key, wait:it.wait, s:it.s}); };
  for(const d of days){ for(const it of items) if(!it.blocked) put(it,d); }
  for(const s of A.slots){ const its=items.filter(i=>i.key===s.key);
    if(!its.length){ eta[s.key]={siap:true}; continue; }
    if(its.some(i=>i.blocked)) { eta[s.key]={bahan:blkOf[s.key]}; continue; }
    if(its.some(i=>i.rest>0)) { eta[s.key]={lewat:days.length?days[days.length-1].tgl:TODAY}; continue; }
    const last=days.filter(d=>d.lines.some(l=>l.key===s.key)).pop(); eta[s.key]={tgl:last?last.tgl:TODAY}; }
  const buf=bufSaran(A).map(b=>({...b, rest:b.blk?0:b.saran}));

  return {A, days, eta, buf};
}

async function autoTugas(){
  if(autoBusy||!fs||!S.ready||!S.ready.tugas||!S.ready.pekerja||!gudangReady()) return;
  if(!["admin","penuh","gudang"].includes(role())||S.canWrite===false) return;
  const {w, out}=autoWant(); if(+w.jam.slice(0,2)<AUTO_JAM||!out.length) return;
  const sig=w.tgl+JSON.stringify(out.map(o=>[o.id,o.data&&o.data.key]))+S.tugas.filter(t=>/^auto-(bahan|prod)-/.test(t.id)).length; if(sig===autoSig && Date.now()-autoAt<600000) return;
  autoBusy=true; autoSig=sig; autoAt=Date.now(); const now=new Date().toISOString();
  try{
    const b=fs.batch(); let n=0;
    for(const o of out){ const cur=S.tugas.find(t=>t.id===o.id); const ref=fs.collection("tugas").doc(o.id);
      if(o.data){ const d=o.data;
        if(!cur){ b.set(ref,{judul:d.judul, catatan:d.catatan, untuk:o.untuk, ...(o.multi?{untukMulti:o.multi}:{}), tenggat:w.tgl, prioritas:d.prioritas, status:"belum", auto:true, autoKey:d.key, autoTgl:w.tgl, createdBy:S.uid, createdAt:now, updatedAt:now, updatedBy:S.uid}); n++; }
        else if(cur.status==="selesai"){ if(cur.autoTgl!==w.tgl){ b.update(ref,{judul:d.judul, catatan:d.catatan, ...(o.multi?{untukMulti:o.multi}:{}), tenggat:w.tgl, prioritas:d.prioritas, status:"belum", autoKey:d.key, autoTgl:w.tgl, updatedAt:now, updatedBy:S.uid, selesaiAt:firebase.firestore.FieldValue.delete(), selesaiBy:firebase.firestore.FieldValue.delete()}); n++; } }
        else if(cur.autoKey!==d.key||cur.autoTgl!==w.tgl||(o.multi&&String(cur.untukMulti||"")!==String(o.multi))){ b.update(ref,{judul:d.judul, catatan:d.catatan, ...(o.multi?{untukMulti:o.multi}:{}), tenggat:w.tgl, prioritas:d.prioritas, autoKey:d.key, autoTgl:w.tgl, updatedAt:now, updatedBy:S.uid}); n++; } }
      else if(cur&&cur.status!=="selesai"){ b.update(ref,{status:"selesai", selesaiAt:now, selesaiBy:S.uid, catatan:(cur.catatan||"")+"\n"+o.tutup, autoKey:"", autoTgl:w.tgl, updatedAt:now, updatedBy:S.uid}); n++; } }
    if(n) await quick(b.commit(),1500);
    for(const t of S.tugas.filter(t=>/^auto-(bahan|prod)-/.test(t.id))){ try{ await quick(fs.collection("tugas").doc(t.id).delete(),1500); }catch(e){} }
  }catch(e){ autoSig=""; }
  autoBusy=false;
}
